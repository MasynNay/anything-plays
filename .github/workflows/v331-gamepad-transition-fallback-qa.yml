name: 3.3.1 | Gamepad transition-release fallback

# No physical HID, ROM or camera is used. Native release is injected as a
# synthetic failure and only the mocked game state/input buffer is cleared.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-gamepad-transition-fallback-qa.yml'
      - 'anything_plays/ui_gamepad.py'
      - 'tests/test_v331_gamepad_transition_release.py'
      - 'tests/test_v331_gamepad_manual_cleanup.py'
      - 'tests/test_v31_gamepad_simulation.py'

permissions:
  contents: read

jobs:
  transition-release:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Controller handoff | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal source dependencies
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile and run controller transition regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/ui_gamepad.py tests/test_v331_gamepad_transition_release.py
          python -m unittest discover -s tests -p 'test_v331_gamepad_transition_release.py' -v
          python -m unittest discover -s tests -p 'test_v331_gamepad_manual_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_v31_gamepad_simulation.py' -v
