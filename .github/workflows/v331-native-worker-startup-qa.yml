name: 3.3.1 | Native worker startup failure recovery
on:
  pull_request:
    paths:
      - '.github/workflows/v331-native-worker-startup-qa.yml'
      - 'anything_plays/gba_emulator.py'
      - 'tests/test_v331_native_thread_startup.py'
permissions:
  contents: read
jobs:
  startup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Worker startup recovery | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install synthetic test dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - name: Exercise native worker startup and Stop lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v331_native_thread_startup.py' -v
          python -m unittest discover -s tests -p 'test_v331_native_worker_stop_confirmation.py' -v
          python -m unittest discover -s tests -p 'test_v331_native_stop_input_fence.py' -v
          python -m unittest discover -s tests -p 'test_v331_launch_error_privacy.py' -v
