name: 3.3.1 | Missing-core GUI recovery (four desktop OSes)

# Synthetic Tk/canvas objects only, no real ROM, camera, controller,
# installed core, network request, installer or release action.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-missing-core-launch-qa.yml'
      - 'anything_plays/ui_library.py'
      - 'tests/test_v32_preview_core_launch.py'
      - 'tests/test_v331_missing_core_launch_cleanup.py'

permissions:
  contents: read

jobs:
  simulated-missing-core:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Missing core cleanup | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal display-model dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile and test stable + preview missing-core flows
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/ui_library.py tests/test_v32_preview_core_launch.py tests/test_v331_missing_core_launch_cleanup.py
          python -m unittest discover -s tests -p 'test_v32_preview_core_launch.py' -v
          python -m unittest discover -s tests -p 'test_v331_missing_core_launch_cleanup.py' -v
