name: Anything Plays 3.0 | Complete offline installer lab

# Test only: builds full 18-profile, 11-core installers and checks payloads.
# Retains authenticated GitHub Actions artifacts for owner-directed evaluation,
# NOT GitHub Releases or a public 3.0 release. Third-party source, licenses,
# hardware/compatibility and signing must still be reviewed before distribution.
on:
  push:
    branches: [feature/v3.0-unified-test]
    paths:
      - '.github/workflows/v30-full-bundle.yml'
      - 'packaging/**'
      - 'fetch_mgba_core.py'
      - 'verify_bundle.py'
      - 'anything_plays/core_locator.py'
      - 'anything_plays/systems.py'
      # Changes to visible 3.0 gameplay controls must produce a NEW full
      # preview, not silently leave the old packaged builds on GitHub.
      - 'app.py'
      - 'anything_plays/ui_volume.py'
      - 'anything_plays/ui_layout.py'
      - 'anything_plays/ui_view.py'
      - 'anything_plays/ui_panels.py'
      - 'anything_plays/ui_profiles.py'
      - 'anything_plays/ui_camera.py'
      - 'anything_plays/ui_gameplay.py'
      - 'anything_plays/tracking.py'
      - 'anything_plays/zone_rendering.py'
      - 'anything_plays/libretro_input.py'
      - 'anything_plays/libretro_audio.py'
      - 'anything_plays/gba_emulator.py'
      - 'anything_plays/system_profiles.py'
      - 'anything_plays/settings_defaults.py'
      - 'tests/test_v30_multi_fish_qol.py'
      - 'tests/smoke_gui.py'
      - 'tools/check_v30_release.py'
      - 'config/v3.0-release-acceptance.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  AP_RELEASE_BUILD: '0'
  AP_V30_TEST_CORES: '1'

jobs:
  complete-installer-lab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, target: windows-x64}
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x64}
          - {runner: ubuntu-24.04, target: linux-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            python3-tk python3-venv dpkg-dev libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb
      - name: Compile complete Windows installer (test only)
        if: runner.os == 'Windows'
        shell: cmd
        run: call packaging/build_windows.bat
      - name: Compile complete macOS DMG (test only)
        if: runner.os == 'macOS'
        run: bash packaging/build_macos_dmg.sh
      - name: Compile complete Linux DEB (test only)
        if: runner.os == 'Linux'
        run: bash packaging/build_linux_deb.sh
      - name: Verify 3.0 audio, multi-target and local two-player contracts
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .build-venv/Scripts/python.exe -m unittest discover -s tests -p 'test_v30_multi_fish_qol.py' -v
          else
            .build-venv/bin/python -m unittest discover -s tests -p 'test_v30_multi_fish_qol.py' -v
          fi
      - name: Smoke-test visible preview settings in a real Tk UI
        if: runner.os == 'Linux'
        # A directly executed tests/smoke_gui.py lives under tests/, so
        # explicitly put the checked-out project root on Python's import path.
        run: PYTHONPATH=. xvfb-run -a .build-venv/bin/python tests/smoke_gui.py
      - name: Verify every console has its native core in the installed payload
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from anything_plays.systems import SYSTEMS
          from fetch_mgba_core import core_names_for_build
          target = os.environ["TARGET"]
          root = (Path("dist/AnythingPlays30Preview.app/Contents/Resources/cores")
                  if target.startswith("macos") else Path("dist/AnythingPlays/cores"))
          ext = ".dll" if target.startswith("windows") else ".dylib" if target.startswith("macos") else ".so"
          expected = set(core_names_for_build())
          missing = sorted(name for name in expected if not (root / f"{name}_libretro{ext}").is_file())
          assert len(SYSTEMS) == 18, f"Unexpected system count: {len(SYSTEMS)}"
          assert len(expected) == 11, f"Unexpected native core count: {len(expected)}"
          assert not missing, f"Offline installer is missing native cores: {missing}"
          assert (root / "dolphin-emu/Sys/codehandler.bin").is_file(), "Missing GameCube Sys data"
          print(f"{target}: {len(SYSTEMS)} consoles, {len(expected)} native cores, GameCube Sys included")
          PY
      - name: Record unmet public-release gates without approving binaries
        run: python tools/check_v30_release.py --report-only
      - name: Prepare test-only installer checksum and limitations manifest
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          target = os.environ["TARGET"]
          names = {
              "windows-x64": "AnythingPlaysSetup-3.0.0-alpha.1.exe",
              "macos-arm64": "AnythingPlays-3.0.0-alpha.1.dmg",
              "macos-x64": "AnythingPlays-3.0.0-alpha.1.dmg",
              "linux-x64": "anything-plays-preview_3.0.0~alpha1_amd64.deb",
          }
          file = Path("release") / names[target]
          if not file.is_file() or file.stat().st_size < 1024 * 1024:
              raise SystemExit(f"Missing expected full preview installer: {file}")
          evidence = Path("test-evidence")
          evidence.mkdir(exist_ok=True)
          digest = hashlib.sha256()
          with file.open("rb") as stream:
              while chunk := stream.read(1024 * 1024):
                  digest.update(chunk)
          (evidence / "SHA256SUMS.txt").write_text(
              f"{digest.hexdigest()}  {file.name}\n", encoding="utf-8")
          info = {
              "status": "UNRELEASED-DEVELOPER-TEST-ONLY",
              "target": target,
              "source_revision": os.environ["GITHUB_SHA"],
              "artifact_name": file.name,
              "sha256": digest.hexdigest(),
              "size_bytes": file.stat().st_size,
              "profiles_bundled": 18,
              "emulator_cores_bundled": 11,
              "standalone_emulator_download_needed": False,
              "gamecube_sys_data_bundled": True,
              "certified_gameplay_on_physical_hardware": False,
              "public_release_approved": False,
              "third_party_license_review_complete": False,
              "notarized_or_platform_signed": False,
              "roms_or_bios_included": False,
          }
          (evidence / "FULL_PREVIEW_INFO.json").write_text(
              json.dumps(info, indent=2) + "\n", encoding="utf-8")
          print(f"Verified installable preview payload: {target}, {file.stat().st_size} bytes")
          print(f"SHA256: {digest.hexdigest()}")
          PY
      - name: Upload full offline 3.0 installer for authorized hands-on testing
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.0.0-FULL-TEST-ONLY-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.deb
            test-evidence/SHA256SUMS.txt
            test-evidence/FULL_PREVIEW_INFO.json
          if-no-files-found: error
          retention-days: 14
