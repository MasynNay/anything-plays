name: 3.1 | Camera pixels + controller coexistence (synthetic hardware)

# Real OpenCV pixel segmentation, actual source controller-input routing,
# fake SDL HID events, all 18 console input callbacks. No physical devices
# or commercial ROMs. Never authorizes public distribution.
on:
  push:
    branches: [feature/v3.1-controls-usability]
    paths:
      - ".github/workflows/v31-camera-controller-integration.yml"
      - "tests/test_v31_camera_gamepad_coexistence.py"
      - "anything_plays/ui_camera.py"
      - "anything_plays/ui_gamepad.py"
      - "anything_plays/gamepad.py"
      - "anything_plays/libretro_input.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v31-camera-controller-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-camera-controller:
    if: github.ref == 'refs/heads/feature/v3.1-controls-usability'
    name: Actual OpenCV + SDL gamepad pipeline · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install portable OpenCV image tracking and pinned pygame SDL
        run: python -m pip install "pygame-ce==2.5.8" "opencv-python-headless>=4.10,<5" "Pillow>=10,<13"
      - name: Exercise real contour-to-gameplay and controller state integration
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: python -m unittest discover -s tests -p "test_v31_camera_gamepad_coexistence.py" -v
      - name: Preserve narrow test provenance without claiming actual hardware
        env:
          AP_QA_TARGET: ${{ matrix.target }}
          AP_QA_SHA: ${{ github.sha }}
        run: |
          python -c "import cv2, json, os, pathlib, platform, pygame; result={'schema_version':1,'status':'SYNTHETIC_CAMERA_AND_CONTROLLER_PIPELINE_PASSED_ONLY','target':os.environ['AP_QA_TARGET'],'source_revision':os.environ['AP_QA_SHA'],'python_version':platform.python_version(),'opencv_version':cv2.__version__,'pygame_version':pygame.version.ver,'sdl_version':pygame.get_sdl_version(),'tracked_console_profiles':18,'physical_camera_tested':False,'physical_usb_or_bluetooth_gamepad_tested':False,'real_gameplay_tested':False,'redistribution_approved':False}; pathlib.Path('review').mkdir(exist_ok=True); pathlib.Path('review/V31_CAMERA_PAD_PIPELINE.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')"
      - name: Retain source regression result, not a shipping candidate
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.1-CAMERA-PAD-INTEGRATION-${{ matrix.target }}-SYNTHETIC
          path: review/V31_CAMERA_PAD_PIPELINE.json
          if-no-files-found: error
          retention-days: 14
