name: 3.3.1 | Safe camera Stop during native faults

# Source-only synthetic Stop and ROM lifecycle checks. No camera frames,
# ROMs, player devices, native libraries, installation or user preferences.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-camera-stop-fault-qa.yml'
      - 'anything_plays/ui_gameplay.py'
      - 'tests/test_v331_camera_stop_fault_isolation.py'
      - 'tests/test_v32_calibration_input_safety.py'

permissions:
  contents: read

jobs:
  synthetic-stop:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Camera STOP | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimum image model dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - name: Compile and run camera Stop regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/ui_gameplay.py tests/test_v331_camera_stop_fault_isolation.py
          python -m unittest discover -s tests -p 'test_v331_camera_stop_fault_isolation.py' -v
          python -m unittest discover -s tests -p 'test_v32_calibration_input_safety.py' -v
