name: 3.3.1 | Native stop input publication fence

# Real InputBuffer, synthetic Tk/SDL timings, no physical controller,
# camera, audio device, native core or game ROM.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-native-stop-input-fence-qa.yml'
      - 'anything_plays/gba_emulator.py'
      - 'tests/test_v331_native_stop_input_fence.py'
      - 'tests/test_v331_gamepad_transition_release.py'
      - 'tests/test_v331_native_worker_stop_confirmation.py'

permissions:
  contents: read

jobs:
  stop-input-fence:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Stop input fence | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal source dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Compile and test input fence
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/gba_emulator.py tests/test_v331_native_stop_input_fence.py
          python -m unittest discover -s tests -p 'test_v331_native_stop_input_fence.py' -v
          python -m unittest discover -s tests -p 'test_v331_gamepad_transition_release.py' -v
