name: 3.1 | Compile source-modified pygame in actual clean final Windows 3.1

# Real source modification in the actual source-built full 3.1.0 Windows EXE.
# Original installer immutable; only disposable app copy modified.
# Not complete LGPL Section 6 correspondence or a stable-release approval.
on:
  pull_request:
    paths:
      - '.github/workflows/v31-final-windows-modified-pygame-source-qa.yml'
      - 'tools/verify_v31_final_windows_modified_pygame.py'
      - 'tools/run_v31_final_modified_pygame_windows_smoke.py'
      - 'tests/test_v31_final_windows_modified_pygame.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ap31-clean-final-windows-source-modified-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  changed-source-native-frozen-app:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYGAME_SHA: c8200a9eaa530f884a0a4c3384cefc48006e58be
      QA_RUN: '43140637755'
      INVENTORY_RUN: '43147036559'
      QA_SHA: 104b96621ec4cb8dc39fde8c3fe96fc854c406ed
      WHEEL_NAME: pygame_ce-2.5.8-cp313-cp313-win_amd64.whl
      WHEEL_SHA: f495b0eb7a5c54c59da58e964bc7f68073c3f43cf307729fd48309104a04c190
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Reject fake modified sources, unsafe SDL archives and mutation of original install
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_v31_final_windows_modified_pygame.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Negative C source and native checks failed' }
      - name: Clone and patch pinned LGPL pygame-ce 2.5.8 original C source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git -c core.autocrlf=false clone --depth 1 --branch 2.5.8 https://github.com/pygame-community/pygame-ce.git upstream-pygame-ce
          if ($LASTEXITCODE -ne 0) { throw 'No authentic source' }
          $sha=git -C upstream-pygame-ce rev-parse HEAD
          if ($sha.Trim() -ne $env:PYGAME_SHA) { throw 'Wrong source commit' }
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          python -m tools.build_v31_modified_pygame_probe --root upstream-pygame-ce --receipt evidence/PYGAME_C_SOURCE_MODIFICATION.json
          if ($LASTEXITCODE -ne 0) { throw 'License or original C anchor failed' }
          git -C upstream-pygame-ce diff -- src_c/base.c | Set-Content evidence/PYGAME_SOURCE_MODIFICATION.patch -Encoding utf8
          if ((Get-Item evidence/PYGAME_SOURCE_MODIFICATION.patch).Length -lt 100) { throw 'No changed C source diff' }
      - name: Download exact original SDL2 2.32.10 VC SDK and locate MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path upstream-sdl -Force | Out-Null
          gh release download release-2.32.10 --repo libsdl-org/SDL --pattern SDL2-devel-2.32.10-VC.zip --dir upstream-sdl
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDL 2.32.10 developer SDK unavailable' }
          python -c "from pathlib import Path; import hashlib; p=Path('upstream-sdl/SDL2-devel-2.32.10-VC.zip'); assert hashlib.sha1(p.read_bytes()).hexdigest()=='27f5179346a0b0db80c4dd1769c7c9d62b9a91f3'"
          if ($LASTEXITCODE -ne 0) { throw 'Official SDL developer ZIP checksum mismatch' }
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'MSVC VS locator missing' }
          $vs=(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if (-not $vs) { throw 'No native Windows x64 C compiler' }
          $vcvars=Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw 'MSVC vcvars64 missing' }
          "AP31_VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile actual changed pygame C as a Windows x64 CPython 3.13 PE DLL
        shell: cmd
        run: |
          call "%AP31_VCVARS%"
          if errorlevel 1 exit /b 1
          where cl.exe
          python -m tools.build_v31_modified_pygame_windows --source upstream-pygame-ce --sdl-archive upstream-sdl\SDL2-devel-2.32.10-VC.zip --out source-compiled --source-receipt evidence\PYGAME_C_SOURCE_MODIFICATION.json --receipt evidence\ACTUAL_WINDOWS_C_BUILD.json
          if errorlevel 1 exit /b 1
      - name: Authenticate exact genuine new clean final source and native inventory runs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $qa=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QA_RUN" | ConvertFrom-Json
          $inv=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INVENTORY_RUN" | ConvertFrom-Json
          if ($qa.head_sha -ne $env:QA_SHA -or $qa.conclusion -ne 'success' -or $qa.status -ne 'completed') { throw 'Unrecognized source-built clean final 3.1.0 installer run' }
          if ($inv.conclusion -ne 'success' -or $inv.status -ne 'completed') { throw 'Exact final four-platform native inventory was not successful' }
          New-Item -ItemType Directory -Path original,wheel,inventory -Force | Out-Null
          gh run download $env:QA_RUN --repo $env:GITHUB_REPOSITORY --name AnythingPlays-3.1.0-FINAL-FULL-18-windows-x64-QA-ONLY --dir original
          if ($LASTEXITCODE -ne 0) { throw 'Original exact full final 18-console package missing' }
          gh run download $env:INVENTORY_RUN --repo $env:GITHUB_REPOSITORY --name AnythingPlays-3.1.0-CLEAN-FINAL-windows-x64-NATIVE-NOTICE-INVENTORY-UNAPPROVED --dir inventory
          if ($LASTEXITCODE -ne 0) { throw 'Original native binary SHA inventory missing' }
          foreach ($p in @('AnythingPlaysSetup-3.1.0.exe','FULL_WINDOWS_QA_RECEIPT.json','FINAL_CAMERA_ONLY_OPENCV_SOURCE_QA.json')) {
            if (-not (Test-Path (Join-Path original $p))) { throw "Missing exact final $p" }
          }
          if (-not (Test-Path inventory/FINAL_NATIVE_NOTICE_INVENTORY.json)) { throw 'No exact Windows original native inventory' }
          gh release download 2.5.8 --repo pygame-community/pygame-ce --pattern $env:WHEEL_NAME --dir wheel
          if ($LASTEXITCODE -ne 0) { throw 'Official original pygame 2.5.8 wheel missing' }
          $hash=(Get-FileHash (Join-Path wheel $env:WHEEL_NAME) -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WHEEL_SHA) { throw 'Original pygame CE source wheel hash mismatch' }
          python -c 'from pathlib import Path; from tools.assemble_v31_full_windows import unpack; unpack(Path("original/AnythingPlaysSetup-3.1.0.exe"),Path("unpacked-original"))'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'unpacked-original/AnythingPlays.exe')) { throw 'Actual full final Windows Inno installer extraction failed' }

      - name: Replace genuine changed-source native ONLY in independent full final app copy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m tools.verify_v31_final_windows_modified_pygame --bundle unpacked-original --installer original/AnythingPlaysSetup-3.1.0.exe --receipt original/FULL_WINDOWS_QA_RECEIPT.json --audit inventory/FINAL_NATIVE_NOTICE_INVENTORY.json --original-wheel (Join-Path wheel $env:WHEEL_NAME) --source-receipt evidence/PYGAME_C_SOURCE_MODIFICATION.json --compiled source-compiled/base.cp313-win_amd64.pyd --destination copied-final-modified --output evidence/STAGED_WINDOWS_SOURCE_MODIFIED_NATIVE.json
          if ($LASTEXITCODE -ne 0) { throw 'No proof of authentic exact final Windows modified native replacement' }

      - name: Execute actual source-changed C code and boot copied 18-console 3.1.0 Windows desktop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m tools.run_v31_final_modified_pygame_windows_smoke --bundle copied-final-modified --installer original/AnythingPlaysSetup-3.1.0.exe --original-receipt original/FULL_WINDOWS_QA_RECEIPT.json --staged-receipt evidence/STAGED_WINDOWS_SOURCE_MODIFIED_NATIVE.json --smoke evidence/REAL_MODIFIED_WINDOWS_FROZEN_GUI_SMOKE.json --home evidence/ISOLATED_USER_HOME --output evidence/VERIFIED_WINDOWS_MODIFIED_SOURCE_AND_GUI.json
          if ($LASTEXITCODE -ne 0) { throw 'Genuine final Windows compiled C method or copied desktop failed' }
      - name: Retain exact source diff, compiled SHA and original Windows RC1 runtime receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.1.0-CLEAN-FINAL-WINDOWS-GENUINE-SOURCE-MODIFIED-PYGAME-C
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
