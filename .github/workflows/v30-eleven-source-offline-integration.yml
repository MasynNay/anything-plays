name: Anything Plays 3.0 | Eleven source-built cores in full 18-console offline installer test
# Engineering research ONLY. Build original Dolphin from pinned source on all four OSes.
# All 18 console profiles / 11 core slots preserved. Absolutely NO public
# release, native ZIP, ROM/BIOS or unapproved installer uploaded.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v30-eleven-source-offline-integration.yml'
      - 'tools/stage_v30_eleven_source_inputs.py'
      - 'tests/test_v30_eleven_source_staging.py'
      - 'anything_plays/v30_gpl_trial.py'
      - 'tools/stage_v30_ten_source_inputs.py'
      - 'tests/test_v30_ten_source_staging.py'
      - 'tools/capture_v30_n64_original_source_build.py'
      - 'tools/stage_v30_nine_source_inputs.py'
      - 'tests/test_v30_nine_source_staging.py'
      - 'tools/capture_v30_mgba_original_source.py'
      - 'tools/stage_v30_eight_source_inputs.py'
      - 'tools/capture_v30_2d_five_source_build.py'
      - 'tests/test_v30_eight_source_staging.py'
      - 'tests/test_v30_real_frozen_startup.py'
      - 'tools/probe_v30_installed_desktop_window.py'
      - 'app.py'
      - 'tools/stage_v30_gpl_trial_inputs.py'
      - 'tools/v30_pce_candidate.py'
      - 'config/v3.0-pce-pinned-source-candidates.json'
      - 'tools/probe_v30_installed_switch.py'
      - 'tests/test_v30_installed_switch.py'
      - 'tests/test_v30_gpl_trial_lifetime.py'
      - 'anything_plays/v30_gpl_trial.py'
      - 'anything_plays/core_locator.py'
      - 'fetch_mgba_core.py'
      - 'verify_bundle.py'
      - 'app.py'
      - 'anything_plays/frozen_gui_smoke.py'
      - 'tools/probe_v30_frozen_gui_launch.py'
      - 'tests/test_v30_real_frozen_gui_launch.py'
      - 'packaging/**'
      - 'tests/test_v30_gpl_full_offline_trial.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v30-eleven-original-offline-${{ github.ref }}
  # Original Dolphin native builds take many minutes. A later review commit
  # must not kill all four already-verified source builds before aggregate CI.
  cancel-in-progress: false

jobs:
  complete-offline-18-profile-11-core-lab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, target: windows-x64, ext: dll, platform: windows}
          - {runner: ubuntu-24.04, target: linux-x64, ext: so, platform: linux}
          - {runner: macos-15, target: macos-arm64, ext: dylib, platform: macos}
          - {runner: macos-15-intel, target: macos-x64, ext: dylib, platform: macos}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      AP_RELEASE_BUILD: '0'
      AP_V30_APPROVED_RELEASE: '0'
      AP_V30_TEST_CORES: '1'
      AP_V30_GPL_TRIAL: '1'
      AP_V30_PINNED_PCE: '1'
      AP_V30_PINNED_FIVE: '1'
      FIVE_SOURCE_RUN_ID: '42515151314'
      MGBA_SOURCE_RUN_ID: '42527449154'
      N64_SOURCE_RUN_ID: '42534736496'
      SOURCE_SYS_RUN_ID: '42553978214'
      AP_V30_PINNED_N64: '1'
      AP_V30_PINNED_MGBA: '1'
      AP_CORE_ARCHIVE_DIR: ${{ github.workspace }}/gpl-trial-native-inputs
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
      PLATFORM: ${{ matrix.platform }}
      OLD_INPUT_RUN_ID: '42437133733'
      GPL_SNES_RUN_ID: '42494297281'
      GPL_SEGA_RUN_ID: '42496671418'
      PINNED_PCE_RUN_ID: '42444367068'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require exact original successful upstream-source research and local fail-closed unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view "$OLD_INPUT_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$GPL_SNES_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$GPL_SEGA_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$PINNED_PCE_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$FIVE_SOURCE_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$MGBA_SOURCE_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$MGBA_SOURCE_RUN_ID" --json name --jq .name)" = "Anything Plays 3.0 | Pinned original MPL mGBA source and native GB GBC GBA (four OS)"
          test "$(gh run view "$N64_SOURCE_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$N64_SOURCE_RUN_ID" --json name --jq .name)" = "Anything Plays 3.0 | Four-platform original source-built ParaLLEl N64"
          test "$(gh run view "$SOURCE_SYS_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$SOURCE_SYS_RUN_ID" --json name --jq .name)" = "Anything Plays 3.0 | Original pinned Dolphin Sys from exact Git source"
          python -m unittest discover -s tests -p 'test_v30_stage_original_dolphin_sys.py' -v
          python -m unittest discover -s tests -p 'test_v30_ten_source_staging.py' -v
          python -m unittest discover -s tests -p 'test_v30_eleven_source_staging.py' -v
          python -m unittest discover -s tests -p 'test_v30_nine_source_staging.py' -v
          test "$(gh run view "$FIVE_SOURCE_RUN_ID" --json name --jq .name)" = "Anything Plays 3.0 | Five more source-built 2D core families (20 genuine OS jobs)"
          python -m unittest discover -s tests -p 'test_v30_eight_source_staging.py' -v
          test "$(gh run view "$PINNED_PCE_RUN_ID" --json name --jq .name)" = "Anything Plays 3.0 | PCE pinned-source replacement research"
          test "$(gh run view "$OLD_INPUT_RUN_ID" --json name --jq .name)" = "Anything Plays 3.0 | Complete offline installer lab"
          test "$(gh run view "$GPL_SNES_RUN_ID" --json name --jq .name)" = "Anything Plays 3.0 | Four-platform source-built GPLv2+ SNES candidate"
          test "$(gh run view "$GPL_SEGA_RUN_ID" --json name --jq .name)" = "Anything Plays 3.0 | Four-platform pinned GPL candidate research"
          # Regression of the original two-family trial must remain valid
          # without a pinned PCE original research artifact supplied.
          AP_V30_PINNED_PCE=0 python -m unittest discover -s tests -p 'test_v30_gpl_full_offline_trial.py' -v
          python -m unittest discover -s tests -p 'test_v30_gpl_pce_pinned_full_trial.py' -v
          python -m unittest discover -s tests -p 'test_v30_installed_switch.py' -v
          python -m unittest discover -s tests -p 'test_v30_gpl_trial_lifetime.py' -v
      - name: Retrieve 12 verified original offline build inputs and both source-built GPL alternative core families
        shell: bash
        run: |
          set -euo pipefail
          # A failed artifact request must never leave partial files for validation.
          verified_download() {
            local run="$1" artifact="$2" destination="$3" attempt scratch
            if [[ -e "$destination" || -L "$destination" ]]; then
              echo "::error::Artifact destination already exists: $destination"
              return 1
            fi
            mkdir -p "$(dirname "$destination")"
            for attempt in 1 2 3 4; do
              scratch="$destination.try-$attempt"
              if [[ -e "$scratch" || -L "$scratch" ]]; then
                echo "::error::Unexpected temporary artifact path: $scratch"
                return 1
              fi
              if gh run download "$run" --name "$artifact" --dir "$scratch"; then
                mv "$scratch" "$destination"
                return 0
              fi
              rm -rf -- "$scratch"
              if [[ "$attempt" -lt 4 ]]; then
                echo "::warning::Artifact API failure: $artifact attempt $attempt/4; retrying"
                sleep "$((attempt * 3))"
              fi
            done
            echo "::error::Unable to fetch immutable native input: $artifact"
            return 1
          }
          verified_download "$OLD_INPUT_RUN_ID" "AnythingPlays-3.0.0-NATIVE-INPUTS-UNAPPROVED-$TARGET" "original-native-inputs"
          verified_download "$GPL_SNES_RUN_ID" "AnythingPlays-3.0-SUPAFAUST-$TARGET-SOURCE-UNAPPROVED" "source-built-snes"
          verified_download "$GPL_SEGA_RUN_ID" "AnythingPlays-3.0-GPL-FOUR-OS-blastem-$TARGET-UNAPPROVED" "source-built-sega"
          verified_download "$PINNED_PCE_RUN_ID" "AnythingPlays-3.0-PCE-PINNED-SOURCE-$TARGET-UNAPPROVED" "source-built-pce"
          verified_download "$MGBA_SOURCE_RUN_ID" "AnythingPlays-3.0-PINNED-MGBA-$TARGET-SOURCE-NATIVE-UNAPPROVED" "source-built-mgba"
          verified_download "$N64_SOURCE_RUN_ID" "AnythingPlays-3.0-PARALLEL-N64-$TARGET-SOURCE-NATIVE-UNAPPROVED" "source-built-n64"
          verified_download "$SOURCE_SYS_RUN_ID" "AnythingPlays-3.0-DOLPHIN-PINNED-SOURCE-SYS-$TARGET-UNAPPROVED" "original-source-sys"
          # Windows Python normalizes artifact checksum lines to CRLF; GNU sha256sum
          # otherwise mistakes the carriage return for part of each filename.
          # Normalize line endings for the checker, never the archived file hashes.
          (cd original-source-sys && tr -d '\r' < SHA256SUMS.txt | sha256sum --check -)
          for name in fceumm stella2014 prosystem mednafen_ngp mednafen_wswan; do
            verified_download "$FIVE_SOURCE_RUN_ID" \
              "AnythingPlays-3.0-PINNED-REMAINING-$name-$TARGET-UNAPPROVED" \
              "source-built-five/$name"
          done
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_STORED
          source=Path("source-built-pce")
          members=sorted(source.iterdir())
          assert len(members)==6 and all(p.is_file() and not p.is_symlink() for p in members)
          with ZipFile("original-source-built-pce.zip","w",ZIP_STORED) as z:
              for p in members: z.write(p,arcname=p.name)
          PY
          (cd source-built-snes && sha256sum -c SHA256SUMS.txt)
          (cd source-built-sega && sha256sum -c SHA256SUMS.txt)
      - name: Install exact Windows MinGW native runtime (source-built research dependency)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
      - name: Preserve original native winpthread runtime in explicit trial input directory
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -s /mingw64/bin/libwinpthread-1.dll
          cp /mingw64/bin/libwinpthread-1.dll research-winpthread-1.dll
          test -s research-winpthread-1.dll
      - name: Replace exactly two NC core families with genuine separately named GPL source-built originals
        shell: bash
        run: |
          set -euo pipefail
          # macOS ships Bash 3.2; an empty array with set -u produces
          # an unbound-variable failure. Use a single optional safe token.
          WIN_RUNTIME_ARG=""
          if [[ "$TARGET" == "windows-x64" ]]; then
            WIN_RUNTIME_ARG="--windows-runtime=research-winpthread-1.dll"
          fi
          python -m tools.stage_v30_ten_source_inputs \
            --original-dir original-native-inputs \
            --snes-dir source-built-snes --sega-dir source-built-sega \
            --pce-artifact original-source-built-pce.zip \
            --mgba-dir source-built-mgba \
            --n64-dir source-built-n64 \
            --dolphin-sys-dir original-source-sys \
            --fceumm-dir source-built-five/fceumm \
            --stella2014-dir source-built-five/stella2014 \
            --prosystem-dir source-built-five/prosystem \
            --mednafen-ngp-dir source-built-five/mednafen_ngp \
            --mednafen-wswan-dir source-built-five/mednafen_wswan \
            --target "$TARGET" \
            --output gpl-trial-native-inputs \
            --evidence test-evidence/ORIGINAL_10_SOURCE_BUILT_NATIVE_STAGING_UNAPPROVED.json \
            ${WIN_RUNTIME_ARG:+$WIN_RUNTIME_ARG}
      - name: Install original Dolphin Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            git ninja-build cmake gcc g++ pkg-config libudev-dev libevdev-dev \
            libasound2-dev libpulse-dev libgl-dev libegl1-mesa-dev libx11-dev \
            libxi-dev libxrandr-dev libx11-xcb-dev libxext-dev libusb-1.0-0-dev
      - name: Install pristine Dolphin macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja cmake pkg-config
      - name: Require Windows source-compatible Visual Studio 2026 compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vsroot = & "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vsroot -or $vsroot -notmatch '\\18\\') { throw 'VS 2026 18.x required' }
          if (-not ((cmake --help) -join [Environment]::NewLine -match 'Visual Studio 18 2026')) { throw 'VS 2026 generator missing' }
      - name: Checkout genuine pinned pristine Dolphin and all 37 source Gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/libretro/dolphin.git original-dolphin
          git -C original-dolphin fetch --filter=blob:none origin 32c61f9d0e933331bb7087ba57e96883241b4960
          git -C original-dolphin checkout --detach 32c61f9d0e933331bb7087ba57e96883241b4960
          git -C original-dolphin submodule sync --recursive
          git -C original-dolphin -c advice.detachedHead=false submodule update --init --recursive --jobs 4
          python - <<'PY'
          from pathlib import Path
          from tools.verify_v30_dolphin_original_build import verify_original_source
          p=verify_original_source(Path('original-dolphin'))
          assert p['parent_commit']=='32c61f9d0e933331bb7087ba57e96883241b4960'
          assert p['direct_gitlinks_verified']==34 and p['nested_gitlinks_verified']==3
          print('All 37 source Gitlinks verified at exact immutable original commit')
          PY
      - name: Compile pristine source-built ELF on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S original-dolphin -B original-dolphin-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLIBRETRO=ON -DENABLE_QT=OFF \
            -DENABLE_TESTS=OFF -DENABLE_LTO=OFF -DENABLE_VULKAN=OFF \
            -DENABLE_CCACHE=OFF -DENABLE_ANALYTICS=OFF \
            -DUSE_RETRO_ACHIEVEMENTS=OFF -DUSE_SYSTEM_LIBS=OFF \
            -DUSE_MGBA=ON -DENABLE_AUTOUPDATE=OFF -DENABLE_CLI_TOOL=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$GITHUB_WORKSPACE/tools/v30_dolphin_original_link_order.cmake"
          cmake --build original-dolphin-build --target dolphin_libretro --parallel 2
      - name: Compile pristine source-built Mach-O on macOS ARM and Intel
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          arch=arm64
          if [[ "$TARGET" == macos-x64 ]]; then arch=x86_64; fi
          cmake -S original-dolphin -B original-dolphin-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$arch" \
            -DLIBRETRO=ON -DENABLE_QT=OFF -DENABLE_TESTS=OFF \
            -DENABLE_LTO=OFF -DENABLE_VULKAN=OFF -DENABLE_CCACHE=OFF \
            -DENABLE_ANALYTICS=OFF -DUSE_RETRO_ACHIEVEMENTS=OFF \
            -DUSE_SYSTEM_LIBS=OFF -DUSE_MGBA=ON -DENABLE_AUTOUPDATE=OFF \
            -DENABLE_CLI_TOOL=OFF
          cmake --build original-dolphin-build --target dolphin_libretro --parallel 3
      - name: Compile pristine source-built Windows x64 PE DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $configure=@(
            '-S', 'original-dolphin', '-B', 'original-dolphin-build',
            '-G', 'Visual Studio 18 2026', '-A', 'x64',
            '-DCMAKE_BUILD_TYPE=Release', '-DLIBRETRO=ON', '-DENABLE_QT=OFF',
            '-DENABLE_TESTS=OFF', '-DENABLE_LTO=OFF', '-DENABLE_VULKAN=OFF',
            '-DENABLE_CCACHE=OFF', '-DENABLE_ANALYTICS=OFF',
            '-DUSE_RETRO_ACHIEVEMENTS=OFF', '-DUSE_SYSTEM_LIBS=OFF',
            '-DUSE_MGBA=ON', '-DENABLE_AUTOUPDATE=OFF', '-DENABLE_CLI_TOOL=OFF'
          )
          & cmake @configure
          if ($LASTEXITCODE -ne 0) { throw 'Pristine original Windows Dolphin configure failed' }
          cmake --build original-dolphin-build --target dolphin_libretro --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Original source-built Windows Dolphin failed' }
          $dlls=@(Get-ChildItem original-dolphin-build -Recurse -File -Filter dolphin_libretro.dll)
          if ($dlls.Count -ne 1) { throw "Expected one source-built PE core, got $($dlls.Count)" }
          New-Item -ItemType Directory -Force native-candidate | Out-Null
          Copy-Item -LiteralPath $dlls[0].FullName -Destination native-candidate/dolphin_libretro.dll
      - name: Audit pristine native compiler proof and exact 34 + 3 original sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == linux-x64 ]]; then
            native=original-dolphin-build/dolphin_libretro.so
            python -m tools.verify_v30_dolphin_original_build --source original-dolphin \
              --native "$native" --output DOLPHIN_11TH_SOURCE_BUILD_PROOF_UNAPPROVED.json
          elif [[ "$TARGET" == windows-x64 ]]; then
            native=native-candidate/dolphin_libretro.dll
            python -m tools.verify_v30_dolphin_original_windows --source original-dolphin \
              --native "$native" --output DOLPHIN_11TH_SOURCE_BUILD_PROOF_UNAPPROVED.json
          else
            native=original-dolphin-build/dolphin_libretro.dylib
            native_target="$TARGET"
            if [[ "$TARGET" == macos-x64 ]]; then native_target=macos-x86_64; fi
            python -m tools.verify_v30_dolphin_original_macos --source original-dolphin \
              --native "$native" --target "$native_target" \
              --output DOLPHIN_11TH_SOURCE_BUILD_PROOF_UNAPPROVED.json
          fi
          test -s "$native"
          sha256sum "$native"
          echo "NATIVE_DOLPHIN_CORE=$native" >> "$GITHUB_ENV"
      - name: Stage all ELEVEN newly source-built core families; eliminate last buildbot Dolphin
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.stage_v30_eleven_source_inputs \
            --ten-dir gpl-trial-native-inputs --original-source original-dolphin \
            --native "$NATIVE_DOLPHIN_CORE" \
            --build-report DOLPHIN_11TH_SOURCE_BUILD_PROOF_UNAPPROVED.json \
            --target "$TARGET" --output eleven-source-native-inputs \
            --evidence test-evidence/ORIGINAL_11_SOURCE_BUILT_STAGING_UNAPPROVED.json
          mv gpl-trial-native-inputs ten-original-family-baseline
          mv eleven-source-native-inputs gpl-trial-native-inputs
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          from anything_plays.v30_gpl_trial import MARKER
          root=Path('gpl-trial-native-inputs')
          marker=json.loads((root/MARKER).read_text('utf-8'))
          assert marker['original_unchanged_core_archives']==0
          assert marker['total_source_built_core_families']==11
          assert marker['source_built_dolphin']['old_unverified_buildbot_replaced'] is True
          assert marker['source_built_dolphin']['public_binary_distribution_approved'] is False
          assert marker['source_exact_original_dolphin_sys']['public_distribution_approved'] is False
          name=marker['source_built_dolphin']['native_filename']
          with ZipFile(root/(name+'.zip')) as z:
              assert z.namelist()==[name]
          print('REPLACED historical Dolphin with genuine pinned original source-built core')
          PY
          cp DOLPHIN_11TH_SOURCE_BUILD_PROOF_UNAPPROVED.json \
            test-evidence/ORIGINAL_11TH_DOLPHIN_COMPILER_PROOF_UNAPPROVED.json
      - name: Validate exact Git original Dolphin Sys ZIP is now the embedded installed input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.stage_v30_original_dolphin_sys import exact_original_sys_artifact
          source_data, receipt=exact_original_sys_artifact("original-source-sys")
          installed=Path("gpl-trial-native-inputs/Dolphin.zip")
          assert installed.is_file() and installed.read_bytes()==source_data
          marker=json.loads(Path("gpl-trial-native-inputs/V30_GPL_TRIAL_PREVIEW_UNAPPROVED.json").read_text())
          assert marker["source_exact_original_dolphin_sys"]==receipt
          assert marker["source_exact_original_dolphin_sys"]["public_distribution_approved"] is False
          print("Exact original pinned Dolphin Git source Sys staged for full offline installer; no public rights")
          PY
      - name: Install Windows source-accurate packaging compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Install Linux complete offline package builder
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends python3-tk python3-venv dpkg-dev libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb
      - name: Build actual Windows offline GUI installer (test-only)
        if: runner.os == 'Windows'
        shell: cmd
        run: call packaging/build_windows.bat
      - name: Build actual Linux offline GUI DEB (test-only)
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/build_linux_deb.sh
      - name: Build actual Mac offline GUI DMG (test-only)
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build_macos_dmg.sh
      - name: Cold-launch the ACTUAL packaged Anything Plays Tk GUI on real OS, not just its Libretro cores
        shell: bash
        run: |
          set -euo pipefail
          # Linux GUI processes need the actual X server equivalent; the
          # existing Linux runner installed xvfb but previously never used
          # it to launch the compiled PyInstaller window.
          if [[ "$TARGET" == linux-x64 ]]; then
            xvfb-run -a -s "-screen 0 1600x900x24" \
              python tools/probe_v30_frozen_gui_launch.py \
                --target "$TARGET" \
                --report test-evidence/ACTUAL_FROZEN_GUI_STARTUP_UNAPPROVED.json
          else
            python tools/probe_v30_frozen_gui_launch.py \
              --target "$TARGET" \
              --report test-evidence/ACTUAL_FROZEN_GUI_STARTUP_UNAPPROVED.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("test-evidence/ACTUAL_FROZEN_GUI_STARTUP_UNAPPROVED.json")
          item=json.loads(p.read_text("utf-8"))
          assert item["passed"] is True,item.get("error")
          assert item["frozen_ui_initialized"] is True
          assert item["original_console_profiles"]==18
          assert item["native_exit_code"]==0
          assert item["child_original_tk_report"]["frozen_binary"] is True
          assert item["child_original_tk_report"]["actual_tk_mainloop_ran"] is True
          for flag in ("public_binary_distribution_approved","license_review_approved",
                       "camera_hardware_tested","physical_qa_approved"):
            assert item[flag] is False, flag
          print("ACTUAL FROZEN APP Tk UI WINDOW LAUNCHED ON",item["target"],"; public/QA flags FALSE")
          PY
      - name: Open actual frozen Anything Plays desktop window and run Tk App startup on each OS
        shell: bash
        run: |
