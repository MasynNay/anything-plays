name: 3.1 | Build isolated source-pinned Linux camera-only OpenCV wheel

# Engineering feasibility: produce a NEW independent wheel from SHA-pinned
# original PyPI source, leave 3.0, the 3.1.0 private draft and every user
# install untouched. This does not approve third-party redistribution.
on:
  pull_request:
    paths:
      - 'tools/qa_v31_linux_camera_only_wheel.py'
      - 'tests/test_v31_linux_camera_only_wheel.py'
      - '.github/workflows/v31-linux-camera-only-opencv-source.yml'

permissions:
  contents: read

concurrency:
  group: v31-camera-only-wheel-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  isolated-linux-camera-only-wheel:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA256: 4afa2ea1214453648be88259f035712454faa9039b686de7753569ba8eec1577
      ENABLE_HEADLESS: '1'
      ENABLE_CONTRIB: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CMAKE_ARGS: '-DWITH_FFMPEG=OFF -DWITH_GSTREAMER=OFF -DWITH_QT=OFF -DWITH_GTK=OFF -DWITH_V4L=ON -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF'
      AP_REQUIRE_OPENCV_FFMPEG_OFF: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify private receipt and camera-backend rejection regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v31_linux_camera_only_wheel.py' -v
          python -m unittest discover -s tests -p 'test_custom_opencv_wheel.py' -v
      - name: Install Linux camera build headers, tools and pinned CPython dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libv4l-dev pkg-config ninja-build cmake build-essential
          python -m pip install --upgrade 'pip==26.3'
          python -m pip install 'numpy==2.5.4'
      - name: Fetch only the pristine SHA-pinned OpenCV 4.14.0.94 source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources wheels evidence
          python -m pip download --no-deps --no-binary opencv-python-headless \
            --dest sources 'opencv-python-headless==4.14.0.94'
          test -s sources/opencv_python_headless-4.14.0.94.tar.gz
          echo "$SOURCE_SHA256  sources/opencv_python_headless-4.14.0.94.tar.gz" \
            | sha256sum --check -
      - name: Compile Linux camera-only native wheel with FFmpeg and GUI components OFF
        shell: bash
        timeout-minutes: 105
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir wheels \
            sources/opencv_python_headless-4.14.0.94.tar.gz
          test "$(find wheels -maxdepth 1 -type f -name 'opencv_python_headless-4.14.0.94-*.whl' | wc -l)" -eq 1
          echo "Found one newly built OpenCV wheel from pinned PyPI source."
      - name: Verify exact source, wheel bytes and actual imported V4L2 without FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find wheels -maxdepth 1 -type f -name 'opencv_python_headless-4.14.0.94-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --no-deps --force-reinstall "$wheel"
          python -m tools.qa_v31_linux_camera_only_wheel \
            --source sources/opencv_python_headless-4.14.0.94.tar.gz \
            --wheel "$wheel" \
            --output evidence/LINUX_CAMERA_ONLY_OPENCV_SOURCE_QA_UNAPPROVED.json
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("evidence/LINUX_CAMERA_ONLY_OPENCV_SOURCE_QA_UNAPPROVED.json").read_text("utf-8"))
          assert r["opencv_linux_v4l2_backend_available"]
          assert r["opencv_ffmpeg_backend_disabled"]
          assert r["source_sha256"] == "4afa2ea1214453648be88259f035712454faa9039b686de7753569ba8eec1577"
          for field in ("public_release_approved","redistribution_approved",
                        "tested_in_actual_frozen_3_1_app","physical_camera_tested"):
              assert r[field] is False,field
          print("Source wheel + no-FFmpeg native V4L2 probe PASSED.")
          print("Actual frozen app replacement, camera hardware and release rights not yet tested.")
          PY
      - name: Retain private pinned source, custom wheel, and honest native QA manifest
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.1-LINUX-FROM-SOURCE-CAMERA-ONLY-OPENCV-UNAPPROVED
          path: |
            sources/opencv_python_headless-4.14.0.94.tar.gz
            wheels/opencv_python_headless-4.14.0.94-*.whl
            evidence/LINUX_CAMERA_ONLY_OPENCV_SOURCE_QA_UNAPPROVED.json
          retention-days: 30
          if-no-files-found: error
