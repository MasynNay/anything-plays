name: Anything Plays 3.0 | Four-OS GPL-only alternative SNES/Sega switching
# Research-only. Downloads previously source-built GPL candidate artifacts,
# verifies ORIGINAL source/native checksums, and runs actual homebrew through
# the same CoreSession in one throwaway process, including repeated core swaps.
# No shipping bundles, installer artifacts or public release approval.
on:
  pull_request:
    branches: [feature/v3.0-unified-test]
    paths:
      - '.github/workflows/v30-gpl-native-switch.yml'
      - 'tools/probe_v30_gpl_core_switch.py'
      - 'tests/test_v30_gpl_native_switch.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v30-gpl-native-switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-core-switch-real-os:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: windows-2025, target: windows-x64}
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
      SNES_RUN: '42494297281'
      SEGA_RUN: '42496671418'
      AP_RELEASE_BUILD: '0'
      AP_V30_TEST_CORES: '0'
      AP_V30_APPROVED_RELEASE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check exact successful original source-built workflow identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view "$SNES_RUN" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$SEGA_RUN" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$SNES_RUN" --json name --jq .name)" = "Anything Plays 3.0 | Four-platform source-built GPLv2+ SNES candidate"
          test "$(gh run view "$SEGA_RUN" --json name --jq .name)" = "Anything Plays 3.0 | Four-platform pinned GPL candidate research"
          python -m unittest discover -s tests -p 'test_v30_gpl_native_switch.py' -v
      - name: Download only original 4-OS checked GPL research source/native sets
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SNES_RUN" --name "AnythingPlays-3.0-SUPAFAUST-$TARGET-SOURCE-UNAPPROVED" --dir research-native-snes
          gh run download "$SEGA_RUN" --name "AnythingPlays-3.0-GPL-FOUR-OS-blastem-$TARGET-UNAPPROVED" --dir research-native-sega
          (cd research-native-snes && sha256sum -c SHA256SUMS.txt)
          (cd research-native-sega && sha256sum -c SHA256SUMS.txt)
      - name: Install Linux native test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install required source-built Windows MinGW native runtime
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
      - name: Expose exact original MinGW runtime to Windows nested research subprocess
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -f /mingw64/bin/libwinpthread-1.dll
          echo "AP_V30_MINGW_CI_DLL_DIR=$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/v30_windows_gpl_lab" >> "$GITHUB_ENV"
      - name: Install original Python Libretro test frontend
        run: python -m pip install -r requirements.txt
      - name: Test genuine sequential SNES and Sega core changes and 5 original homebrew programs
        shell: bash
        run: |
          set -euo pipefail
          python tools/probe_v30_gpl_core_switch.py \
            --snes-dir research-native-snes --sega-dir research-native-sega \
            --target "$TARGET" --seconds 5 \
            --report test-evidence/GPL_ONLY_NATIVE_SWITCH_UNAPPROVED.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('test-evidence/GPL_ONLY_NATIVE_SWITCH_UNAPPROVED.json').read_text())
          assert x['passed'] is True and x['child_exit_code'] == 0
          assert x['details']['all_cycles_passed'] is True
          assert x['details']['cycles_completed'] == 7
          assert [c['system'] for c in x['details']['cycles']] == [
            'snes','mastersystem','gamegear','sg1000','genesis','snes','mastersystem'
          ]
          assert all(c['passed'] and c['core_nonzero_pcm_values']>100
                     and c['distinct_rgb_frames']>=2 for c in x['details']['cycles'])
          for flag in ('same_process_combined_license_review_complete',
                       'native_installer_substitution_approved',
                       'public_binary_redistribution_approved',
                       'physical_speaker_camera_saves_verified'):
              assert x[flag] is False
              assert x['details'][flag] is False
          print('ORIGINAL SOURCE-BUILT 7-CYCLE GPL CORE A/V PASSED, LICENSE/PUBLIC APPROVAL FALSE')
          PY
      - name: Retain only nonpublic research reports, never native binaries/installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.0-GPL-CORE-SWITCH-${{ matrix.target }}-UNAPPROVED
          path: test-evidence/GPL_ONLY_NATIVE_SWITCH_UNAPPROVED.json
          if-no-files-found: warn
          retention-days: 30
