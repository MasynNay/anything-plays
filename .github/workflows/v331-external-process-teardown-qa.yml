name: 3.3.1 | External emulator process teardown

# Synthetic process/IPC handles only; never starts a real GPU executable.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-external-process-teardown-qa.yml'
      - 'anything_plays/ui_external.py'
      - 'tests/test_v331_external_process_teardown.py'
      - 'tests/test_v331_rom_unload_fault_tolerance.py'

permissions:
  contents: read

jobs:
  external-process-teardown:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: External process Stop | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal desktop import dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - name: Compile and verify bounded external process cleanup
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/ui_external.py tests/test_v331_external_process_teardown.py
          python -m unittest discover -s tests -p 'test_v331_external_process_teardown.py' -v
          python -m unittest discover -s tests -p 'test_v331_rom_unload_fault_tolerance.py' -v
          python -m unittest discover -s tests -p 'test_v331_external_launch_stop_order.py' -v
