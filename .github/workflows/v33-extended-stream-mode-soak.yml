name: 3.3 | Manual 30-minute Tk Stream Mode endurance (unreleased)

# Owner-triggered deep synthetic endurance gate. Deliberately no pull_request
# trigger: avoid 30-minute CI costs on every source edit. Never publishes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v33-extended-tk-stream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-mode-30-minute-synthetic:
    if: ${{ github.ref == 'refs/heads/feature/v3.3-stream-render-latency' }}
    name: Real Tk + synthetic camera and game | 1,800 seconds | Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real Tk, SDL, OpenCV and virtual-display dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            python3-tk xvfb xauth libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Prove 30-minute Tk publication and bounded source-fit cache
        shell: bash
        timeout-minutes: 38
        run: |
          set -euo pipefail
          mkdir -p test-evidence
          PYTHONPATH=. xvfb-run -a -s '-screen 0 1600x900x24' \
            python tests/soak_gui.py --seconds 1800 --enable-stream \
              --max-growth-mb 96 \
              --report test-evidence/v33-stream-mode-1800s.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("test-evidence/v33-stream-mode-1800s.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["passed"] is True
          assert report["seconds_requested"] == 1800
          assert report["elapsed_real_seconds"] >= 1800
          assert report["stream_mode_requested"] is True
          assert report["real_stream_hardware_tested"] is False
          assert report["physical_camera_tested"] is False
          assert report["real_controller_hardware_tested"] is False
          assert report["tk_callback_exception_count"] == 0
          assert report["resident_growth_mb"] <= 96
          samples = report["samples"]
          assert len(samples) >= 250
          assert all(s["stream_items"] <= 1 for s in samples)
          assert all(s["stream_resize_cache_items"] <= 2 for s in samples)
          assert all(s["pending_tk_jobs"] <= 32 for s in samples)
          m = report["stream_final"]["metrics"]
          assert m["stream_target_refresh_fps"] == 24
          assert m["stream_refresh_intervals"] >= 2
          assert m["stream_published_images"] >= 2
          assert m["stream_failed_ticks"] == 0
          assert m["stream_resize_cache_hits"] >= 0
          assert m["stream_resize_cache_misses"] >= 0
          PY
      - name: Retain aggregate-only evidence; no screenshots, core or ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-v33-Tk-Stream-1800second-SYNTHETIC-UNRELEASED
          path: test-evidence/v33-stream-mode-1800s.json
          if-no-files-found: warn
          retention-days: 14
