name: Anything Plays 3.0 | Five more source-built 2D core families (20 genuine OS jobs)
# Original upstream public Git READ only. NEVER contact other repositories,
# publish emulator libraries, assume source licenses are compatible, or create
# the 3.0 release. Retain exact native/source proof for internal review.
on:
  pull_request:
    branches: [feature/v3.0-unified-test]
    paths:
      - '.github/workflows/v30-five-remaining-source-cores.yml'
      - 'tools/capture_v30_2d_five_source_build.py'
      - 'tests/test_v30_five_source_core_capture.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v30-five-native-source-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  five-original-native-cores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x64, candidate: fceumm, repo: libretro/libretro-fceumm, ref: 'e0f3086a8104f8fbbe49a2615b10401504a9533f', extension: so}
          - {runner: windows-2025, target: windows-x64, candidate: fceumm, repo: libretro/libretro-fceumm, ref: 'e0f3086a8104f8fbbe49a2615b10401504a9533f', extension: dll}
          - {runner: macos-15, target: macos-arm64, candidate: fceumm, repo: libretro/libretro-fceumm, ref: 'e0f3086a8104f8fbbe49a2615b10401504a9533f', extension: dylib}
          - {runner: macos-15-intel, target: macos-x64, candidate: fceumm, repo: libretro/libretro-fceumm, ref: 'e0f3086a8104f8fbbe49a2615b10401504a9533f', extension: dylib}
          - {runner: ubuntu-24.04, target: linux-x64, candidate: stella2014, repo: libretro/stella2014-libretro, ref: '7d1361e407e63f29e52892655069e5fb4096e691', extension: so}
          - {runner: windows-2025, target: windows-x64, candidate: stella2014, repo: libretro/stella2014-libretro, ref: '7d1361e407e63f29e52892655069e5fb4096e691', extension: dll}
          - {runner: macos-15, target: macos-arm64, candidate: stella2014, repo: libretro/stella2014-libretro, ref: '7d1361e407e63f29e52892655069e5fb4096e691', extension: dylib}
          - {runner: macos-15-intel, target: macos-x64, candidate: stella2014, repo: libretro/stella2014-libretro, ref: '7d1361e407e63f29e52892655069e5fb4096e691', extension: dylib}
          - {runner: ubuntu-24.04, target: linux-x64, candidate: prosystem, repo: libretro/prosystem-libretro, ref: '8a88014287c7a01cd568067e5a557d0a2b2a051f', extension: so}
          - {runner: windows-2025, target: windows-x64, candidate: prosystem, repo: libretro/prosystem-libretro, ref: '8a88014287c7a01cd568067e5a557d0a2b2a051f', extension: dll}
          - {runner: macos-15, target: macos-arm64, candidate: prosystem, repo: libretro/prosystem-libretro, ref: '8a88014287c7a01cd568067e5a557d0a2b2a051f', extension: dylib}
          - {runner: macos-15-intel, target: macos-x64, candidate: prosystem, repo: libretro/prosystem-libretro, ref: '8a88014287c7a01cd568067e5a557d0a2b2a051f', extension: dylib}
          - {runner: ubuntu-24.04, target: linux-x64, candidate: mednafen_ngp, repo: libretro/beetle-ngp-libretro, ref: 'a50d5ac288a81f2104ddf43195a4efdd15c72227', extension: so}
          - {runner: windows-2025, target: windows-x64, candidate: mednafen_ngp, repo: libretro/beetle-ngp-libretro, ref: 'a50d5ac288a81f2104ddf43195a4efdd15c72227', extension: dll}
          - {runner: macos-15, target: macos-arm64, candidate: mednafen_ngp, repo: libretro/beetle-ngp-libretro, ref: 'a50d5ac288a81f2104ddf43195a4efdd15c72227', extension: dylib}
          - {runner: macos-15-intel, target: macos-x64, candidate: mednafen_ngp, repo: libretro/beetle-ngp-libretro, ref: 'a50d5ac288a81f2104ddf43195a4efdd15c72227', extension: dylib}
          - {runner: ubuntu-24.04, target: linux-x64, candidate: mednafen_wswan, repo: libretro/beetle-wswan-libretro, ref: '4b01295838ea89e3f1355bbe4cb5cf98aa6108cd', extension: so}
          - {runner: windows-2025, target: windows-x64, candidate: mednafen_wswan, repo: libretro/beetle-wswan-libretro, ref: '4b01295838ea89e3f1355bbe4cb5cf98aa6108cd', extension: dll}
          - {runner: macos-15, target: macos-arm64, candidate: mednafen_wswan, repo: libretro/beetle-wswan-libretro, ref: '4b01295838ea89e3f1355bbe4cb5cf98aa6108cd', extension: dylib}
          - {runner: macos-15-intel, target: macos-x64, candidate: mednafen_wswan, repo: libretro/beetle-wswan-libretro, ref: '4b01295838ea89e3f1355bbe4cb5cf98aa6108cd', extension: dylib}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AP_RELEASE_BUILD: '0'
      AP_V30_APPROVED_RELEASE: '0'
      V30_SOURCE_REPO: ${{ matrix.repo }}
      V30_SOURCE_SHA: ${{ matrix.ref }}
      V30_CORE: ${{ matrix.candidate }}
      V30_TARGET: ${{ matrix.target }}
      V30_EXTENSION: ${{ matrix.extension }}
      V30_CORE_BINARY: ${{ matrix.candidate }}_libretro.${{ matrix.extension }}
      V30_SOURCE_DIR: research/remaining-original-source
    steps:
      - name: Check out original Anything Plays (no third-party mutations)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact upstream original source checkout (no upstream writes)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: research/remaining-original-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify original pinned Git source and any directly tracked GPL notice
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$V30_SOURCE_DIR" rev-parse HEAD)" = "$V30_SOURCE_SHA"
          case "$V30_CORE" in
            fceumm) notice=Copying ;;
            prosystem) notice=License.txt ;;
            mednafen_ngp|mednafen_wswan) notice=COPYING ;;
            stella2014) notice=stella/license.txt ;; # Verified original nested GPLv2 text.
            *) exit 1 ;;
          esac
          if [[ -n "$notice" ]]; then
            grep -i "GENERAL PUBLIC LICENSE" "$V30_SOURCE_DIR/$notice" >/dev/null
            grep -i "Version 2" "$V30_SOURCE_DIR/$notice" >/dev/null
          fi
          python -m unittest discover -s tests -p 'test_v30_five_source_core_capture.py' -v
      - name: Install Windows original source compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
      - name: Install Linux original native core compilers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends make gcc g++ libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Compile source-built original Linux and macOS Libretro core
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$V30_TARGET" in
            linux-x64) platform=unix ;;
            macos-arm64|macos-x64) platform=osx ;;
            *) exit 1 ;;
          esac
          if [[ "$V30_CORE" == fceumm ]]; then
            make -C "$V30_SOURCE_DIR" -f Makefile.libretro -j 3 platform="$platform"
          else
            make -C "$V30_SOURCE_DIR" -j 3 platform="$platform"
          fi
          test -s "$V30_SOURCE_DIR/$V30_CORE_BINARY"
      - name: Compile exact source-built original Windows Libretro core
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [[ "$V30_CORE" == fceumm ]]; then
            make -C "$V30_SOURCE_DIR" -f Makefile.libretro -j 3 platform=win
          else
            make -C "$V30_SOURCE_DIR" -j 3 platform=win
          fi
          test -s "$V30_SOURCE_DIR/$V30_CORE_BINARY"
      - name: Capture SHA of original tracked Git-source TAR + genuine compiled native (no assumed license rights)
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.capture_v30_2d_five_source_build \
            --source "$V30_SOURCE_DIR" --native "$V30_SOURCE_DIR/$V30_CORE_BINARY" \
            --candidate "$V30_CORE" --target "$V30_TARGET" --source-commit "$V30_SOURCE_SHA" \
            --output "test-evidence/$V30_CORE-$V30_TARGET"
      - name: Install original frontend's audio/video test dependencies
        run: python -m pip install -r requirements.txt
      - name: Source-built Windows native runtime for test interpreter ONLY
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -s /mingw64/bin/libwinpthread-1.dll
          echo "AP_V30_MINGW_CI_DLL_DIR=$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/v30_windows_gpl_lab" >> "$GITHUB_ENV"
      - name: Exercise real original cartridge video and native APU/PSG/audio for five systems
        shell: bash
        run: |
          set -euo pipefail
          DIR="test-evidence/$V30_CORE-$V30_TARGET"
          CORE="$DIR/$V30_CORE_BINARY"
          case "$V30_CORE" in
            fceumm)
              python tools/probe_nes_homebrew.py --core "$CORE" --seconds 8 --report "$DIR/ORIGINAL_NES_NATIVE_AV.json" ;;
            stella2014)
              python tools/probe_atari_homebrew.py --core "$CORE" --seconds 8 --report "$DIR/ORIGINAL_ATARI2600_NATIVE_AV.json" ;;
            prosystem)
              python tools/probe_atari7800_homebrew.py --core "$CORE" --seconds 8 --report "$DIR/ORIGINAL_ATARI7800_NATIVE_AV.json" ;;
            mednafen_ngp)
              # Original public MIT third-party research fixture is downloaded
              # READ ONLY and verified to exact original Git blob/ROM SHA.
              # Color mode ONLY; do not label it proof of mono NGP gameplay.
              python tools/probe_ngp_mit_homebrew.py --system ngpc --core "$CORE" --seconds 8 --report "$DIR/ORIGINAL_NGPC_NATIVE_AV.json" ;;
            mednafen_wswan)
              python tools/probe_wswan_homebrew.py --system ws --core "$CORE" --seconds 8 --report "$DIR/ORIGINAL_WSWAN_NATIVE_AV.json"
              python tools/probe_wswan_homebrew.py --system wsc --core "$CORE" --seconds 8 --report "$DIR/ORIGINAL_WS_COLOR_NATIVE_AV.json" ;;
            *) exit 1 ;;
          esac
      - name: Confirm genuine native A/V and all rights, real-hardware flags remain false
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('test-evidence')/(os.environ['V30_CORE']+'-'+os.environ['V30_TARGET'])
          manifest=json.loads((path/'PINNED_ORIGINAL_SOURCE_RESEARCH_UNAPPROVED.json').read_text())
          assert manifest['exact_source_revision']==os.environ['V30_SOURCE_SHA']
          assert manifest['native_filename']==os.environ['V30_CORE_BINARY']
          assert manifest['target']==os.environ['V30_TARGET']
          assert manifest['real_checkout_head_verified'] is True
          for flag in ('binary_redistribution_approved','combined_gpl_version_license_review_approved',
                       'physical_gameplay_and_webcam_qa_approved','production_source_to_binary_approved',
                       'source_submodules_and_deps_independently_reviewed'):
              assert manifest[flag] is False
          reports=sorted(path.glob('ORIGINAL_*_NATIVE_AV.json'))
          expect=2 if os.environ['V30_CORE']=='mednafen_wswan' else 1
          assert len(reports)==expect and all(json.loads(p.read_text())['passed'] is True for p in reports),reports
          print('Original source-built native+homebrew passes',os.environ['V30_CORE'],os.environ['V30_TARGET'])
          PY
      - name: Retain exact source/native/license and homebrew evidence for owner's internal audit (NEVER public release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.0-PINNED-REMAINING-${{ matrix.candidate }}-${{ matrix.target }}-UNAPPROVED
          path: test-evidence/${{ matrix.candidate }}-${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: warn
