name: 3.3.1 | Stream Mode static chassis cache
on:
  pull_request:
    paths:
      - '.github/workflows/v331-stream-chassis-cache-qa.yml'
      - 'anything_plays/ui_stream.py'
      - 'tests/test_v331_stream_chassis_cache.py'
      - 'tests/test_v331_stream_chassis_diagnostics.py'
      - 'anything_plays/ui_setup_diagnostics.py'
permissions:
  contents: read
jobs:
  cache:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Static chassis | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install synthetic dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - name: Verify pixel equivalence and bounded static cache
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v331_stream_chassis_cache.py' -v
          python -m unittest discover -s tests -p 'test_v331_stream_chassis_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_v31_stream_mode.py' -v
          python -m unittest discover -s tests -p 'test_v33_stream_publication_fence.py' -v
