name: 3.3.1 | Legacy core selector native shutdown gate

# Fake file chooser and core paths; no real DLL, ROM, device or settings IO.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-manual-core-stop-qa.yml'
      - 'anything_plays/ui_gameplay.py'
      - 'tests/test_v331_manual_core_stop_gate.py'

permissions:
  contents: read

jobs:
  safe-manual-core:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Core picker | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal Tk-backed source imports
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - name: Compile and test native worker shutdown before core changes
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/ui_gameplay.py tests/test_v331_manual_core_stop_gate.py
          python -m unittest discover -s tests -p 'test_v331_manual_core_stop_gate.py' -v
          python -m unittest discover -s tests -p 'test_v331_native_worker_stop_confirmation.py' -v
