name: 3.1.0 | Prove disposable Linux v2 camera-only OpenCV in frozen 3.1 GUI

# This workflow does NOT alter 2.0, 3.0, public RC2, the private 3.1
# GitHub draft, any user's home folder or any public binaries. It verifies
# a separate /tmp extracted, version-correct full 3.1 application only.
on:
  pull_request:
    paths:
      - '.github/workflows/v31-v20-opencv-disposable-linux-smoke.yml'
      - 'tools/probe_v31_v20_camera_only_swap.py'
      - 'tests/test_v31_v20_camera_only_swap.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-v20-disposable-cv2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  isolated-linux-runtime:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Test source-built 2.0 OpenCV within unchanged 3.1 frozen Tk executable
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      AP_V31_DISPOSABLE_QA: '1'
      CI: 'true'
      SOURCE_SHA: d852de9a513f83a329c14647ddc86bf3690fb5f5
      QA_RUN: '43120583726'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reject mutations of original installs, symlinks and false rights approvals
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_v31_v20_camera_only_swap.py -v
      - name: Install native Linux Xvfb desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo bash tools/ci_use_canonical_ubuntu_mirror.sh
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 \
            install -y --no-install-recommends \
            xvfb xauth python3-tk libgl1 libegl1 libglib2.0-0 \
            libportaudio2 libasound2t64 libx11-6
      - name: Download published 2.0 and SHA-pinned real full 3.1 source+installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original20 final31 evidence
          for asset in 'anything-plays_2.0.0_amd64.deb' SHA256SUMS.txt; do
            good=0
            for attempt in 1 2 3 4; do
              if gh release download v2.0.0 --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --dir original20 --clobber \
                && test -s "original20/$asset"; then good=1; break; fi
              sleep "$((attempt * 8))"
            done
            test "$good" = 1
          done
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" \
            --name 'AnythingPlays-3.1.0-FINAL-FULL-18-linux-x64-QA-ONLY' \
            --dir final31
          test -s final31/anything-plays-31_3.1.0_amd64.deb
          test -s final31/FULL_LIBRARY_QA_RECEIPT.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          stable=Path('original20/anything-plays_2.0.0_amd64.deb')
          text=Path('original20/SHA256SUMS.txt').read_text('utf-8').splitlines()
          vals=[x.partition("  ")[0] for x in text if x.endswith("  "+stable.name)]
          assert len(vals)==1 and hashlib.sha256(stable.read_bytes()).hexdigest()==vals[0]
          final=Path('final31/anything-plays-31_3.1.0_amd64.deb')
          report=json.loads(Path('final31/FULL_LIBRARY_QA_RECEIPT.json').read_text('utf-8'))
          assert report['source_preview_revision']==os.environ['SOURCE_SHA']
          assert report['sha256']==hashlib.sha256(final.read_bytes()).hexdigest()
          assert report['target']=='linux-x64'
          assert report['native_core_count']==11 and report['console_profiles']==18
          assert report['public_release_approved'] is False
          print('Both original package byte sources verified; no public release authorized.')
          PY
      - name: Extract both original DEBs only into a disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sandbox/old sandbox/final
          dpkg-deb -x original20/anything-plays_2.0.0_amd64.deb sandbox/old
          dpkg-deb -x final31/anything-plays-31_3.1.0_amd64.deb sandbox/final
          test -s sandbox/old/opt/anything-plays/_internal/cv2/cv2.abi3.so
          test -s sandbox/final/opt/anything-plays-31/_internal/cv2/cv2.abi3.so
          test -x sandbox/final/opt/anything-plays-31/AnythingPlays
      - name: Install older camera-only native extension into disposable final app
        shell: bash
        run: |
          set -euo pipefail
          export AP_V31_QA_SANDBOX="$PWD/sandbox"
          python -m tools.probe_v31_v20_camera_only_swap \
            --old-app "$PWD/sandbox/old/opt/anything-plays" \
            --new-app "$PWD/sandbox/final/opt/anything-plays-31" \
            --sandbox "$AP_V31_QA_SANDBOX" \
            --source-sha "$SOURCE_SHA" \
            --report evidence/CAMERA_ONLY_SWAP_UNAPPROVED.json
          test ! -d sandbox/final/opt/anything-plays-31/_internal/opencv_python_headless.libs
      - name: Boot the actual frozen 3.1 Tk GUI and DS-style Stream Mode with temporary 2.0 OpenCV
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/sandbox/final/opt/anything-plays-31/AnythingPlays"
          qahome="$(mktemp -d)"
          timeout 120s xvfb-run -a -s '-screen 0 1600x900x24' \
            env HOME="$qahome" XDG_CONFIG_HOME="$qahome/.config" \
              AP_V30_UI_SMOKE_CHECK=1 \
              AP_V31_STREAM_SMOKE_CHECK=1 \
              AP_V30_UI_SMOKE_REPORT="$PWD/evidence/FROZEN_SWAP_UI.json" \
              SDL_AUDIODRIVER=dummy "$app" --ap-v30-ui-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evidence/FROZEN_SWAP_UI.json').read_text('utf-8'))
          expected={
              'passed':True,'actual_tk_window_started':True,
              'actual_tk_mainloop_ran':True,'frozen_binary':True,
              'console_profile_count':18,
              'stream_output_window_opened':True,
              'stream_settings_separate':True,
              'stream_camera_reference_rendered':True,
              'stream_closed_cleanly':True,
              'camera_hardware_tested':False,
              'gameplay_hardware_tested':False,
              'public_distribution_approved':False,
          }
          for key,val in expected.items():
              assert data.get(key)==val,(key,data.get(key))
          print('Real disposable frozen 3.1 Tk/Stream GUI with source-built 2.0 OpenCV PASSED')
          PY
      - name: Preserve honest technical results; no altered installer ever uploaded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.1.0-LINUX-V2-CAMERA-ONLY-OPENCV-FROZEN-GUI-PROBE-PRIVATE
          path: |
            evidence/CAMERA_ONLY_SWAP_UNAPPROVED.json
            evidence/FROZEN_SWAP_UI.json
          retention-days: 30
          if-no-files-found: warn
