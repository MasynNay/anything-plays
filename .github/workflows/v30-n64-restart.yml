name: Anything Plays 3.0 | N64 repeated launch acceptance

# Independent repeatability gate: starting once is not enough. Same Python
# process must unload/reload the real bundled N64 core 3 times with video.
on:
  push:
    branches: [feature/v3.0-unified-test]
    paths:
      - '.github/workflows/v30-n64-restart.yml'
      - 'tools/probe_n64_restart.py'
      - 'anything_plays/gba_emulator.py'
      - 'anything_plays/n64_software.py'
      - 'anything_plays/libretro_native_loader.py'
      - 'anything_plays/core_locator.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n64-restart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-n64-triple-launch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, suffix: so, slug: linux-x64}
          - {os: windows-2025, suffix: dll, slug: windows-x64}
          - {os: macos-15, suffix: dylib, slug: macos-arm64}
          - {os: macos-15-intel, suffix: dylib, slug: macos-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      AP_RELEASE_BUILD: '0'
      AP_V30_TEST_CORES: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native headless dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb
      - name: Install application requirements and pinned N64 core
        run: |
          python -m pip install -r requirements.txt
          python -c "from fetch_mgba_core import fetch_core; fetch_core('parallel_n64')"
      - name: Three sequential real ROM boots in one Python process
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python tools/probe_n64_restart.py --core cores/parallel_n64_libretro.${{ matrix.suffix }} --report test-evidence/n64-restart.json
          else
            python tools/probe_n64_restart.py --core cores/parallel_n64_libretro.${{ matrix.suffix }} --report test-evidence/n64-restart.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-N64-triple-restart-${{ matrix.slug }}
          path: test-evidence/n64-restart.json
          if-no-files-found: warn
          retention-days: 30
