name: 3.3.1 | Console switch camera-input handoff

# Synthetic console profile + native-stop assertions only; no ROMs, webcam
# frames, controller devices, personal preferences or release installers.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-console-switch-input-qa.yml'
      - 'anything_plays/ui_profiles.py'
      - 'tests/test_v331_console_switch_input_guard.py'
      - 'tests/test_v32_console_switch_profiles.py'

permissions:
  contents: read

jobs:
  source-console-switch:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Console handoff | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and test profile transition safety
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/ui_profiles.py tests/test_v331_console_switch_input_guard.py
          python -m unittest discover -s tests -p 'test_v331_console_switch_input_guard.py' -v
          python -m unittest discover -s tests -p 'test_v32_console_switch_profiles.py' -v
