name: 3.1 | Current-source four-OS full 18-console installer QA (unreleased)

# Full two-stage native installer evidence from the exact PR head.
# Stage one freezes fresh camera/bezel/controller source from THIS commit;
# stage two combines it with SHA-verified publicly released 3.0 cores.
# This is intentionally NOT an RC2 public release: internal RC1 identifiers
# remain unchanged, so owners should not install over their public RC1 app.
on:
  pull_request:
    paths:
      - '.github/workflows/v31-current-source-full-qa.yml'
      - 'tools/v31_current_source_qa.py'
      - 'tests/test_v31_current_source_qa.py'
      - 'tools/assemble_v31_full_linux.py'
      - 'tools/assemble_v31_full_windows.py'
      - 'tools/assemble_v31_full_macos.py'
      - 'anything_plays/ui_bezel.py'
      - 'anything_plays/ui_controller_art.py'
      - 'anything_plays/ui_gamepad.py'
      - 'anything_plays/gamepad.py'
      - 'tests/smoke_gui.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-post-rc1-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-source-app:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Fresh source 3.1 shell | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04, arch: none, installer: 'anything-plays-31-rc1_3.1.0~rc1_amd64.deb', bundle: 'dist/AnythingPlays'}
          - {target: windows-x64, runner: windows-latest, arch: none, installer: 'AnythingPlaysSetup-3.1.0-rc1.exe', bundle: 'dist/AnythingPlays'}
          - {target: macos-arm64, runner: macos-15, arch: arm64, installer: 'AnythingPlays-3.1.0-rc1-macos-arm64.dmg', bundle: 'dist/AnythingPlays31RC.app'}
          - {target: macos-x64, runner: macos-15-intel, arch: x64, installer: 'AnythingPlays-3.1.0-rc1-macos-x64.dmg', bundle: 'dist/AnythingPlays31RC.app'}
    env:
      AP_V31_RC: '1'
      AP_V31_PREVIEW: '0'
      AP_V31_NEXT_QA: '1'
      AP_V30_MINIMAL_CORE_BUILD: '1'
      AP_V30_TEST_CORES: '0'
      AP_V30_GPL_TRIAL: '0'
      AP_V30_TIA_TRIAL: '0'
      AP_RELEASE_BUILD: '0'
      AP_V30_APPROVED_RELEASE: '0'
      AP_V30_STABLE_CANDIDATE: '0'
      AP_V31_QA_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify current source and historical pin safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AP_V31_QA_CHECKOUT_SHA"
          python -m unittest discover -s tests -p 'test_v31_current_source_qa.py' -v
          python -m unittest discover -s tests -p 'test_v31_candidate_identity.py' -v
      - name: Install Linux freeze prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            python3-tk dpkg-dev libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb
      - name: Install Windows Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup missing' }
      - name: Build fresh Linux 3.1 source application shell
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/build_linux_deb.sh
      - name: Build fresh Windows 3.1 source application shell
        if: runner.os == 'Windows'
        shell: cmd
        run: call packaging\build_windows.bat
      - name: Build fresh Apple/Intel Mac 3.1 source application shell
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build_macos_dmg.sh
      - name: Verify exact frozen source app identity and source-head receipt
        shell: bash
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -m tools.verify_v31_rc --target "${{ matrix.target }}" \
            --installer "release/${{ matrix.installer }}" \
            --bundle "${{ matrix.bundle }}" \
            --output release/RC1_APP_STAGE_RECEIPT.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path('release/RC1_APP_STAGE_RECEIPT.json').read_text())
          assert receipt['source_revision'] == os.environ['GITHUB_SHA']
          assert receipt['public_release_approved'] is False
          assert receipt['final_release_candidate'] is False
          assert receipt['hardware_controller_verified'] is False
          print('Pinned new current-source native app:', receipt['target'], receipt['source_revision'])
          PY
      - name: Disclose RC1-identity collision and nonrelease status
        shell: bash
        run: |
          cat > release/README_POST_RC1_SOURCE_QA.txt <<'EOF'
          Anything Plays 3.1 POST-RC1 SOURCE QA (UNRELEASED)
          Built from one exact PR commit on a real native operating system.
          Source stage contains only mGBA (GB/GBC/GBA).
          The separately verified full stage adds 11 native emulator families.

          WARNING: The internally reused RC1 application ID and settings
          namespace can overlap the existing publicly published RC1.
          Do not install this test candidate over an existing RC1 installation.
          It does NOT replace 3.0, is NOT RC2, and is NOT a stable release.

          Technical QA does not verify physical hardware, commercial games,
          full native corresponding sources, LGPL redistribution, or safety
          for general users. The 30-day artifact is not a GitHub Release.
          EOF
      - name: Retain native source-built app shell for full-source assembly
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.1-POST-RC1-SOURCE-${{ matrix.target }}-UNRELEASED
          path: |
            release/${{ matrix.installer }}
            release/RC1_APP_STAGE_RECEIPT.json
            release/README_POST_RC1_SOURCE_QA.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  full-18-console-qa:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: fresh-source-app
    name: Full 18-console current 3.1 QA | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04, arch: none, baseline: 'anything-plays_3.0.0_amd64.deb', installer: 'anything-plays-31-rc1_3.1.0~rc1_amd64.deb', result: 'anything-plays-31-rc1_3.1.0~rc1full_amd64.deb', receipt: 'FULL_LIBRARY_QA_RECEIPT.json'}
          - {target: windows-x64, runner: windows-latest, arch: none, baseline: 'AnythingPlaysSetup-3.0.0.exe', installer: 'AnythingPlaysSetup-3.1.0-rc1.exe', result: 'AnythingPlaysSetup-3.1.0-rc1-full.exe', receipt: 'FULL_WINDOWS_QA_RECEIPT.json'}
          - {target: macos-arm64, runner: macos-15, arch: arm64, baseline: 'AnythingPlays-3.0.0-macos-arm64.dmg', installer: 'AnythingPlays-3.1.0-rc1-macos-arm64.dmg', result: 'AnythingPlays-3.1.0-rc1-full-macos-arm64.dmg', receipt: 'FULL_MACOS_QA_RECEIPT.json'}
          - {target: macos-x64, runner: macos-15-intel, arch: x64, baseline: 'AnythingPlays-3.0.0-macos-x64.dmg', installer: 'AnythingPlays-3.1.0-rc1-macos-x64.dmg', result: 'AnythingPlays-3.1.0-rc1-full-macos-x64.dmg', receipt: 'FULL_MACOS_QA_RECEIPT.json'}
    env:
      AP_V31_RC: '1'
      AP_V31_PREVIEW: '0'
      AP_V31_NEXT_QA: '1'
      AP_V31_FULL_TEST_CORES: '1'
      AP_V30_MINIMAL_CORE_BUILD: '0'
      AP_RELEASE_BUILD: '0'
      AP_V30_APPROVED_RELEASE: '0'
      AP_V30_STABLE_CANDIDATE: '0'
      AP_V31_QA_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify matching checkout and gate the native assembly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AP_V31_QA_CHECKOUT_SHA"
          python -m unittest discover -s tests -p 'test_v31_current_source_qa.py' -v
          python -m unittest discover -s tests -p 'test_v31_rc_full.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: AnythingPlays-3.1-POST-RC1-SOURCE-${{ matrix.target }}-UNRELEASED
          path: source31
      - name: Get authentic public 3.0 installer and SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stable30
          gh release download v3.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern '${{ matrix.baseline }}' --dir stable30
          gh release download v3.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --dir stable30
          test -s source31/${{ matrix.installer }}
          test -s source31/RC1_APP_STAGE_RECEIPT.json
          test -s stable30/${{ matrix.baseline }}
          test -s stable30/SHA256SUMS.txt
      - name: Install Linux core-repack QA prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install Windows Inno Setup and icon prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup missing' }
          python -m pip install Pillow==12.3.0 numpy==2.5.4 opencv-python-headless==4.14.0.94
          if ($LASTEXITCODE -ne 0) { throw 'Icon prerequisites missing' }
      - name: Assemble and verify fresh-source Linux full 18-console QA installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m tools.assemble_v31_full_linux --rc1 \
            --expected-source-revision "$AP_V31_QA_CHECKOUT_SHA" \
            --stable stable30/${{ matrix.baseline }} \
            --preview source31/${{ matrix.installer }} \
            --sums stable30/SHA256SUMS.txt \
            --receipt source31/RC1_APP_STAGE_RECEIPT.json --output full31
      - name: Assemble and verify fresh-source Windows full 18-console QA installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m tools.assemble_v31_full_windows --rc1 \
            --expected-source-revision "$AP_V31_QA_CHECKOUT_SHA" \
            --stable stable30/${{ matrix.baseline }} \
            --preview source31/${{ matrix.installer }} \
            --sums stable30/SHA256SUMS.txt \
            --receipt source31/RC1_APP_STAGE_RECEIPT.json --output full31
      - name: Assemble and verify fresh-source Mac full 18-console QA DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m tools.assemble_v31_full_macos --rc1 \
            --arch "${{ matrix.arch }}" --expected-source-revision "$AP_V31_QA_CHECKOUT_SHA" \
            --stable stable30/${{ matrix.baseline }} \
            --preview source31/${{ matrix.installer }} \
            --checksums stable30/SHA256SUMS.txt \
            --receipt source31/RC1_APP_STAGE_RECEIPT.json --output full31
      - name: Check both stage receipts and refuse false release approval
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from tools.verify_v31_rc import validate_staged_identity
          stage=json.loads(Path('source31/RC1_APP_STAGE_RECEIPT.json').read_text())
          full=json.loads(Path('full31/${{ matrix.receipt }}').read_text())
          installer=Path('full31/${{ matrix.result }}')
          digest=hashlib.sha256(installer.read_bytes()).hexdigest()
          assert stage['source_revision'] == os.environ['AP_V31_QA_CHECKOUT_SHA']
          assert full['source_preview_revision'] == stage['source_revision']
          assert full['sha256'] == digest
          assert full['console_profiles'] == 18
          assert full['native_core_count'] == 11
          assert stage['public_release_approved'] is False
          assert full['public_release_approved'] is False
          assert full['final_release_approved'] is False
          print('Verified NEW source and original 3.0 native cores:', stage['target'], digest)
          PY
      - name: Retain actual four-OS full QA installer and audit (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.1-POST-RC1-FULL-18-${{ matrix.target }}-UNRELEASED
          path: |
            full31/${{ matrix.result }}
            full31/${{ matrix.receipt }}
            full31/SDL_RUNTIME_AUDIT.json
            source31/README_POST_RC1_SOURCE_QA.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
