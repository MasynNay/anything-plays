name: 3.1.0 | Publish exact clean installers after release clearance

# This workflow FAILS CLOSED until the exact release-readiness file has
# real evidence for every legal, hardware and rollout gate. It may be run
# manually or from an approved readiness change on main. It never builds
# different installer bytes or releases RC2.
on:
  workflow_dispatch:
  # When the independently verified release gates are updated on main,
  # run the same fail-closed release procedure without a separate CLI step.
  push:
    branches: [main]
    paths:
      - 'config/v3.1-release-readiness.json'
  # GitHub release permissions are tested separately. On the exact authorized
  # release-approval PR merge, deploy from main even if API-authored push
  # events do not start another Actions run. Do NOT run on other PR closures.
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: read

concurrency:
  group: anything-plays-v31-publication
  cancel-in-progress: false

jobs:
  publish-cleared-v31:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v31-publication-trigger' && github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      APP_SOURCE_SHA: 104b96621ec4cb8dc39fde8c3fe96fc854c406ed
      ORIGINAL_QA_RUN: '43140637755'
      VERIFIED_STAGE_RUN: '43142249044'
      VERIFIED_STAGE_HEAD_SHA: f77fed1894075866468e7388a83c8fef800dcd50
      REVIEW_ARTIFACT: AnythingPlays-3.1.0-FOUR-CLEAN-FULL-18-SOURCE-VERIFIED-PRIVATE-REVIEW
      SOURCE_COMPANION_RUN: '43152661067'
      SOURCE_COMPANION_HEAD_SHA: 83535378f5f8c534c4e0b3d8276d491da65e60f4
      SOURCE_COMPANION_ARTIFACT: AnythingPlays-3.1.0-PYGAME-SDL-MPG123-ORIGINAL-SOURCE-PRIVATE-REVIEW
      SOURCE_COMPANION_FILE: AnythingPlays-3.1.0-PYGAME-SDL-MPG123-ORIGINAL-SOURCE.zip
      EXISTING_DRAFT_ID: '442346875'
    steps:
      - name: Check out reviewed main and release gates
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Authenticate an already-public stable release without republishing
        id: published
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v3.1.0" > already-published.json 2>/dev/null; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("already-published.json").read_text("utf-8"))
          assert r["id"]==int(os.environ["EXISTING_DRAFT_ID"])
          assert r["tag_name"]=="v3.1.0"
          assert r["draft"] is False and r["prerelease"] is False
          assert r["target_commitish"]==os.environ["APP_SOURCE_SHA"]
          expected={
            "AnythingPlaysSetup-3.1.0.exe":"sha256:574b5fda1e6cb1a708fb910271dc80fb6671f12c2013fb69076755b6c0a12bb0",
            "anything-plays-31_3.1.0_amd64.deb":"sha256:e91bdb3be315a86a37144cf8480822d9677bd06a013712bc128bc4b12915f55e",
            "AnythingPlays-3.1.0-macos-arm64.dmg":"sha256:ddec3be8356e0b1729ff0a4131bc362128739fe39a1cdc48dfd83921feb8e49a",
            "AnythingPlays-3.1.0-macos-x64.dmg":"sha256:ed7dd44e457b1a6c5458f7f6dce54089c98401418c1cc02d145e36f68494bae9",
            "AnythingPlays-3.1.0-PYGAME-SDL-MPG123-ORIGINAL-SOURCE.zip":"sha256:469b75685b385a7992f018d04bc4ddb1ffa06b061b6471cf50ae4fcda6e746d8",
            "SHA256SUMS.txt":"sha256:017f55c988353572ddc3630f4b3505c48945cb4007a96b5656b4444b84fb3f19",
            "FINAL_QA_MANIFEST.json":"sha256:8d387e9d341b841c6705a2ad6de0cc457a92bb3b8cc72076b7f65a79abaacbdc",
            "FINAL_SOURCE_ACCESS_REVIEW.md":"sha256:8998e9a606e30b90b852319355b7527329f10d8c9045abac77cc657b15f78c4f",
          }
          assert {a["name"]:a["digest"] for a in r["assets"]}==expected
          assert all(a["state"]=="uploaded" for a in r["assets"])
          print("Verified already-public exact eight-asset stable 3.1.0; no release mutation needed.")
          PY
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.1.0" > public-tag.json
            python - <<'PY'
          import json,os
          from pathlib import Path
          tag=json.loads(Path("public-tag.json").read_text("utf-8"))
          assert tag["object"]["type"]=="commit"
          assert tag["object"]["sha"]==os.environ["APP_SOURCE_SHA"]
          print("Published tag exactly matches original immutable tested source.")
          PY
            echo "already_public=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_public=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail closed on any missing acceptance, source or approval evidence
        if: ${{ steps.published.outputs.already_public != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          python -m tools.check_v31_release
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("config/v3.1-release-readiness.json").read_text("utf-8"))
          assert r["version"]=="3.1.0"
          assert r["owner_publication_request"]["requested"] is True
          from tools.check_v31_release import PUBLICATION_GATES
          assert r["public_release_approved"] is True
          assert all(r["release_gates"][name]["verified"] is True
                     for name in PUBLICATION_GATES)
          assert r["hardware_acceptance_disclosure"]["owner_accepts_uncertified_hardware"] is True
          assert r["hardware_acceptance_disclosure"]["physical_controller_tested"] is False
          assert r["release_gates"]["real_controller_hardware_acceptance"]["verified"] is False
          print("Source and redistribution approvals checked; physical hardware limitations disclosed.")
          PY

      - name: Authenticate original completed same-source final and provenance stage
        if: ${{ steps.published.outputs.already_public != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_QA_RUN" > qa-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_STAGE_RUN" > stage-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_COMPANION_RUN" > source-companion-run.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          qa=json.loads(Path("qa-run.json").read_text("utf-8"))
          stage=json.loads(Path("stage-run.json").read_text("utf-8"))
          source=json.loads(Path("source-companion-run.json").read_text("utf-8"))
          assert qa["head_sha"]==os.environ["APP_SOURCE_SHA"]
          assert qa["status"]=="completed" and qa["conclusion"]=="success"
          assert qa["head_repository"]["full_name"]==os.environ["GITHUB_REPOSITORY"]
          assert stage["head_sha"]==os.environ["VERIFIED_STAGE_HEAD_SHA"]
          assert stage["status"]=="completed" and stage["conclusion"]=="success"
          assert stage["head_repository"]["full_name"]==os.environ["GITHUB_REPOSITORY"]
          assert source["id"]==int(os.environ["SOURCE_COMPANION_RUN"])
          assert source["head_sha"]==os.environ["SOURCE_COMPANION_HEAD_SHA"]
          assert source["status"]=="completed" and source["conclusion"]=="success"
          assert source["head_repository"]["full_name"]==os.environ["GITHUB_REPOSITORY"]
          print("Original immutable QA and private release staging verified.")
          PY

      - name: Download only the original SHA-proven private seven-asset bundle
        if: ${{ steps.published.outputs.already_public != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir reviewed
          gh run download "$VERIFIED_STAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$REVIEW_ARTIFACT" --dir reviewed
          (cd reviewed && sha256sum --check SHA256SUMS.txt)

      - name: Verify full four-platform identity and the seven exact assets
        if: ${{ steps.published.outputs.already_public != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("reviewed")
          m=json.loads((p/"FINAL_QA_MANIFEST.json").read_text("utf-8"))
          files={
            "AnythingPlaysSetup-3.1.0.exe",
            "anything-plays-31_3.1.0_amd64.deb",
            "AnythingPlays-3.1.0-macos-arm64.dmg",
            "AnythingPlays-3.1.0-macos-x64.dmg",
            "SHA256SUMS.txt","FINAL_QA_MANIFEST.json",
            "FINAL_SOURCE_ACCESS_REVIEW.md",
          }
          assert {f.name for f in p.iterdir()}==files
          assert m["source_revision"]==os.environ["APP_SOURCE_SHA"]
          assert m["qa_run_id"]==int(os.environ["ORIGINAL_QA_RUN"])
          assert len(m["installers"])==4
          assert m["native_core_count"]==11 and m["console_profiles"]==18
          assert m["actual_installed_gui_verified_on_four_platforms"] is True
          assert m["clean_original_camera_only_wheels_verified_on_four_hosts"] is True
          assert m["stable_3_1_0_published"] is False
          assert m["public_release_approved"] is False
          assert m["full_native_relinking_approved"] is False
          fingerprints=m["clean_source_built_opencv_wheel_receipts"]
          assert set(fingerprints)=={"linux-x64","windows-x64","macos-arm64","macos-x64"}
          for platform,w in fingerprints.items():
            assert w["upstream_source_sha256"]=="4afa2ea1214453648be88259f035712454faa9039b686de7753569ba8eec1577"
            assert w["independent_camera_backend_proven"] is True
            assert w["redistribution_approved"] is False
          names={v["filename"] for v in m["installers"].values()}
          assert names==files-{"SHA256SUMS.txt","FINAL_QA_MANIFEST.json","FINAL_SOURCE_ACCESS_REVIEW.md"}
          print("Validated four exact source-built installers and all seven staged files.")
          PY

      - name: Attach exactly one verified pygame SDL mpg123 source companion before release review
        if: ${{ steps.published.outputs.already_public != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir source-review
          gh run download "$SOURCE_COMPANION_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_COMPANION_ARTIFACT" --dir source-review
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          source=Path("source-review")
          name=os.environ["SOURCE_COMPANION_FILE"]
          package=source/name
          assert package.is_file() and package.stat().st_size>1000000
          checks=(source/"SOURCE_COMPANION_SHA256SUMS.txt").read_text("ascii").strip().split("  ",1)
          assert len(checks)==2 and checks[1].endswith(name)
          with package.open("rb") as handle:
            assert hashlib.file_digest(handle,"sha256").hexdigest()==checks[0]
          with zipfile.ZipFile(package) as z:
            manifest=json.loads(z.read("SOURCE_RECEIPT.json"))
            assert manifest["exact_application_source_revision"]==os.environ["APP_SOURCE_SHA"]
            assert set(manifest["source_archives"])=={
              "pygame-ce-2.5.8-tagged-upstream-source.tar.gz",
              "sdl2-2.32.10.tar.gz","sdl2-2.32.8.tar.gz",
              "sdl2-image-2.8.12.tar.gz","sdl2-mixer-2.8.2.tar.gz",
              "sdl2-ttf-2.24.0.tar.gz","mpg123-1.33.7.tar.bz2",
            }
            assert manifest["public_release_approved"] is False
            assert manifest["complete_lgpl_redistribution_approved"] is False
            for original in manifest["source_archives"]:
              data=z.read("original-sources/"+original)
              assert hashlib.sha256(data).hexdigest()==manifest["source_archives"][original]
            assert "notices-and-manifests/Pygame-CE-LGPL-2.1.txt" in z.namelist()
          assert not (Path("reviewed")/name).exists()
          shutil.copyfile(package,Path("reviewed")/name)
          sums=Path("reviewed")/"SHA256SUMS.txt"
          assert sums.is_file()
          existing=sums.read_text("ascii")
          assert name not in existing, "Unexpected source entry already present"
          with sums.open("a",encoding="ascii") as out:
            out.write(f"{checks[0]}  {name}\n")
          print("Verified original-source companion and included its SHA256 in final release checksum list.")
          PY
          (cd reviewed && sha256sum --check SHA256SUMS.txt)

      - name: Require the original private draft, never replace a public release
        if: ${{ steps.published.outputs.already_public != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$EXISTING_DRAFT_ID" > draft.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("draft.json").read_text("utf-8"))
          assert r["id"]==int(os.environ["EXISTING_DRAFT_ID"])
          assert r["tag_name"]=="v3.1.0"
          assert r["draft"] is True and r["prerelease"] is False
          expected={
            "AnythingPlaysSetup-3.1.0.exe",
            "anything-plays-31_3.1.0_amd64.deb",
            "AnythingPlays-3.1.0-macos-arm64.dmg",
            "AnythingPlays-3.1.0-macos-x64.dmg",
            "SHA256SUMS.txt","FINAL_QA_MANIFEST.json",
            "FINAL_SOURCE_ACCESS_REVIEW.md",
          }
          assert {a["name"] for a in r["assets"]}==expected
          print("Confirmed original owner-only seven-asset draft; no public release overwritten.")
          PY
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.1.0" > existing-tag.json 2>/dev/null; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          ref=json.loads(Path("existing-tag.json").read_text("utf-8"))
          assert ref["object"]["type"]=="commit", "Annotated tag needs independent verification"
          assert ref["object"]["sha"]==os.environ["APP_SOURCE_SHA"], "Existing release tag points to different source!"
          PY
          fi

      - name: Replace only the reviewed eight private draft assets including original sources
        if: ${{ steps.published.outputs.already_public != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v3.1.0 reviewed/* --clobber --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$EXISTING_DRAFT_ID/assets?per_page=100" > uploaded-assets.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=json.loads(Path("uploaded-assets.json").read_text("utf-8"))
          def file_hash(p):
            with p.open("rb") as handle:
              return "sha256:"+hashlib.file_digest(handle, "sha256").hexdigest()
          local={p.name:file_hash(p)
                 for p in Path("reviewed").iterdir() if p.is_file()}
          assert len(a)==len(local)==8
          assert {x["name"] for x in a}==set(local)
          for x in a:
            assert x["state"]=="uploaded"
            assert x["digest"]==local[x["name"]],(x["name"],x.get("digest"))
          print("GitHub-uploaded SHA256 digests match eight immutable installer, checksum, manifest and source assets.")
          PY

      - name: Publish only after every matching asset digest and gate passed
        if: ${{ steps.published.outputs.already_public != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v3.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$APP_SOURCE_SHA" \
            --title "Anything Plays 3.1.0" \
            --notes-file docs/V3_1_PUBLIC_RELEASE_NOTES.md \
            --draft=false --prerelease=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v3.1.0" > published.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("published.json").read_text("utf-8"))
          assert r["id"]==int(os.environ["EXISTING_DRAFT_ID"])
          assert r["draft"] is False and r["prerelease"] is False
          assert len(r["assets"])==8
          assert r["tag_name"]=="v3.1.0"
          assert r["target_commitish"]==os.environ["APP_SOURCE_SHA"], "Release source target mismatch"
          print("Public stable 3.1.0 verified:",r["html_url"])
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.1.0" > final-tag.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          tag=json.loads(Path("final-tag.json").read_text("utf-8"))
          assert tag["object"]["type"]=="commit", "Unexpected annotated or indirect tag"
          assert tag["object"]["sha"]==os.environ["APP_SOURCE_SHA"], "Published tag not at exact tested source!"
          print("Public v3.1.0 tag points to exact original tested source.")
          PY
