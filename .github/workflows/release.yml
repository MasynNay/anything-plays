name: Build and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies for all source checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2 xvfb
          python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q app.py cameras.py cartridge_art.py core_locator.py fetch_mgba_core.py gba_emulator.py libretro_abi.py libretro_audio.py libretro_input.py libretro_save.py libretro_video.py rom_library.py settings_defaults.py system_profiles.py systems.py tracking.py ui_camera.py ui_gameplay.py ui_layout.py ui_library.py ui_profiles.py ui_theme.py ui_zones.py zone_rendering.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Headless GUI smoke test
        run: PYTHONPATH=. xvfb-run -a python tests/smoke_gui.py
  windows:
    needs: source-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows setup
        shell: cmd
        run: call build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/AnythingPlaysSetup-*.exe
          if-no-files-found: error
  macos:
    needs: source-checks
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build macOS DMG
        run: bash build_macos_dmg.sh
      - name: Rename artifact by architecture
        run: mv release/AnythingPlays.dmg release/AnythingPlays-2.0.0-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
  linux:
    needs: source-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv dpkg-dev libgl1 libglib2.0-0
      - name: Build Debian package
        run: bash build_linux_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/*.deb
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: SHA256 checksums
        run: cd release && sha256sum *.exe *.dmg *.deb > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.exe release/*.dmg release/*.deb release/SHA256SUMS.txt --title "Anything Plays ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md --verify-tag
