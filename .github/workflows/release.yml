name: Build and publish release (disabled pending redistribution review)
# Release builds, artifact uploads and publication are intentionally locked.
# They must only be re-enabled after core/dependency licensing and corresponding
# source checks are completed and reviewed in docs/RELEASE_LICENSE_REVIEW.md.
# A version tag alone must never trigger unapproved binary distribution.
on:
  workflow_dispatch:
permissions:
  contents: write
# Release mode forces exact approved core fingerprints at download AND staging.
# Keep the publication and source-checks jobs disabled pending legal review.
env:
  AP_RELEASE_BUILD: '1'
jobs:
  source-checks:
    # All downstream packaging jobs depend on this explicit release gate.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies for all source checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2 xvfb
          python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q app.py anything_plays fetch_mgba_core.py verify_bundle.py tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Headless GUI smoke test
        run: PYTHONPATH=. xvfb-run -a python tests/smoke_gui.py
  windows:
    needs: source-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows setup
        shell: cmd
        run: call build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/AnythingPlaysSetup-*.exe
          if-no-files-found: error
  macos:
    needs: source-checks
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build macOS DMG
        run: bash build_macos_dmg.sh
      - name: Rename artifact by architecture
        run: mv release/AnythingPlays.dmg release/AnythingPlays-2.0.0-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
  linux:
    needs: source-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv dpkg-dev libgl1 libglib2.0-0
      - name: Build Debian package
        run: bash build_linux_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/*.deb
          if-no-files-found: error
  publish:
    # Safety lock: producing installers is NOT approval to redistribute them.
    # Enable only after the bundled-core license and corresponding-source
    # requirements have been independently reviewed and satisfied.
    if: ${{ false }}
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: SHA256 checksums
        run: cd release && sha256sum *.exe *.dmg *.deb > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.exe release/*.dmg release/*.deb release/SHA256SUMS.txt --title "Anything Plays ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md --verify-tag
