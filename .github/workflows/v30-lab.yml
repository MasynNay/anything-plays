    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native GPU and audio packages
        run: python -m pip install -r requirements.txt
      - name: Download identical original GX homebrew program
        uses: actions/download-artifact@v4
        with:
          name: AnythingPlays-3.0-Original-GameCube-GX3D-DOL
          path: original-gx3d
      - name: Fetch test Dolphin core and matching Sys
        run: |
          python -c "from fetch_mgba_core import fetch_core; fetch_core('dolphin')"
          python tools/fetch_dolphin_sys.py cores
      - name: Require simultaneous original GX 3D rendering and DSP audio on Mac
        run: |
          python tools/probe_gamecube_app.py \
