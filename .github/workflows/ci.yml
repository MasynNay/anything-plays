name: Source checks

on:
  push:
    branches: [main, develop/v2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libgl1 libglib2.0-0 libportaudio2 xvfb pulseaudio
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q app.py anything_plays fetch_mgba_core.py verify_bundle.py tests
      - name: Start virtual audio server
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Headless GUI smoke test
        run: PYTHONPATH=. xvfb-run -a python tests/smoke_gui.py

  native-mgba-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download the actual Linux mGBA core
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('mgba')"
      - name: Validate GB, GBC and GBA support in native core
        env:
          AP_TEST_NATIVE_CORE: '1'
        run: python -m unittest discover -s tests -p 'test_mgba_native_coverage.py' -v
