name: Source checks

on:
  push:
    branches: [main, develop/v2.0, feature/v3.1-controls-usability]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Recover official signed Ubuntu mirror before apt if runner Azure DNS is down
        run: sudo bash tools/ci_use_canonical_ubuntu_mirror.sh
      - name: Install Linux dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libgl1 libglib2.0-0 libportaudio2 xvfb pulseaudio
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q app.py anything_plays fetch_mgba_core.py verify_bundle.py tests
      - name: Start virtual audio server
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: Check tracked repository layout and forbidden binaries
        run: python tools/check_repository_hygiene.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Headless GUI smoke test
        run: PYTHONPATH=. xvfb-run -a python tests/smoke_gui.py
      - name: 3.2 integrated setup GUI smoke (no devices or ROMs)
        run: PYTHONPATH=. xvfb-run -a python tests/smoke_v32_gui.py

  native-mgba-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover official signed Ubuntu mirror before apt if runner Azure DNS is down
        run: sudo bash tools/ci_use_canonical_ubuntu_mirror.sh
      - name: Install runtime dependencies for native gameplay smoke test
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libportaudio2 libgl1 libglib2.0-0 pulseaudio
          python -m pip install -r requirements.txt
      - name: Start virtual audio server for headless emulator test
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: Download the actual Linux mGBA core
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('mgba')"
      - name: Validate GB, GBC and GBA support in native core
        env:
          AP_TEST_NATIVE_CORE: '1'
        run: python -m unittest discover -s tests -p 'test_mgba_native_coverage.py' -v

  # Package checks use real host OSes and verify staged license/core files.
  # No build artifacts are uploaded or published until redistribution approval.
  package-windows:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v3')
    # Packaging needs regression tests, but may run alongside independent native gameplay checks.
    # Independent package check: all jobs must still pass before merging.
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and verify the Windows installer locally on runner
        shell: cmd
        run: call packaging\build_windows.bat
      - name: Record staged Windows binary inventory
        run: python tools/binary_inventory.py windows-x86_64 dist/AnythingPlays release-evidence/windows-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-windows-x86_64
          path: release-evidence/windows-x86_64.json
          if-no-files-found: error

  package-macos:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v3')
    # Packaging needs regression tests, but may run alongside independent native gameplay checks.
    # Independent package check: all jobs must still pass before merging.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify a macOS DMG locally on runner
        run: bash packaging/build_macos_dmg.sh
      - name: Record staged macOS binary inventory
        run: python tools/binary_inventory.py macos-${{ matrix.arch }} dist/AnythingPlays30Preview.app release-evidence/macos-${{ matrix.arch }}.json
      - name: Audit macOS FFmpeg and encoder Mach-O link dependencies
        run: python tools/audit_codec_linkage.py dist/AnythingPlays30Preview.app release-evidence/codec-linkage-macos-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-macos-${{ matrix.arch }}
          path: |
            release-evidence/macos-${{ matrix.arch }}.json
            release-evidence/codec-linkage-macos-${{ matrix.arch }}.json
          if-no-files-found: error

  package-linux:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v3')
    # Packaging needs regression tests, but may run alongside independent native gameplay checks.
    # Independent package check: all jobs must still pass before merging.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OS packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk python3-venv dpkg-dev libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb
      - name: Build and verify Debian package locally on runner
        run: bash packaging/build_linux_deb.sh
      - name: Record staged Linux binary inventory
        run: python tools/binary_inventory.py linux-x86_64 dist/AnythingPlays release-evidence/linux-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-linux-x86_64
          path: release-evidence/linux-x86_64.json
          if-no-files-found: error

  # Development branch only: no installers, ROMs, HID access or publish actions.
  # Real pygame SDL loads on every host; a synthetic controller supplies
  # buttons, axes and disconnects through the real app input pipeline.
  virtual-controller:
    if: github.ref == 'refs/heads/feature/v3.1-controls-usability'
    name: Virtual controller · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x64, runner: ubuntu-24.04}
          - {label: windows-x64, runner: windows-latest}
          - {label: macos-apple-silicon, runner: macos-15}
          - {label: macos-intel, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install SDL controller runtime
        run: python -m pip install pygame-ce==2.5.8
      - name: Verify platform SDL version
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: '1'
        run: python -c "import platform, pygame; print(platform.platform(), platform.machine(), pygame.version.ver, pygame.get_sdl_version())"
      - name: Run synthetic controller and real SDL initialization tests
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: '1'
        run: python -m unittest discover -s tests -p "test_v31_gamepad*.py" -v
      - name: Verify visual controller settings without a display
        run: python -m unittest discover -s tests -p "test_v31_controller_gui.py" -v
      - name: Verify live controller diagnostics and immediate rescan safety
        run: python -m unittest discover -s tests -p "test_v31_live_controller.py" -v
      - name: Verify private-free copyable controller reports on native host
        run: python -m unittest discover -s tests -p "test_v31_controller_diagnostics.py" -v
      - name: Prove RC settings copy is atomic, private and race safe
        run: python -m unittest discover -s tests -p "test_v31_preferences_atomic.py" -v
      - name: Prove installed-build settings test fixture rejects touching stable user data
        run: python -m unittest discover -s tests -p "test_v31_installed_settings_migration.py" -v
