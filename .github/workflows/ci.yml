name: Source checks

on:
  push:
    branches: [main, develop/v2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libgl1 libglib2.0-0 libportaudio2 xvfb pulseaudio
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q app.py cameras.py cartridge_art.py core_locator.py fetch_mgba_core.py gba_emulator.py libretro_abi.py libretro_audio.py libretro_input.py libretro_save.py libretro_video.py rom_library.py settings_defaults.py system_profiles.py systems.py tracking.py ui_camera.py ui_gameplay.py ui_layout.py ui_library.py ui_profiles.py ui_theme.py ui_zones.py zone_rendering.py
      - name: Start virtual audio server
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Headless GUI smoke test
        run: PYTHONPATH=. xvfb-run -a python tests/smoke_gui.py
