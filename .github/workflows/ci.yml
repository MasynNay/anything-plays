name: Source checks

on:
  push:
    branches: [main, develop/v2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2 xvfb
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q app.py cameras.py cartridge_art.py core_locator.py fetch_mgba_core.py gba_emulator.py libretro_abi.py libretro_audio.py libretro_input.py libretro_save.py libretro_video.py rom_library.py settings_defaults.py system_profiles.py systems.py tracking.py ui_camera.py ui_gameplay.py ui_layout.py ui_library.py ui_profiles.py ui_theme.py ui_zones.py zone_rendering.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Headless GUI smoke test
        run: PYTHONPATH=. xvfb-run -a python tests/smoke_gui.py
