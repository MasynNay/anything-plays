name: 3.3.1 | Reusable GameCube GPU readback staging

# No GPU/ROM/Dolphin: mock native GL entry points and assert copy ownership.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-gamecube-readback-staging-qa.yml'
      - 'anything_plays/libretro_gpu_egl.py'
      - 'anything_plays/libretro_gpu_portable.py'
      - 'tests/test_v331_gamecube_readback_staging.py'

permissions:
  contents: read

jobs:
  readback:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: GL readback ownership | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - name: Compile and run GPU readback + preview compatibility suites
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/libretro_gpu_egl.py anything_plays/libretro_gpu_portable.py tests/test_v331_gamecube_readback_staging.py
          python -m unittest discover -s tests -p 'test_v331_gamecube_readback_staging.py' -v
          python -m unittest discover -s tests -p 'test_v30_gamecube_portable_gpu.py' -v
          python -m unittest discover -s tests -p 'test_v33_egl_partial_init_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_v33_portable_gpu_startup_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_v30_gamecube_preview_optimization.py' -v
