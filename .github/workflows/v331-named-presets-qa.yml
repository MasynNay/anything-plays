name: 3.3.1 | Named control preset library
on:
  pull_request:
    paths:
      - '.github/workflows/v331-named-presets-qa.yml'
      - 'anything_plays/named_presets.py'
      - 'anything_plays/ui_named_presets.py'
      - 'anything_plays/ui_profiles.py'
      - 'anything_plays/ui_panels.py'
      - 'tests/test_v331_named_presets*.py'
permissions:
  contents: read
jobs:
  storage:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Preset storage | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate local storage and existing portable profile contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v331_named_presets.py' -v
          python -m unittest discover -s tests -p 'test_portable_profiles.py' -v
          python -m unittest discover -s tests -p 'test_v32_profile_export_isolation.py' -v
          python -m unittest discover -s tests -p 'test_system_profiles.py' -v
  real-tk:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Actual Tk preset window | Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: xvfb-run -a python -m unittest discover -s tests -p 'test_v331_named_presets_ui.py' -v
