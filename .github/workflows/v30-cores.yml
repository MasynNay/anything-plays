    # These cartridges are original and never included in the installer.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: mastersystem}
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: gamegear}
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: sg1000}
          - {os: windows-2025, target: windows-x64, ext: dll, system: mastersystem}
          - {os: windows-2025, target: windows-x64, ext: dll, system: gamegear}
          - {os: windows-2025, target: windows-x64, ext: dll, system: sg1000}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: mastersystem}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: gamegear}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: sg1000}
          - {os: macos-15-intel, target: macos-x64, ext: dylib, system: mastersystem}
          - {os: macos-15-intel, target: macos-x64, ext: dylib, system: gamegear}
