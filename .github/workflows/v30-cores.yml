      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: gb}
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: gbc}
          - {os: windows-2025, target: windows-x64, ext: dll, system: gb}
          - {os: windows-2025, target: windows-x64, ext: dll, system: gbc}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: gb}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: gbc}
          - {os: macos-15-intel, target: macos-x64, ext: dylib, system: gb}
          - {os: macos-15-intel, target: macos-x64, ext: dylib, system: gbc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless Linux native runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Obtain native mGBA core for CI
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('mgba')"
      - name: Test original GB/GBC video and native APU sound
        run: |
          python tools/probe_gb_homebrew.py --system ${{ matrix.system }} --core cores/mgba_libretro.${{ matrix.ext }} --seconds 8 --report test-evidence/${{ matrix.system }}-${{ matrix.target }}-video-audio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-Original-${{ matrix.system }}-AV-${{ matrix.target }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  genesis-original-cross-platform-av:
    # Original ROM from source opcodes; real Libretro video, PSG PCM and
    # controls in the embedded CoreSession, not a loaded-library smoke.
    # No third-party game files, emulator downloads at runtime, or ROM release.
    # Record each platform separately before approving any 3.0 installer.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, ext: so}
          - {os: windows-2025, target: windows-x64, ext: dll}
          - {os: macos-15, target: macos-arm64, ext: dylib}
          - {os: macos-15-intel, target: macos-x64, ext: dylib}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native Libretro dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install production Python requirements
        run: python -m pip install -r requirements.txt
      - name: Fetch platform matched Genesis Plus GX Libretro candidate
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('genesis_plus_gx')"
      - name: Require actual original 68000 video and nonzero PSG stereo PCM
        run: |
          python tools/probe_genesis_homebrew.py --core cores/genesis_plus_gx_libretro.${{ matrix.ext }} --seconds 8 --report test-evidence/genesis-original-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-original-Genesis-AV-${{ matrix.target }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  optional-core-pack-candidates:
    # Independent native-core downloads, NOT shipped inside the small installer.
    # This workflow never marks a candidate as approved or publishes a release.
    # Maintainers must individually audit sources, licenses, installed gameplay,
    # audio, controls, saves and signatures before publishing official assets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      AP_V30_CORE_PACK_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve separate platform-matched native core candidates
        run: python fetch_mgba_core.py
      - name: Create checksum-verified UNAPPROVED optional packages
        run: |
          python tools/create_core_packs.py --release v3.0.0-alpha.2-cores --output release/core-packs
      - uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.0-UNAPPROVED-core-candidates-${{ matrix.target }}
          path: release/core-packs/*.zip
          if-no-files-found: error
          retention-days: 14

  nes-video-audio-original-homebrew:
    # Original iNES source-generated cartridge, no third-party game files.
    # The core must produce changing nonblank RGB frames AND nonzero APU PCM
    # through our real in-app Libretro callback plumbing, not just load.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless audio and video dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Retrieve the FCEUmm core independently of the starter installer
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('fceumm')"
      - name: Verify NES graphics and actual generated APU audio samples
        timeout-minutes: 2
        run: |
          mkdir -p test-evidence
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_nes_homebrew.py \
            --core cores/fceumm_libretro.so --seconds 8 \
            --report test-evidence/nes-video-audio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-original-NES-video-audio-evidence
          path: |
            test-evidence/nes-video-audio.json
            test-evidence/nes-test-frame.png
          if-no-files-found: warn
          retention-days: 14

  atari2600-video-audio-original-homebrew:
    # Test independent Stella 2014 core with original TIA/6507 ROM generated
    # from our own source; require distinct frames and nonzero native PCM.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless camera audio and renderer prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Retrieve standalone Stella 2014 optional core for test only
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('stella2014')"
      - name: Verify original Atari 2600 changing video and generated TIA PCM
        timeout-minutes: 2
        run: |
          mkdir -p test-evidence
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_atari_homebrew.py \
            --core cores/stella2014_libretro.so --seconds 8 \
            --report test-evidence/atari-video-audio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-original-Atari-video-audio-evidence
          path: |
            test-evidence/atari-video-audio.json
            test-evidence/atari-test-frame.png
          if-no-files-found: warn
          retention-days: 14

  optional-2d-native-video-and-audio:
    # Independently validate native optional cores on EACH supported desktop OS.
    # Source-created ROMs contain no commercial games; sound is actual emitted
    # PCM captured through Libretro, not a physical speaker validation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, extension: so, system: nes, core: fceumm}
          - {os: windows-2025, extension: dll, system: nes, core: fceumm}
          - {os: macos-15, extension: dylib, system: nes, core: fceumm}
          - {os: macos-15-intel, extension: dylib, system: nes, core: fceumm}
          - {os: ubuntu-24.04, extension: so, system: atari, core: stella2014}
          - {os: windows-2025, extension: dll, system: atari, core: stella2014}
          - {os: macos-15, extension: dylib, system: atari, core: stella2014}
          - {os: macos-15-intel, extension: dylib, system: atari, core: stella2014}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless native core and audio prerequisites on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Prepare Python environment
