name: Anything Plays 3.0 | Emulator verification

# Continuous pushes during emulator research should not consume the entire
# Actions runner quota with obsolete cross-platform native jobs.
concurrency:
  group: emulator-verify-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/v3.0-unified-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  AP_RELEASE_BUILD: '0'

jobs:
  core-pack-cross-platform-tests:
    # Verify the in-app updater's path, hash, rollback and approval gates on
    # native Windows and both Mac architectures. Linux runs these tests in
    # source-and-gui. This job downloads NO runnable emulator binary.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify approved core-pack installation and rollback off-line
        run: |
          python -m unittest discover -s tests -p "test_v21_core*.py" -v
          python -m unittest discover -s tests -p "test_v21_create_core_packs.py" -v

  n64-homebrew-playback:
    # Independent playable-video evidence using Unlicensed/public-domain ROM;
    # never include the fixture or download it in a player installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AP_V30_TEST_CORES: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare bundled N64 test core and headless dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            xvfb libgl1 libegl1 libx11-6 libxi6 libxrandr2 libportaudio2
          python -m pip install -r requirements.txt
          python -c "from fetch_mgba_core import fetch_core; fetch_core('parallel_n64')"
      - name: Boot pinned public-domain N64 homebrew and require nonblank video
        timeout-minutes: 2
        run: |
          mkdir -p test-evidence
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_n64_homebrew.py \
            --core cores/parallel_n64_libretro.so --seconds 20 \
            --report test-evidence/n64-homebrew-playback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-N64-real-homebrew-evidence
          path: |
            test-evidence/n64-homebrew-playback.json
            test-evidence/n64-homebrew-frame.png
          if-no-files-found: warn
          retention-days: 14

  n64-homebrew-cross-platform:
    # Same pinned public-domain homebrew / in-panel software video path on
    # Windows and both macOS architectures. Still not clean-installed game QA.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            ext: dll
          - os: macos-15
            ext: dylib
          - os: macos-15-intel
            ext: dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies and platform-native bundled N64 core
        run: |
          python -m pip install -r requirements.txt
          python -c "from fetch_mgba_core import fetch_core; fetch_core('parallel_n64')"
      - name: Verify pinned public-domain N64 homebrew video in embedded core
        timeout-minutes: 2
        run: |
          python -X faulthandler tools/probe_n64_homebrew.py --core cores/parallel_n64_libretro.${{ matrix.ext }} --seconds 20 --report test-evidence/n64-homebrew-playback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-N64-${{ matrix.os }}-real-video-evidence
          path: |
            test-evidence/n64-homebrew-playback.json
            test-evidence/n64-homebrew-frame.png
          if-no-files-found: warn
          retention-days: 14

  wonderswan-original-native-av:
    # Two original NEC V30MZ 8086-compatible ROMs, real monochrome/color
    # background tile graphics and hardware wavetable channel audio PCM.
    # The generated ROMs are CI-only and not part of the player installer.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        system: [ws, wsc]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native audio and graphics dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Fetch the pinned Mednafen WonderSwan core in CI only
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('mednafen_wswan')"
      - name: Demand original WonderSwan video and wavetable PCM
        run: |
          python tools/probe_wonderswan_homebrew.py --system ${{ matrix.system }} --core cores/mednafen_wswan_libretro.so --seconds 8 --report test-evidence/${{ matrix.system }}-original-video-audio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-Original-${{ matrix.system }}-native-AV
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  ngp-mit-homebrew-video-audio:
    # Third-party MIT homebrew, immutable commit and blob-integrity pinned.
    # Downloaded only inside disposable CI and never shipped in app installs.
    # A native NGP/NGPC job failure is a real emulator-verification failure:
    # require RGB, PCM, manual A and camera B; do not hide red jobs behind
    # a successful core-download or 'continue-on-error' workflow badge.
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: ngp}
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: ngpc}
          - {os: windows-2025, target: windows-x64, ext: dll, system: ngp}
          - {os: windows-2025, target: windows-x64, ext: dll, system: ngpc}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: ngp}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: ngpc}
          - {os: macos-15-intel, target: macos-x64, ext: dylib, system: ngp}
          - {os: macos-15-intel, target: macos-x64, ext: dylib, system: ngpc}
    runs-on: \${{ matrix.os }}
    timeout-minutes: 15
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux Libretro runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Obtain embedded Mednafen NeoPop test core
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('mednafen_ngp')"
      - name: Require pinned MIT homebrew native LCD and PCM
        run: |
          python tools/probe_ngp_mit_homebrew.py --system ${{ matrix.system }} --core cores/mednafen_ngp_libretro.${{ matrix.ext }} --seconds 12 --report test-evidence/${{ matrix.system }}-${{ matrix.target }}-mit-video-audio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-MIT-homebrew-${{ matrix.system }}-AV-${{ matrix.target }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  ngpc-cartridge-flash-restart-experiment:
    # Experimental legal StarGunner flash-save test. A failure is preserved
    # in native job/artifact evidence, and cannot authorize 3.0 release.
    # Do NOT call this verified based only on overall workflow success;
    # this job is exploratory until its actual 3-process persistence gate passes.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux native dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Obtain pinned emulator test core
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('mednafen_ngp')"
      - name: Prove options change persists across THREE native cold starts
        run: |
          python tools/probe_ngp_flash_persistence.py --core cores/mednafen_ngp_libretro.so --seconds 12 --report test-evidence/ngpc-flash-three-cold-starts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-EXPERIMENTAL-NGPC-flash-cold-restart
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  wswan-original-screen-psg:
    # Original V30MZ cartridges, no downloaded game assets, source-generated
    # only during CI. Must show animated WonderSwan LCD and native PCM.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: ws}
          - {os: ubuntu-24.04, target: linux-x64, ext: so, system: wsc}
          - {os: windows-2025, target: windows-x64, ext: dll, system: ws}
          - {os: windows-2025, target: windows-x64, ext: dll, system: wsc}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: ws}
          - {os: macos-15, target: macos-arm64, ext: dylib, system: wsc}
          - {os: macos-15-intel, target: macos-x64, ext: dylib, system: ws}
          - {os: macos-15-intel, target: macos-x64, ext: dylib, system: wsc}
