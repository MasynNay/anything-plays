name: Anything Plays 3.0 | Emulator verification

# Continuous pushes during emulator research should not consume the entire
# Actions runner quota with obsolete cross-platform native jobs.
concurrency:
  group: emulator-verify-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/v3.0-unified-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  AP_RELEASE_BUILD: '0'

jobs:
  core-pack-cross-platform-tests:
    # Verify the in-app updater's path, hash, rollback and approval gates on
    # native Windows and both Mac architectures. Linux runs these tests in
    # source-and-gui. This job downloads NO runnable emulator binary.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify approved core-pack installation and rollback off-line
        run: |
          python -m unittest discover -s tests -p "test_v21_core*.py" -v
          python -m unittest discover -s tests -p "test_v21_create_core_packs.py" -v

  n64-homebrew-playback:
    # Independent playable-video evidence using Unlicensed/public-domain ROM;
    # never include the fixture or download it in a player installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AP_V30_TEST_CORES: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare bundled N64 test core and headless dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            xvfb libgl1 libegl1 libx11-6 libxi6 libxrandr2 libportaudio2
          python -m pip install -r requirements.txt
          python -c "from fetch_mgba_core import fetch_core; fetch_core('parallel_n64')"
      - name: Boot pinned public-domain N64 homebrew and require nonblank video
        timeout-minutes: 2
        run: |
          mkdir -p test-evidence
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_n64_homebrew.py \
            --core cores/parallel_n64_libretro.so --seconds 20 \
            --report test-evidence/n64-homebrew-playback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-N64-real-homebrew-evidence
          path: |
            test-evidence/n64-homebrew-playback.json
            test-evidence/n64-homebrew-frame.png
          if-no-files-found: warn
          retention-days: 14

  n64-homebrew-cross-platform:
    # Same pinned public-domain homebrew / in-panel software video path on
    # Windows and both macOS architectures. Still not clean-installed game QA.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            ext: dll
          - os: macos-15
            ext: dylib
          - os: macos-15-intel
            ext: dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies and platform-native bundled N64 core
        run: |
          python -m pip install -r requirements.txt
          python -c "from fetch_mgba_core import fetch_core; fetch_core('parallel_n64')"
      - name: Verify pinned public-domain N64 homebrew video in embedded core
        timeout-minutes: 2
        run: |
          python -X faulthandler tools/probe_n64_homebrew.py --core cores/parallel_n64_libretro.${{ matrix.ext }} --seconds 20 --report test-evidence/n64-homebrew-playback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-N64-${{ matrix.os }}-real-video-evidence
          path: |
            test-evidence/n64-homebrew-playback.json
            test-evidence/n64-homebrew-frame.png
          if-no-files-found: warn
          retention-days: 14

  optional-core-pack-candidates:
    # Independent native-core downloads, NOT shipped inside the small installer.
    # This workflow never marks a candidate as approved or publishes a release.
    # Maintainers must individually audit sources, licenses, installed gameplay,
    # audio, controls, saves and signatures before publishing official assets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      AP_V30_CORE_PACK_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve separate platform-matched native core candidates
        run: python fetch_mgba_core.py
      - name: Create checksum-verified UNAPPROVED optional packages
        run: |
          python tools/create_core_packs.py --release v3.0.0-alpha.2-cores --output release/core-packs
      - uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.0-UNAPPROVED-core-candidates-${{ matrix.target }}
          path: release/core-packs/*.zip
          if-no-files-found: error
          retention-days: 14

  nes-video-audio-original-homebrew:
    # Original iNES source-generated cartridge, no third-party game files.
    # The core must produce changing nonblank RGB frames AND nonzero APU PCM
    # through our real in-app Libretro callback plumbing, not just load.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless audio and video dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Retrieve the FCEUmm core independently of the starter installer
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('fceumm')"
      - name: Verify NES graphics and actual generated APU audio samples
        timeout-minutes: 2
        run: |
          mkdir -p test-evidence
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_nes_homebrew.py \
            --core cores/fceumm_libretro.so --seconds 8 \
            --report test-evidence/nes-video-audio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-original-NES-video-audio-evidence
          path: |
            test-evidence/nes-video-audio.json
            test-evidence/nes-test-frame.png
          if-no-files-found: warn
          retention-days: 14

  atari2600-video-audio-original-homebrew:
    # Test independent Stella 2014 core with original TIA/6507 ROM generated
    # from our own source; require distinct frames and nonzero native PCM.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless camera audio and renderer prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Retrieve standalone Stella 2014 optional core for test only
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('stella2014')"
      - name: Verify original Atari 2600 changing video and generated TIA PCM
        timeout-minutes: 2
        run: |
          mkdir -p test-evidence
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_atari_homebrew.py \
            --core cores/stella2014_libretro.so --seconds 8 \
            --report test-evidence/atari-video-audio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-original-Atari-video-audio-evidence
          path: |
            test-evidence/atari-video-audio.json
            test-evidence/atari-test-frame.png
          if-no-files-found: warn
          retention-days: 14

  optional-2d-native-video-and-audio:
    # Independently validate native optional cores on EACH supported desktop OS.
    # Source-created ROMs contain no commercial games; sound is actual emitted
    # PCM captured through Libretro, not a physical speaker validation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, extension: so, system: nes, core: fceumm}
          - {os: windows-2025, extension: dll, system: nes, core: fceumm}
          - {os: macos-15, extension: dylib, system: nes, core: fceumm}
          - {os: macos-15-intel, extension: dylib, system: nes, core: fceumm}
          - {os: ubuntu-24.04, extension: so, system: atari, core: stella2014}
          - {os: windows-2025, extension: dll, system: atari, core: stella2014}
          - {os: macos-15, extension: dylib, system: atari, core: stella2014}
          - {os: macos-15-intel, extension: dylib, system: atari, core: stella2014}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless native core and audio prerequisites on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Prepare Python environment
        run: python -m pip install -r requirements.txt
      - name: Fetch platform-matched optional emulator (no standalone emulator)
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('${{ matrix.core }}')"
      - name: Require generated changing graphics and nonzero emulator audio PCM
        run: |
          python tools/probe_${{ matrix.system }}_homebrew.py --core cores/${{ matrix.core }}_libretro.${{ matrix.extension }} --seconds 8 --report test-evidence/${{ matrix.system }}-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-${{ matrix.system }}-${{ matrix.os }}-audio-video
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  optional-core-install-play-rollback:
    # Uses a temporary *simulated approved* pack built from the real core;
    # no release asset or bogus review attestation is ever published.
    # Proves the updater's exact bytes, digest, activation, in-app playback
    # and rollback before asking maintainers to publish approved packs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, core: fceumm}
          - {os: ubuntu-24.04, target: linux-x64, core: stella2014}
          - {os: windows-2025, target: windows-x64, core: fceumm}
          - {os: windows-2025, target: windows-x64, core: stella2014}
          - {os: macos-15, target: macos-arm64, core: fceumm}
          - {os: macos-15, target: macos-arm64, core: stella2014}
          - {os: macos-15-intel, target: macos-x64, core: fceumm}
          - {os: macos-15-intel, target: macos-x64, core: stella2014}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Install verified core pack, play original ROM, then roll back
        run: |
          python tools/validate_installable_core_pack.py --core ${{ matrix.core }} --seconds 8 --report test-evidence/install-play-rollback-${{ matrix.core }}-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-pack-e2e-${{ matrix.core }}-${{ matrix.target }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

