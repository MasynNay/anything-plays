    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, ext: so}
          - {os: windows-2025, target: windows-x64, ext: dll}
          - {os: macos-15, target: macos-arm64, ext: dylib}
          - {os: macos-15-intel, target: macos-x64, ext: dylib}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless Linux native requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install Python test requirements
        run: python -m pip install -r requirements.txt
      - name: Fetch PCE Fast Libretro candidate for CI only
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('mednafen_pce_fast')"
      - name: Demand original HuC6280 changing RGB frames and PSG PCM
        run: |
          python tools/probe_pce_homebrew.py --core cores/mednafen_pce_fast_libretro.${{ matrix.ext }} --seconds 8 --report test-evidence/pce-original-${{ matrix.target }}-vdc-vce-psg.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-original-PCE-HuC6280-AV-${{ matrix.target }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  atari7800-original-maria-tia-av:
    # Original .a78 cartridge built at test time, optional BIOS omitted.
    # Strict native ProSystem video and real TIA PCM acceptance (not a
    # mere ROM load or simulated video frame).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, ext: so}
          - {os: windows-2025, target: windows-x64, ext: dll}
