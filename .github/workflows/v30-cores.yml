        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Obtain optional ProSystem core for test
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('prosystem')"
      - name: Require original MARIA changing video and nonzero TIA PCM
        run: |
          python tools/probe_atari7800_homebrew.py --core cores/prosystem_libretro.${{ matrix.ext }} --seconds 8 --report test-evidence/atari7800-original-${{ matrix.target }}-maria-tia.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-original-Atari7800-MARIA-TIA-${{ matrix.target }}-${{ matrix.target }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  native-eleven-console-lifecycle-soak:
    # One Python process, 132 native Libretro restarts across 11 console
    # profiles (6 distinct native libraries). Guards failed teardown, leaked
    # worker threads, stale buttons, missing game frames and RSS growth.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native dependencies for real in-panel emulators
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Retrieve six pinned Libretro engines in temporary CI environment
        run: |
          python -c "from fetch_mgba_core import fetch_core; [fetch_core(name) for name in ('mgba', 'snes9x', 'fceumm', 'genesis_plus_gx', 'stella2014', 'prosystem')]"
      - name: Require 132 successful original-game boots and bounded resident memory
        timeout-minutes: 12
        run: |
          mkdir -p test-evidence
          python tools/probe_native_session_cycles.py --core-dir cores --cycles 12 --max-growth-mb 128 --report test-evidence/native-core-switch-132.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-132-real-native-console-restarts
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  snes-original-ppu-spc-audio:
    # Generated 65816 LoROM and SPC IPL test tone, no copied game content.
    # Must produce nonblank changing pixels AND native Snes9x DSP samples.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, ext: so}
          - {os: windows-2025, target: windows-x64, ext: dll}
          - {os: macos-15, target: macos-arm64, ext: dylib}
          - {os: macos-15-intel, target: macos-x64, ext: dylib}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    env:
      AP_V30_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux native graphics and audio requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
      - name: Install test Python requirements
        run: python -m pip install -r requirements.txt
      - name: Retrieve Snes9x Libretro candidate for test, not installed game
        run: python -c "from fetch_mgba_core import fetch_core; fetch_core('snes9x')"
      - name: Require original SNES mode-0 RGB and nonzero SPC DSP PCM
        run: |
          python tools/probe_snes_homebrew.py --core cores/snes9x_libretro.${{ matrix.ext }} --seconds 8 --report test-evidence/snes-original-ppu-spc-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-3.0-original-SNES-native-PPU-SPC-${{ matrix.target }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  sega-8bit-original-native-av:
