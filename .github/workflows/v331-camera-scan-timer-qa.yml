name: 3.3.1 | Camera discovery timer ownership

# Synthetic Tk and discovery-worker callbacks only; no USB cameras/ROMs.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-camera-scan-timer-qa.yml'
      - 'anything_plays/ui_camera.py'
      - 'tests/test_v331_camera_scan_timer_recovery.py'

permissions:
  contents: read

jobs:
  scan-recovery:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Camera scan recovery | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal import dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - name: Verify camera scan ownership and older discovery paths
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/ui_camera.py tests/test_v331_camera_scan_timer_recovery.py
          python -m unittest discover -s tests -p 'test_v331_camera_scan_timer_recovery.py' -v
          python -m unittest discover -s tests -p 'test_v33_camera_scan_generation.py' -v
          python -m unittest discover -s tests -p 'test_v331_camera_retry_schedule_recovery.py' -v
          python -m unittest discover -s tests -p 'test_v311_camera_failure_isolation.py' -v
