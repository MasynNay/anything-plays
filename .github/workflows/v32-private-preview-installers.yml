name: 3.2 | Isolated four-platform preview installers (unreleased)

# A build-only owner-QA workflow. No tag, GitHub release, deployment, or
# stable installer update. Each output ships only the minimal mGBA core.
on:
  pull_request:
    paths:
      - '.github/workflows/v32-private-preview-installers.yml'
      - 'anything_plays/**'
      - 'app.py'
      - 'packaging/**'
      - 'tools/write_v31_identity.py'
      - 'tools/verify_v32_preview.py'
      - 'tools/stage_v32_full_linux.py'
      - 'tools/stage_v32_full_windows.py'
      - 'tools/stage_v32_full_macos.py'
      - 'tools/v32_*native_runtime.py'
      - 'tools/probe_gamecube_app.py'
      - 'tools/probe_ngp_mit_homebrew.py'
      - 'tools/probe_n64_homebrew.py'
      - 'tools/probe_v30_ngp_mono_native_av.py'
      - 'tools/ngp_mit_fixtures.py'
      - 'tools/n64_homebrew_fixture.py'
      - 'tools/gamecube_homebrew_fixture.py'
      - 'tests/test_v32_*runtime.py'
      - 'requirements-build.txt'
      - 'verify_bundle.py'
      - 'fetch_mgba_core.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v32-unreleased-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-isolated-preview:
    # Never run for another PR or a stable/default branch dispatch.
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/v3.2-integration' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/v3.2-integration') }}
    name: 3.2 mGBA-only QA | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            installer: release/anything-plays-32-preview_3.2.0~preview1_amd64.deb
            bundle: dist/AnythingPlays
          - target: windows-x64
            runner: windows-latest
            installer: release/AnythingPlaysSetup-3.2.0-preview1.exe
            bundle: dist/AnythingPlays
          - target: macos-arm64
            runner: macos-15
            installer: release/AnythingPlays-3.2.0-preview1-macos-arm64.dmg
            bundle: dist/AnythingPlays32Preview.app
          - target: macos-x64
            runner: macos-15-intel
            installer: release/AnythingPlays-3.2.0-preview1-macos-x64.dmg
            bundle: dist/AnythingPlays32Preview.app
    env:
      AP_V32_PREVIEW_BUILD: '1'
      AP_V32_PREVIEW: '0'
      AP_V30_MINIMAL_CORE_BUILD: '1'
      AP_RELEASE_BUILD: '0'
      AP_V30_APPROVED_RELEASE: '0'
      AP_V30_STABLE_CANDIDATE: '0'
      AP_V30_TEST_CORES: '0'
      AP_V30_GPL_TRIAL: '0'
      AP_V30_TIA_TRIAL: '0'
      AP_V31_PREVIEW: '0'
      AP_V31_RC: '0'
      AP_V31_RC2: '0'
      AP_V31_FINAL_CANDIDATE: '0'
      AP_V311_CANDIDATE: '0'
      AP_V311_STABLE_CANDIDATE: '0'
      AP_V32_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate exact source revision and review-only build flags
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AP_V32_QA_SOURCE_SHA"
          test "$AP_V32_PREVIEW_BUILD" = "1"
          test "$AP_V30_MINIMAL_CORE_BUILD" = "1"
          test "$AP_RELEASE_BUILD" = "0"
          python - <<'PY'
          from anything_plays.build_identity import make_identity
          from tools.write_v31_identity import choose_channel
          import os
          assert choose_channel(os.environ) == "v32_preview"
          assert make_identity("v32_preview")["public_release_approved"] is False
          print("3.2 preview exclusively selected; public release disabled")
          PY
      - name: Verify preview save/core isolation on this actual OS
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v32_native_storage.py' -v
          python -m unittest discover -s tests -p 'test_v32_nested_native_storage.py' -v
          python -m unittest discover -s tests -p 'test_v32_state_atomic.py' -v
          python -m unittest discover -s tests -p 'test_v32_preview_endurance.py' -v
          python -m unittest discover -s tests -p 'test_v32_preview_startup_gate.py' -v
          python -m unittest discover -s tests -p 'test_v32_installed_gui.py' -v
          python -m unittest discover -s tests -p 'test_v32_stationary_calibration.py' -v
          python -m unittest discover -s tests -p 'test_v32_controller_capture.py' -v
          python -m unittest discover -s tests -p 'test_v32_full_linux_gate.py' -v
          python -m unittest discover -s tests -p 'test_v32_full_windows_gate.py' -v
          python -m unittest discover -s tests -p 'test_v32_full_macos_gate.py' -v
          python -m unittest discover -s tests -p 'test_v32_original_native_runtime.py' -v
          python -m unittest discover -s tests -p 'test_v32_extended_native_runtime.py' -v
      - name: Install Linux native Debian tooling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo bash tools/ci_use_canonical_ubuntu_mirror.sh
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2             -o Acquire::http::Timeout=25 install -y --no-install-recommends             python3-tk dpkg-dev libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb
      - name: Install Windows Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup not available" }
      - name: Package Linux DEB
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/build_linux_deb.sh
      - name: Package Windows EXE
        if: runner.os == 'Windows'
        shell: cmd
        run: call packaging\build_windows.bat
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build_macos_dmg.sh
      - name: Verify frozen 3.2 preview identity and artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.verify_v32_preview             --target '${{ matrix.target }}'             --installer '${{ matrix.installer }}'             --bundle '${{ matrix.bundle }}'             --output 'release/V32_PRIVATE_PREVIEW_RECEIPT.json'
      - name: Linux installed Debian application startup smoke (isolated)
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          QA_HOME="$(mktemp -d)"
          trap 'rm -rf "$QA_HOME"' EXIT
          mkdir -p "$QA_HOME/payload" "$QA_HOME/home"
          # Seed dummy public 3.1 preferences AND profiles; the same native
          # verifier guards both files on Linux, Windows and both Macs.
          python -m tools.verify_v32_installed_gui seed --home "$QA_HOME/home"
          cp "$QA_HOME/home/.config/anything-plays-31/preferences.json" \
             "$QA_HOME/stable-before.json"
          dpkg-deb -x '${{ matrix.installer }}' "$QA_HOME/payload"
          ENTRY="$QA_HOME/payload/opt/anything-plays-32-preview/AnythingPlays"
          test -x "$ENTRY"
          HOME="$QA_HOME/home" \
          AP_V30_UI_SMOKE_CHECK=1 \
          AP_V32_GUI_SMOKE_CHECK=1 \
          AP_V32_SETUP_SMOKE_CHECK=1 \
          AP_V30_UI_SMOKE_REPORT="$QA_HOME/v32-installed-gui.json" \
          SDL_VIDEODRIVER=dummy \
          PYGAME_HIDE_SUPPORT_PROMPT=1 \
          timeout 65 xvfb-run -a "$ENTRY" --ap-v30-ui-smoke
          cmp "$QA_HOME/stable-before.json" \
              "$QA_HOME/home/.config/anything-plays-31/preferences.json"
          test -f "$QA_HOME/home/.config/anything-plays-32-preview/system_profiles.json"
          python - "$QA_HOME/v32-installed-gui.json" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["passed"] is True
          assert data["actual_tk_window_started"] is True
          assert data["actual_app_initialized"] is True
          assert data["actual_tk_mainloop_ran"] is True
          assert data["frozen_binary"] is True
          assert data["v32_frozen_isolation_verified"] is True
          assert data["v32_settings_namespace"] == "anything-plays-32-preview"
          assert data["public_distribution_approved"] is False
          assert data["camera_hardware_tested"] is False
          assert data["gameplay_hardware_tested"] is False
          print("Verified actual extracted 3.2 Debian App GUI startup")
          PY
          python -m tools.verify_v32_installed_gui verify \
            --home "$QA_HOME/home" \
            --report "$QA_HOME/v32-installed-gui.json" \
            --output release/V32_INSTALLED_GUI_RECEIPT.json
      - name: Windows real Inno install and frozen 3.2 GUI startup
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qa = Join-Path $env:RUNNER_TEMP "AP32-Installed-GUI-$env:GITHUB_RUN_ID"
          $homeDir = Join-Path $qa 'home'
          $installDir = Join-Path $qa 'installed'
          New-Item -ItemType Directory -Force -Path $homeDir | Out-Null
          $installer = (Resolve-Path '${{ matrix.installer }}').Path
          # Use the same genuine silent Inno installer exercised by 3.1's
          # installed-app workflow; never just execute the build directory.
          python -c "import sys; from pathlib import Path; from tools.assemble_v31_full_windows import unpack; unpack(Path(sys.argv[1]), Path(sys.argv[2]))" $installer $installDir
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Inno install failed' }
          $exe = Join-Path $installDir 'AnythingPlays.exe'
          if (-not (Test-Path $exe)) { throw 'Installed 3.2 executable missing' }
          python -m tools.verify_v32_installed_gui seed --home $homeDir
          if ($LASTEXITCODE -ne 0) { throw 'Failed to seed dummy stable fixtures' }
          $env:USERPROFILE = $homeDir
          $env:HOME = $homeDir
          $env:APPDATA = Join-Path $homeDir 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $homeDir 'AppData/Local'
          $env:AP_V30_UI_SMOKE_CHECK = '1'
          $env:AP_V32_GUI_SMOKE_CHECK = '1'
          $env:AP_V32_SETUP_SMOKE_CHECK = '1'
          $env:AP_V30_UI_SMOKE_REPORT = Join-Path $PWD 'release/V32_FROZEN_GUI_SMOKE.json'
          $env:SDL_AUDIODRIVER = 'dummy'
          $env:PYGAME_HIDE_SUPPORT_PROMPT = '1'
          $process = Start-Process -FilePath $exe -ArgumentList '--ap-v30-ui-smoke' -Wait -PassThru -ErrorAction Stop
          if ($process.ExitCode -ne 0) { throw "Installed 3.2 frozen GUI exit: $($process.ExitCode)" }
          python -m tools.verify_v32_installed_gui verify --home $homeDir --report $env:AP_V30_UI_SMOKE_REPORT --output (Join-Path $PWD 'release/V32_INSTALLED_GUI_RECEIPT.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed 3.2 GUI or stable-settings verifier failed' }
      - name: macOS genuine mounted preview DMG frozen GUI startup
        if: matrix.target == 'macos-arm64' || matrix.target == 'macos-x64'
        shell: bash
        run: |
          set -euo pipefail
          QA="$(mktemp -d /tmp/ap32-frozen-gui.XXXXXX)"
          MOUNT="$(mktemp -d /tmp/ap32-preview-dmg.XXXXXX)"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true; rm -rf "$QA"; rmdir "$MOUNT" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$QA/home"
          python -m tools.verify_v32_installed_gui seed --home "$QA/home"
          # macOS 3.1's installed GUI jobs also launch a mounted DMG. A
          # bounded retry handles transient hosted DiskImages resource locks.
          mounted=0
          for attempt in 1 2 3 4 5; do
            if hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" '${{ matrix.installer }}'; then
              mounted=1
              break
            fi
            hdiutil detach "$MOUNT" >/dev/null 2>&1 || true
            sleep "$((attempt * 3))"
          done
          test "$mounted" = 1
          BUNDLE="$MOUNT/AnythingPlays32Preview.app"
          ENTRY="$BUNDLE/Contents/MacOS/AnythingPlays"
          test -x "$ENTRY"
          codesign --verify --verbose=2 "$BUNDLE"
          HOME="$QA/home" \
          XDG_CONFIG_HOME="$QA/home/.config" \
          AP_V30_UI_SMOKE_CHECK=1 \
          AP_V32_GUI_SMOKE_CHECK=1 \
          AP_V32_SETUP_SMOKE_CHECK=1 \
          AP_V30_UI_SMOKE_REPORT="$PWD/release/V32_FROZEN_GUI_SMOKE.json" \
          SDL_AUDIODRIVER=dummy \
          PYGAME_HIDE_SUPPORT_PROMPT=1 \
          python - "$ENTRY" <<'PY'
          import os
          import subprocess
          import sys
          task = subprocess.run(
              [sys.argv[1], "--ap-v30-ui-smoke"],
              env=os.environ.copy(), capture_output=True, text=True,
              timeout=120,
          )
          if task.returncode:
              print(task.stderr[-4000:])
              print(task.stdout[-1000:])
              raise SystemExit(f"Mounted 3.2 DMG frozen GUI exit: {task.returncode}")
          print("Verified actual signed mounted preview Tk executable started")
          PY
          python -m tools.verify_v32_installed_gui verify \
            --home "$QA/home" \
            --report release/V32_FROZEN_GUI_SMOKE.json \
            --output release/V32_INSTALLED_GUI_RECEIPT.json
      - name: Assemble private Linux full 11-native-core candidate from verified 3.1.1 bytes
        if: matrix.target == 'linux-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline311
          gh release download v3.1.1 --repo "$GITHUB_REPOSITORY" \
            --pattern anything-plays-31_3.1.1_amd64.deb --dir baseline311
          gh release download v3.1.1 --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --dir baseline311
          python -m tools.stage_v32_full_linux \
            --stable baseline311/anything-plays-31_3.1.1_amd64.deb \
            --preview 'release/anything-plays-32-preview_3.2.0~preview1_amd64.deb' \
            --checksums baseline311/SHA256SUMS.txt \
            --source-receipt release/V32_PRIVATE_PREVIEW_RECEIPT.json \
            --source-sha "$AP_V32_QA_SOURCE_SHA" \
            --output release/v32-full-linux
          FULL="$PWD/release/v32-full-linux"
          QA_HOME="$(mktemp -d)"
          trap 'rm -rf "$QA_HOME"' EXIT
          dpkg-deb -x "$FULL/anything-plays-32-preview_3.2.0~fullqa1_amd64.deb" "$QA_HOME/full-installed"
          HOME="$QA_HOME" \
          AP_V30_UI_SMOKE_CHECK=1 \
          AP_V32_GUI_SMOKE_CHECK=1 \
          AP_V30_UI_SMOKE_REPORT="$FULL/V32_FULL_LINUX_GUI_SMOKE.json" \
          SDL_VIDEODRIVER=dummy \
          PYGAME_HIDE_SUPPORT_PROMPT=1 \
          timeout 65 xvfb-run -a \
            "$QA_HOME/full-installed/opt/anything-plays-32-preview/AnythingPlays" --ap-v30-ui-smoke
          python - "$FULL" <<'PY'
          import json
          from pathlib import Path
          import sys
          directory = Path(sys.argv[1])
          receipt = json.loads((directory/"V32_FULL_LINUX_QA_RECEIPT.json").read_text())
          smoke = json.loads((directory/"V32_FULL_LINUX_GUI_SMOKE.json").read_text())
          assert receipt["native_core_count"] == 11
          assert receipt["console_profiles"] == 18
          assert receipt["public_release_approved"] is False
          assert receipt["all_18_consoles_gameplay_verified"] is False
          assert smoke["passed"] is True
          assert smoke["frozen_binary"] is True
          assert smoke["v32_frozen_isolation_verified"] is True
          assert smoke["console_profile_count"] == 18
          assert smoke["public_distribution_approved"] is False
          print("Full native 3.2 Linux candidate installed-GUI PASS; hardware and real gameplay NOT certified")
          PY
          # Native software execution: original source-generated legal
          # homebrew, exact repacked 3.2 native core bytes. No real games,
          # hardware, BIOS downloads, network, or stable user save directory.
          AP_V32_PREVIEW=1 \
          SDL_AUDIODRIVER=dummy \
          timeout 220 .build-venv/bin/python -m tools.v32_original_native_runtime \
            --bundle "$QA_HOME/full-installed/opt/anything-plays-32-preview" \
            --source-receipt "$FULL/V32_FULL_LINUX_QA_RECEIPT.json" \
            --source-sha "$AP_V32_QA_SOURCE_SHA" \
            --seconds 4 \
            --report "$FULL/V32_ORIGINAL_HOMEBREW_RUNTIME_QA.json"
          python - "$FULL/V32_ORIGINAL_HOMEBREW_RUNTIME_QA.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          assert report["passed"] is True
          assert report["required_profiles_tested"] == ["gb", "gbc", "gba", "nes", "snes", "genesis"]
          assert report["required_profiles_passed"] == 6
          assert len(report["exploratory_profiles_tested"]) == 8
          assert len(report["probes"]) == 14
          assert report["original_source_generated_homebrew_only"] is True
          assert report["all_18_consoles_gameplay_verified"] is False
          assert report["commercial_game_compatibility_verified"] is False
          assert report["public_release_approved"] is False
          print("6 gated original-source A/V homebrew systems and 8 additional exploratory native profiles examined in installed 3.2; retail compatibility NOT verified")
          PY
          # Separate exploratory software runtime research for the four
          # remaining profiles. The mono NGP program is fully original and
          # generated offline. Color NGP, N64 and GC use only hash-pinned
          # MIT/public-domain/zlib CI fixtures from immutable upstream.
          # Missing media, native crashes, and hangs are NOT VERIFIED.
          SDL_AUDIODRIVER=dummy \
          timeout 460 xvfb-run -a -s '-screen 0 1280x800x24' \
            .build-venv/bin/python -m tools.v32_extended_native_runtime \
              --bundle "$QA_HOME/full-installed/opt/anything-plays-32-preview" \
              --source-receipt "$FULL/V32_FULL_LINUX_QA_RECEIPT.json" \
              --source-sha "$AP_V32_QA_SOURCE_SHA" \
              --report "$FULL/V32_FOUR_REMAINING_CONSOLES_RESEARCH_QA.json"
          python - "$FULL/V32_FOUR_REMAINING_CONSOLES_RESEARCH_QA.json" <<'PY'
          import json, sys
          from pathlib import Path
          evidence = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          assert evidence["profiles"] == ["ngp", "ngpc", "n64", "gamecube"]
          assert evidence["profiles_attempted"] == 4
          assert len(evidence["probe_results"]) == 4
          assert 0 <= evidence["exploratory_profiles_verified"] <= 4
          assert evidence["all_18_consoles_gameplay_verified"] is False
          assert evidence["public_release_approved"] is False
          assert evidence["commercial_game_compatibility_verified"] is False
          assert all(row["is_exploratory"] is True for row in evidence["probe_results"])
          print("Four remaining homebrew research probes recorded with individual fail/pass; no general retail compatibility claimed")
          PY
      - name: Retain Linux full-native-core research QA separately (never public)
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.2-linux-x64-18-PROFILE-FULL-NATIVE-PRIVATE-QA
          path: |
            release/v32-full-linux/anything-plays-32-preview_3.2.0~fullqa1_amd64.deb
            release/v32-full-linux/V32_FULL_LINUX_QA_RECEIPT.json
            release/v32-full-linux/V32_FULL_LINUX_GUI_SMOKE.json
            release/v32-full-linux/V32_ORIGINAL_HOMEBREW_RUNTIME_QA.json
            release/v32-full-linux/V32_FOUR_REMAINING_CONSOLES_RESEARCH_QA.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Assemble private Windows full-native QA Inno from published 3.1.1 native cores
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stableDir = Join-Path $PWD 'baseline311'
          New-Item -ItemType Directory -Force -Path $stableDir | Out-Null
          gh release download v3.1.1 --repo $env:GITHUB_REPOSITORY --pattern 'AnythingPlaysSetup-3.1.1.exe' --dir $stableDir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot get published Windows 3.1.1 installer' }
          gh release download v3.1.1 --repo $env:GITHUB_REPOSITORY --pattern 'SHA256SUMS.txt' --dir $stableDir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify public Windows 3.1.1 SHA256' }
          python -m tools.stage_v32_full_windows --stable (Join-Path $stableDir 'AnythingPlaysSetup-3.1.1.exe') --preview 'release/AnythingPlaysSetup-3.2.0-preview1.exe' --checksums (Join-Path $stableDir 'SHA256SUMS.txt') --source-receipt 'release/V32_PRIVATE_PREVIEW_RECEIPT.json' --source-sha $env:AP_V32_QA_SOURCE_SHA --output 'release/v32-full-windows'
          if ($LASTEXITCODE -ne 0) { throw '3.2 full Windows native-core stage failed' }
          $full = Join-Path $PWD 'release/v32-full-windows'
          $installer = Join-Path $full 'AnythingPlaysSetup-3.2.0-fullqa1.exe'
          $qa = Join-Path $env:RUNNER_TEMP "AP32-Full-Windows-$env:GITHUB_RUN_ID"
          $qaHome = Join-Path $qa 'home'
          $installed = Join-Path $qa 'installed'
          New-Item -ItemType Directory -Force -Path $qaHome | Out-Null
          python -c "import sys; from pathlib import Path; from tools.assemble_v31_full_windows import unpack; unpack(Path(sys.argv[1]), Path(sys.argv[2]))" $installer $installed
          if ($LASTEXITCODE -ne 0) { throw 'Full QA Inno installation failed' }
          $exe = Join-Path $installed 'AnythingPlays.exe'
          if (-not (Test-Path $exe)) { throw 'Full-core 3.2 QA executable missing' }
          $env:HOME = $qaHome
          $env:USERPROFILE = $qaHome
          $env:APPDATA = Join-Path $qaHome 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $qaHome 'AppData/Local'
          $env:AP_V30_UI_SMOKE_CHECK = '1'
          $env:AP_V32_GUI_SMOKE_CHECK = '1'
          $env:AP_V32_SETUP_SMOKE_CHECK = '0'
          $env:AP_V30_UI_SMOKE_REPORT = Join-Path $full 'V32_FULL_WINDOWS_GUI_SMOKE.json'
          $env:SDL_AUDIODRIVER = 'dummy'
          $env:PYGAME_HIDE_SUPPORT_PROMPT = '1'
          $process = Start-Process -FilePath $exe -ArgumentList '--ap-v30-ui-smoke' -Wait -PassThru -ErrorAction Stop
          if ($process.ExitCode -ne 0) { throw "Installed full Windows GUI failed: $($process.ExitCode)" }
          $receipt = Get-Content -Raw (Join-Path $full 'V32_FULL_WINDOWS_QA_RECEIPT.json') | ConvertFrom-Json
          $smoke = Get-Content -Raw $env:AP_V30_UI_SMOKE_REPORT | ConvertFrom-Json
          if ($receipt.native_core_count -ne 11 -or $receipt.console_profiles -ne 18 -or $receipt.public_release_approved -ne $false -or $receipt.all_18_consoles_gameplay_verified -ne $false) { throw 'Windows QA receipt falsely claimed acceptance' }
          if ($smoke.passed -ne $true -or $smoke.frozen_binary -ne $true -or $smoke.v32_frozen_isolation_verified -ne $true -or $smoke.console_profile_count -ne 18 -or $smoke.public_distribution_approved -ne $false) { throw 'Full Windows installed GUI did not pass private QA' }
          Write-Output 'Private Windows full-native QA passed installed GUI; hardware and real games NOT certified'
      - name: Retain Windows full-native-core research QA separately (never public)
        if: matrix.target == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.2-windows-x64-18-PROFILE-FULL-NATIVE-PRIVATE-QA
          path: |
            release/v32-full-windows/AnythingPlaysSetup-3.2.0-fullqa1.exe
            release/v32-full-windows/V32_FULL_WINDOWS_QA_RECEIPT.json
            release/v32-full-windows/V32_FULL_WINDOWS_GUI_SMOKE.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Assemble separate 3.2 Mac full-native QA from published pinned 3.1.1 cores
        if: matrix.target == 'macos-arm64' || matrix.target == 'macos-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline311
          ARCH="${{ matrix.target }}"
          ARCH="$(echo "$ARCH" | sed 's/^macos-//')"
          STABLE="AnythingPlays-3.1.1-macos-$ARCH.dmg"
          gh release download v3.1.1 --repo "$GITHUB_REPOSITORY" \
            --pattern "$STABLE" --dir baseline311
          gh release download v3.1.1 --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --dir baseline311
          python -m tools.stage_v32_full_macos \
            --arch "$ARCH" \
            --stable "baseline311/$STABLE" \
            --preview '${{ matrix.installer }}' \
            --checksums baseline311/SHA256SUMS.txt \
            --source-receipt release/V32_PRIVATE_PREVIEW_RECEIPT.json \
            --source-sha "$AP_V32_QA_SOURCE_SHA" \
            --output release/v32-full-macos
          QA="release/v32-full-macos"
          python -m tools.smoke_v32_full_macos \
            --arch "$ARCH" \
            --installer "$QA/AnythingPlays-3.2.0-fullqa1-macos-$ARCH.dmg" \
            --receipt "$QA/V32_FULL_MACOS_QA_RECEIPT.json" \
            --source-sha "$AP_V32_QA_SOURCE_SHA" \
            --output "$QA/V32_FULL_MACOS_GUI_SMOKE.json"
      - name: Retain Mac full-native research QA separately without publishing
        if: matrix.target == 'macos-arm64' || matrix.target == 'macos-x64'
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.2-${{ matrix.target }}-18-PROFILE-FULL-NATIVE-PRIVATE-QA
          path: |
            release/v32-full-macos/AnythingPlays-3.2.0-fullqa1-macos-*.dmg
            release/v32-full-macos/V32_FULL_MACOS_QA_RECEIPT.json
            release/v32-full-macos/V32_FULL_MACOS_GUI_SMOKE.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Describe accurate testing limitations
        shell: bash
        run: |
          cat > release/README_V32_PREVIEW.txt <<'EOF'
          Anything Plays 3.2 Preview 1 — UNRELEASED TEST BUILD

          This is a development test artifact, not the public stable app.
          It uses a different installer identity and a fresh settings folder:
          anything-plays-32-preview. It never imports your old preferences.

          This starter build includes only the mGBA native core for GB/GBC/GBA.
          The 18 console profiles are not evidence of 18 bundled native cores.
          Bring only your own legally obtained game files. No ROMs included.

          These checks do NOT verify a physical webcam, USB/Bluetooth gamepad,
          every native emulator, macOS notarization or public redistribution.
          Some macOS builds are ad-hoc signed and may require user approval.

          Compare the binary SHA256 with V32_PRIVATE_PREVIEW_RECEIPT.json.
          Never publish this artifact as a stable release or re-label it.
          EOF
      - name: Retain temporary QA artifacts (no GitHub Release or tag)
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.2-${{ matrix.target }}-UNRELEASED-QA
          path: |
            ${{ matrix.installer }}
            release/V32_PRIVATE_PREVIEW_RECEIPT.json
            release/V32_INSTALLED_GUI_RECEIPT.json
            release/README_V32_PREVIEW.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
