name: 3.3.1 | Equal-size cartridge save replacement recovery

# Temporary 4-byte SRAM only; no ROM or real filesystem outside test temp.
on:
  pull_request:
    paths:
      - '.github/workflows/v331-sram-same-size-repair-qa.yml'
      - 'anything_plays/libretro_save.py'
      - 'tests/test_v331_sram_same_size_repair.py'
      - 'tests/test_v331_sram_restore_identity_race.py'

permissions:
  contents: read

jobs:
  save-integrity:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Save integrity | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify cartridge SRAM and existing atomic-restore safety
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q anything_plays/libretro_save.py tests/test_v331_sram_same_size_repair.py
          python -m unittest discover -s tests -p 'test_v331_sram_same_size_repair.py' -v
          python -m unittest discover -s tests -p 'test_v331_sram_restore_identity_race.py' -v
          python -m unittest discover -s tests -p 'test_save_ram.py' -v
          python -m unittest discover -s tests -p 'test_v331_sram_truncated_repair.py' -v
          python -m unittest discover -s tests -p 'test_v331_sram_unplugged_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_v331_sram_restore_fd_safety.py' -v
          python -m unittest discover -s tests -p 'test_v32_native_storage.py' -v
