name: Anything Plays 3.0 | Approved stable publication

# NEVER trigger on push or tag. This manual workflow is deliberately unusable
# for test-only artifacts. Production publishing additionally requires a
# completed, independently reviewed acceptance record and exact approved inputs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable 3.0.x version (no alpha/beta/suffix)
        required: true
        default: '3.0.0'
        type: string
      candidate_run_id:
        description: GitHub run ID with all four APPROVED production artifacts
        required: true
        type: string
      source_run_id:
        description: Successful 11-core original source-only archive run
        required: true
        type: string
      publish_publicly:
        description: Publish a real public release (false makes draft only)
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type APPROVED-3.0-DISTRIBUTION to confirm source and rights review
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: anything-plays-v3-publication
  cancel-in-progress: false

jobs:
  approved-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: stable-v3-publication
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      PUBLISH_PUBLICLY: ${{ inputs.publish_publicly }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require main branch, exact approved version and manual release confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Stable publication must be dispatched from main"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^3\.0\.[0-9]+$ ]] || [[ ! "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid stable version or source run ID"
            exit 1
          fi
          if [[ "$RELEASE_CONFIRMATION" != "APPROVED-3.0-DISTRIBUTION" ]]; then
            echo "::error::Explicit approval phrase is required"
            exit 1
          fi
          if [[ ! -f docs/V3_RELEASE_NOTES_APPROVED.md ]]; then
            echo "::error::Approved final release notes are missing"
            exit 1
          fi
          for tag in "v$VERSION" "v$VERSION-sources"; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release already exists: $tag. Refusing overwrite."
              exit 1
            fi
          done
      - name: Enforce strict real-device and redistribution acceptance
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_repository_hygiene.py
          python tools/check_v30_release.py
          python -m unittest discover -s tests -p 'test_v30_publication_contract.py' -v
      - name: Verify original production candidate run has identical source revision
        shell: bash
        run: |
          set -euo pipefail
          run_sha="$(gh run view "$CANDIDATE_RUN_ID" --json headSha --jq '.headSha')"
          run_status="$(gh run view "$CANDIDATE_RUN_ID" --json conclusion --jq '.conclusion')"
          run_name="$(gh run view "$CANDIDATE_RUN_ID" --json name --jq '.name')"
          if [[ "$run_sha" != "$GITHUB_SHA" || "$run_status" != "success" ]]; then
            echo "::error::Candidate must succeed on exactly this reviewed main commit"
            exit 1
          fi
          if [[ "$run_name" != "Anything Plays 3.0 | Approved production candidates" ]]; then
            echo "::error::Developer preview and unrelated workflows are not production candidates"
            exit 1
          fi
      - name: Verify 11 original source archive run and stage separate source companion
        shell: bash
        run: |
          set -euo pipefail
          # Select the exact source composition from the *fully reviewed*
          # native lock, NEVER from an untrusted artifact name or user input.
          # Tia occupies the existing Atari 2600 core slot; its original Git
          # sources must accompany the release in place of Stella2014.
          source_selection="$(python - <<'PY'
          from tools.v30_release_lock import load_approved_lock, selected_core_set, ALTERNATIVE_TIA_CORE_NAMES
          lock=load_approved_lock()
          if selected_core_set(lock) == ALTERNATIVE_TIA_CORE_NAMES:
              print("tia")
          elif lock.get("core_set_id") == "gpl-source-built-eleven":
              print("stella")
          else:
              raise SystemExit("Release source companion requires a reviewed eleven-original-native lock")
          PY
          )"
          if [[ "$source_selection" == tia ]]; then
            expected_source_run_name="Anything Plays 3.0 | Preserve all 11 original sources with GPL2+ Tia"
            expected_source_artifact="AnythingPlays-3.0.0-ELEVEN-TIA-ORIGINAL-CORE-SOURCES-UNAPPROVED"
          else
            expected_source_run_name="Anything Plays 3.0 | Preserve all 11 pinned original corresponding sources"
            expected_source_artifact="AnythingPlays-3.0.0-ELEVEN-ORIGINAL-CORE-SOURCES-UNAPPROVED"
          fi
          source_status="$(gh run view "$SOURCE_RUN_ID" --json conclusion --jq '.conclusion')"
          source_name="$(gh run view "$SOURCE_RUN_ID" --json name --jq '.name')"
          if [[ "$source_status" != success || "$source_name" != "$expected_source_run_name" ]]; then
            echo "::error::Original source workflow does not match the exact reviewed native composition"
            exit 1
          fi
          # Bounded network retries use clean directories. Never reuse partial evidence.
          for attempt in 1 2 3 4; do
            scratch="source-artifacts.try-$attempt"
            if gh run download "$SOURCE_RUN_ID" \
              --name "$expected_source_artifact" \
              --dir "$scratch"; then
              mv "$scratch" source-artifacts
              break
            fi
            rm -rf -- "$scratch"
            if [[ "$attempt" == 4 ]]; then
              echo "::error::Original corresponding source archive unavailable"
              exit 1
            fi
            sleep "$((attempt * 3))"
          done
          python -m unittest discover -s tests -p 'test_v30_source_companion.py' -v
          python - <<'PY'
          from pathlib import Path
          from tools.prepare_v30_source_companion import validate_captured_sources
          from tools.v30_release_lock import load_approved_lock
          manifest=validate_captured_sources(Path("source-artifacts"))
          lock=load_approved_lock()
          expected_id=("original-eleven-gpl2plus-tia"
                       if lock.get("core_set_id") == "gpl-source-built-eleven-tia" else None)
          if manifest.get("source_set_id") != expected_id:
              raise SystemExit("Public 3.0 source archive cannot differ from reviewed 11-native Tia/Stella lineup")
          PY
          python -m tools.prepare_v30_source_companion \
            --input source-artifacts --output source-release-package --version "$VERSION"
          (cd source-release-package && sha256sum --check SHA256SUMS.txt)
      - name: Download only four production-approved platform artifacts
        shell: bash
        run: |
          set -euo pipefail
          for target in windows-x64 macos-arm64 macos-x64 linux-x64; do
            gh run download "$CANDIDATE_RUN_ID" \
              --name "AnythingPlays-$VERSION-PRODUCTION-$target" \
              --dir "candidate-platforms/$target"
          done
      - name: Revalidate original release-mode provenance and immutable installer checksums
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.collect_v30_production_assets \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --input candidate-platforms --output production-input
          python -m tools.stage_v30_release_assets \
            --version "$VERSION" \
            --input production-input --output public-release
          cd public-release
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
      - name: Draft separate source-only companion BEFORE binary publication
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION-sources" source-release-package/* \
            --title "Anything Plays $VERSION | Original emulator sources" \
            --notes "All eleven pinned upstream emulator source trees, SHA256SUMS and original license notices. The matching Anything Plays application source and build workflows are available at tag v$VERSION. No game ROMs or newly compiled emulator cores are included." \
            --target "$GITHUB_SHA" \
            --draft --prerelease
          cp docs/V3_RELEASE_NOTES_APPROVED.md final-release-notes.md
          printf '\n**Full pinned emulator source archive:** https://github.com/%s/releases/tag/v%s-sources\n' \
            "$GITHUB_REPOSITORY" "$VERSION" >> final-release-notes.md
      - name: Create a non-public app draft linking the separate source archive
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION" public-release/* \
            --title "Anything Plays $VERSION" \
            --notes-file final-release-notes.md \
            --target "$GITHUB_SHA" \
            --draft
      - name: Publish source access first, then the four-installer stable release
        if: ${{ inputs.publish_publicly }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v$VERSION-sources" --draft=false
          gh release view "v$VERSION-sources" --json isDraft --jq '.isDraft' | grep -qx false
          gh release edit "v$VERSION" --draft=false
          gh release view "v$VERSION" --json isDraft --jq '.isDraft' | grep -qx false
