name: 3.1.0 | Private four-platform FINAL identity build QA

# Exact new 3.1.0 package and embedded app identities, not renamed RC2
# binaries. Builds mGBA source shells only. No publication or rights approval.
on:
  pull_request:
    paths:
      - '.github/workflows/v31-final-identity-private-qa.yml'
      - 'anything_plays/build_identity.py'
      - 'anything_plays/test_preferences.py'
      - 'tools/write_v31_identity.py'
      - 'packaging/build_linux_deb.sh'
      - 'packaging/build_windows.bat'
      - 'packaging/build_macos_dmg.sh'
      - 'packaging/installer.iss'
      - 'tests/test_v31_final_candidate_identity.py'
      - 'tools/v31_final_source.py'
      - 'tools/assemble_v31_full_linux.py'
      - 'tools/assemble_v31_full_windows.py'
      - 'tools/assemble_v31_full_macos.py'
      - 'tools/verify_v31_final_installed_ui.py'
      - 'tools/qa_v31_final_installed_preferences.py'
      - 'tests/test_v31_final_full_assembly.py'
      - 'tests/test_v31_final_installed_ui.py'
      - '.github/workflows/v31-final-installed-desktop.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-final-identity-private-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  build-private-final-identity:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Genuine 3.1.0 source identity | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04, installer: 'anything-plays-31_3.1.0_amd64.deb', bundle: 'dist/AnythingPlays'}
          - {target: windows-x64, runner: windows-latest, installer: 'AnythingPlaysSetup-3.1.0.exe', bundle: 'dist/AnythingPlays'}
          - {target: macos-arm64, runner: macos-15, installer: 'AnythingPlays-3.1.0-macos-arm64.dmg', bundle: 'dist/AnythingPlays31.app'}
          - {target: macos-x64, runner: macos-15-intel, installer: 'AnythingPlays-3.1.0-macos-x64.dmg', bundle: 'dist/AnythingPlays31.app'}
    env:
      AP_V31_FINAL_CANDIDATE: '1'
      AP_V31_PREVIEW: '0'
      AP_V31_RC: '0'
      AP_V31_RC2: '0'
      AP_V30_MINIMAL_CORE_BUILD: '1'
      AP_V30_TEST_CORES: '0'
      AP_V30_GPL_TRIAL: '0'
      AP_V30_TIA_TRIAL: '0'
      AP_RELEASE_BUILD: '0'
      AP_V30_APPROVED_RELEASE: '0'
      AP_V30_STABLE_CANDIDATE: '0'
      AP_V31_FINAL_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify actual checked-out SHA and fail-closed final identity contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AP_V31_FINAL_SOURCE_SHA"
          python -m unittest discover -s tests -p 'test_v31_final_candidate_identity.py' -v
      - name: Repair native Ubuntu package mirrors if runner Azure DNS fails
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash tools/ci_use_canonical_ubuntu_mirror.sh
      - name: Install Linux native packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 update || true
            if sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 \
                -o Acquire::http::Timeout=20 install -y --no-install-recommends \
                python3-tk dpkg-dev libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb; then
              ok=1
              break
            fi
            sleep "$((attempt * 10))"
          done
          test "$ok" = 1
      - name: Install Windows Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup unavailable" }
      - name: Download original verified camera-only OpenCV wheel for exact native target
        shell: bash
        env:
          AP_CLEAN_NATIVE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p customcamera
          case "$AP_CLEAN_NATIVE_TARGET" in
            linux-x64)
              run_id=43133383864
              artifact=AnythingPlays-3.1-LINUX-FROM-SOURCE-CAMERA-ONLY-OPENCV-UNAPPROVED
              native_tag=linux-x86_64
              ;;
            windows-x64)
              run_id=43138596964
              artifact=AnythingPlays-3.1-WINDOWS-SOURCE-DIRECTSHOW-OPENCV-UNAPPROVED
              native_tag=windows-x86_64
              ;;
            macos-arm64)
              run_id=43137079614
              artifact=AnythingPlays-3.1-macos-arm64-SOURCE-CAMERA-ONLY-OPENCV-UNAPPROVED
              native_tag=macos-arm64
              ;;
            macos-x64)
              run_id=43137079614
              artifact=AnythingPlays-3.1-macos-x86_64-SOURCE-CAMERA-ONLY-OPENCV-UNAPPROVED
              native_tag=macos-x86_64
              ;;
            *)
              echo "::error::Unsupported clean camera source wheel target $AP_CLEAN_NATIVE_TARGET"
              exit 1
              ;;
          esac
          # Source wheels must ALREADY be built successfully in independent
          # native runners. A job still building or a failed source probe is
          # not an acceptable input for a unified four-platform public release.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > customcamera/source-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('customcamera/source-run.json').read_text('utf-8'))
          assert r['status']=='completed' and r['conclusion']=='success',r
          assert r['event']=='pull_request'
          print('Original independent source-wheel native CI PASS:',r['html_url'])
          PY
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" --dir customcamera
          python - "$AP_CLEAN_NATIVE_TARGET" "$native_tag" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          from tools.qa_v31_linux_camera_only_wheel import SOURCE_SHA256
          from tools.verify_custom_opencv_wheel import verify_custom_wheel
          platform,tag=sys.argv[1:]
          root=Path('customcamera')
          source=(root/'published20/opencv_python_headless-4.14.0.94.tar.gz'
                  if platform=='windows-x64' else
                  root/'sources/opencv_python_headless-4.14.0.94.tar.gz')
          assert source.is_file(),source
          assert hashlib.sha256(source.read_bytes()).hexdigest()==SOURCE_SHA256
          wheels=list(root.glob('wheels/*.whl'))
          assert len(wheels)==1,wheels
          wheel=wheels[0]
          manifest_path={
              'linux-x64':'evidence/LINUX_CAMERA_ONLY_OPENCV_SOURCE_QA_UNAPPROVED.json',
              'windows-x64':'evidence/WINDOWS_CAMERA_ONLY_OPENCV_SOURCE_QA_UNAPPROVED.json',
              'macos-arm64':'evidence/MAC_CAMERA_ONLY_OPENCV_SOURCE_QA_UNAPPROVED.json',
              'macos-x64':'evidence/MAC_CAMERA_ONLY_OPENCV_SOURCE_QA_UNAPPROVED.json',
          }[platform]
          receipt=json.loads((root/manifest_path).read_text('utf-8'))
          expected_status={
              'linux-x64':'PRIVATE_SOURCE_BUILT_LINUX_V4L2_ONLY_WHEEL_QA_NO_RELEASE',
              'windows-x64':'PRIVATE_SOURCE_BUILT_WINDOWS_DIRECTSHOW_FFMPEG_OFF_UNAPPROVED',
              'macos-arm64':'PRIVATE_NATIVE_MAC_CAMERA_ONLY_FFMPEG_AVIF_OFF_SOURCE_WHEEL_UNAPPROVED',
              'macos-x64':'PRIVATE_NATIVE_MAC_CAMERA_ONLY_FFMPEG_AVIF_OFF_SOURCE_WHEEL_UNAPPROVED',
          }[platform]
          assert receipt['status']==expected_status,receipt
          expected_receipt_target='macos-x86_64' if platform=='macos-x64' else platform
          assert receipt['target']==expected_receipt_target
          assert receipt['source_sha256']==SOURCE_SHA256
          assert receipt['wheel_sha256']==hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert receipt['public_release_approved'] is False
          assert receipt['redistribution_approved'] is False
          if platform=='linux-x64':
              assert receipt['opencv_linux_v4l2_backend_available']
              assert receipt['opencv_ffmpeg_backend_disabled']
          elif platform=='windows-x64':
              patch=root/'published20/WINDOWS_OPENCV_SETUP_PATCH.diff'
              assert patch.is_file()
              assert receipt['windows_source_patch_sha256']==hashlib.sha256(patch.read_bytes()).hexdigest()
              assert receipt['directshow_backend_compiled']
              assert receipt['opencv_ffmpeg_disabled']
          else:
              assert receipt['avfoundation_backend_compiled']
              assert receipt['ffmpeg_disabled_in_native_wheel']
              assert receipt['avif_native_dependency_omitted']
          verify_custom_wheel(wheel,receipt['wheel_sha256'],tag)
          Path('customcamera/INDEPENDENT_NATIVE_WHEEL_RECEIPT.json').write_text(
             json.dumps({'source_ci_run_id':json.loads(Path('customcamera/source-run.json').read_text('utf-8'))['id'],
                        'source_sha256':SOURCE_SHA256,'target':platform,
                        'native_wheel_sha256':receipt['wheel_sha256'],
                        'native_camera_capture_backend_proven':True,
                        'frozen_installer_tested':False,
                        'redistribution_approved':False,
                        'public_release_approved':False},indent=2)+'\n','utf-8')
          print('Trusted original-source camera-only wheel for:',platform,wheel.name)
          PY
          wheel="$(find customcamera/wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          case "$RUNNER_OS" in
            Windows) wheel_native="$(cygpath -w "$PWD/$wheel")" ;;
            *) wheel_native="$PWD/$wheel" ;;
          esac
          echo "AP_CUSTOM_OPENCV_WHEEL=$wheel_native" >> "$GITHUB_ENV"
          wheel_hash="$(python -c 'from pathlib import Path;import hashlib,sys;print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())' "$wheel")"
          echo "AP_CUSTOM_OPENCV_SHA256=$wheel_hash" >> "$GITHUB_ENV"
      - name: Build real final-version Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/build_linux_deb.sh
      - name: Build real final-version Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: call packaging\build_windows.bat
      - name: Build real final-version macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build_macos_dmg.sh
      - name: Inspect exact embedded stable-version identity and package on native OS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from anything_plays.build_identity import make_identity,validate_identity
          from hashlib import sha256
          import json,os,plistlib,subprocess
          target="${{ matrix.target }}"
          app=Path("${{ matrix.bundle }}")
          expected=Path("release")/"${{ matrix.installer }}"
          assert expected.is_file() and expected.stat().st_size>1024*1024,expected
          markers=list(app.rglob("v31_build_identity.json"))
          assert len(markers)==1,markers
          marker=validate_identity(json.loads(markers[0].read_text("utf-8")))
          assert marker==make_identity("final_candidate")
          assert marker["version"]=="3.1.0" and marker["settings_namespace"]=="anything-plays-31"
          assert marker["public_release_approved"] is False
          assert marker["channel"] not in ("rc1","rc2")
          if target=="linux-x64":
              package=subprocess.check_output(["dpkg-deb","-f",str(expected),"Package"],text=True).strip()
              version=subprocess.check_output(["dpkg-deb","-f",str(expected),"Version"],text=True).strip()
              assert (package,version)==("anything-plays-31","3.1.0"),(package,version)
          if target.startswith("macos"):
              p=plistlib.loads((app/"Contents/Info.plist").read_bytes())
              assert p["CFBundleIdentifier"]=="com.anythingplays.release31",p
              assert p["CFBundleShortVersionString"]=="3.1.0",p
              assert p["CFBundleVersion"]=="3.1.0",p
          digest=sha256(expected.read_bytes()).hexdigest()
          r={"schema_version":1,"status":"PRIVATE_SOURCE_STAGE_FINAL_IDENTITY_QA_ONLY",
             "source_revision":os.environ["AP_V31_FINAL_SOURCE_SHA"],
             "target":target,"installer":expected.name,"sha256":digest,
             "size_bytes":expected.stat().st_size,"version":"3.1.0",
             "identity_channel":"final_candidate",
             "settings_namespace":"anything-plays-31",
             "only_mgba_source_stage":True,"native_core_count":1,
             "full_18_console_release_ready":False,
             "public_release_approved":False,
             "relinking_approved":False,
             "physical_hardware_verified":False}
          Path("release/FINAL_IDENTITY_SOURCE_QA.json").write_text(json.dumps(r,indent=2)+"\n","utf-8")
          print("Version-correct independent 3.1 candidate built:",target,digest)
          PY
      - name: Preserve exact native camera source/build proof with version-correct application
        shell: bash
        run: |
          set -euo pipefail
          test -s release/FINAL_IDENTITY_SOURCE_QA.json
          test -s customcamera/INDEPENDENT_NATIVE_WHEEL_RECEIPT.json
          cp customcamera/INDEPENDENT_NATIVE_WHEEL_RECEIPT.json \
            release/FINAL_CAMERA_ONLY_OPENCV_SOURCE_QA.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path('release/FINAL_IDENTITY_SOURCE_QA.json').read_text('utf-8'))
          w=json.loads(Path('release/FINAL_CAMERA_ONLY_OPENCV_SOURCE_QA.json').read_text('utf-8'))
          assert s['source_revision']==os.environ['AP_V31_FINAL_SOURCE_SHA']
          assert s['target']==w['target']
          assert w['native_camera_capture_backend_proven'] is True
          assert w['redistribution_approved'] is False
          assert w['public_release_approved'] is False
          print('Source-built, version-matched clean wheel receipt retained with source installer.')
          PY
      - name: Keep private final-identity binaries and checksum proofs for full-core review
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.1.0-FINAL-IDENTITY-${{ matrix.target }}-QA-ONLY
          path: |
            release/${{ matrix.installer }}
            release/FINAL_IDENTITY_SOURCE_QA.json
            release/FINAL_CAMERA_ONLY_OPENCV_SOURCE_QA.json
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  full-final-18-console:
    # One Ubuntu mirror/DNS failure must not discard authentic Windows/Mac
    # sources: every OS leg still must download its OWN source-stage artifact
    # and verify the exact recorded source revision and native core hashes.
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: build-private-final-identity
    name: Original-core full FINAL | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04, arch: none, baseline: 'anything-plays_3.0.0_amd64.deb', installer: 'anything-plays-31_3.1.0_amd64.deb', result: 'anything-plays-31_3.1.0_amd64.deb', receipt: FULL_LIBRARY_QA_RECEIPT.json}
          - {target: windows-x64, runner: windows-latest, arch: none, baseline: 'AnythingPlaysSetup-3.0.0.exe', installer: 'AnythingPlaysSetup-3.1.0.exe', result: 'AnythingPlaysSetup-3.1.0.exe', receipt: FULL_WINDOWS_QA_RECEIPT.json}
          - {target: macos-arm64, runner: macos-15, arch: arm64, baseline: 'AnythingPlays-3.0.0-macos-arm64.dmg', installer: 'AnythingPlays-3.1.0-macos-arm64.dmg', result: 'AnythingPlays-3.1.0-macos-arm64.dmg', receipt: FULL_MACOS_QA_RECEIPT.json}
          - {target: macos-x64, runner: macos-15-intel, arch: x64, baseline: 'AnythingPlays-3.0.0-macos-x64.dmg', installer: 'AnythingPlays-3.1.0-macos-x64.dmg', result: 'AnythingPlays-3.1.0-macos-x64.dmg', receipt: FULL_MACOS_QA_RECEIPT.json}
    env:
      GH_TOKEN: ${{ github.token }}
      AP_V31_FINAL_CANDIDATE: '1'
      AP_V31_RC2: '0'
      AP_V31_RC: '0'
      AP_V31_PREVIEW: '0'
      AP_V31_NEXT_QA: '1'
      AP_V31_FULL_TEST_CORES: '1'
      AP_V30_MINIMAL_CORE_BUILD: '0'
      AP_V30_TEST_CORES: '0'
      AP_V30_GPL_TRIAL: '0'
      AP_V30_TIA_TRIAL: '0'
      AP_RELEASE_BUILD: '0'
      AP_V30_APPROVED_RELEASE: '0'
      AP_V30_STABLE_CANDIDATE: '0'
      AP_V31_QA_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact private final source receipts, compiler guard and settings contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AP_V31_QA_CHECKOUT_SHA"
          python -m unittest discover -s tests -p 'test_v31_final_candidate_identity.py' -v
          python -m unittest discover -s tests -p 'test_v31_final_full_assembly.py' -v
          python -m unittest discover -s tests -p 'test_v31_final_installed_ui.py' -v
      - name: Download same-run FINAL source artifact for this specific platform
        uses: actions/download-artifact@v4
        with:
          name: AnythingPlays-3.1.0-FINAL-IDENTITY-${{ matrix.target }}-QA-ONLY
          path: finalsource
      - name: Verify original public 3.0 baseline is downloadable with immutable SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original30
          # macOS GitHub-hosted runners occasionally lose api.github.com
          # DNS for one release download. Keep the exact published 3.0 inputs
          # and signed SHA256 manifest; retry transient transport failures,
          # never use a missing/stale/unauthenticated binary.
          fetch_original_release_asset() {
            local asset="$1" target="original30/$1"
            for attempt in 1 2 3 4; do
              rm -f "$target"
              if gh release download v3.0.0 --repo "$GITHUB_REPOSITORY" \
                  --pattern "$asset" --dir original30 && test -s "$target"; then
                return 0
              fi
              echo "::warning::GitHub release download failed for $asset (attempt $attempt/4)"
              sleep "$((attempt * 10))"
            done
            echo "::error::Could not fetch exact public 3.0 asset $asset" >&2
            return 1
          }
          fetch_original_release_asset '${{ matrix.baseline }}'
          fetch_original_release_asset SHA256SUMS.txt
          test -s 'original30/${{ matrix.baseline }}'
          test -s original30/SHA256SUMS.txt
          test -s 'finalsource/${{ matrix.installer }}'
          test -s finalsource/FINAL_IDENTITY_SOURCE_QA.json
          test -s finalsource/FINAL_CAMERA_ONLY_OPENCV_SOURCE_QA.json
      - name: Install Linux authenticated original-core QA dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo bash tools/ci_use_canonical_ubuntu_mirror.sh
          ok=0
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update || true
            if sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 \
                -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
                install -y --no-install-recommends libgl1 libegl1 \
                libglib2.0-0 libportaudio2; then
              ok=1
              break
            fi
            sleep "$((attempt * 10))"
          done
          test "$ok" = 1
      - name: Install Windows compiler and verified icon dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup unavailable' }
          python -m pip install Pillow==12.3.0 numpy==2.5.4 opencv-python-headless==4.14.0.94
          if ($LASTEXITCODE -ne 0) { throw 'Icon dependencies unavailable' }
      - name: Assemble authentic eleven-core Linux FINAL installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m tools.assemble_v31_full_linux --final \
            --expected-source-revision "$AP_V31_QA_CHECKOUT_SHA" \
            --stable original30/${{ matrix.baseline }} \
            --preview finalsource/${{ matrix.installer }} \
            --sums original30/SHA256SUMS.txt \
            --receipt finalsource/FINAL_IDENTITY_SOURCE_QA.json --output fullfinal
      - name: Assemble authentic eleven-core Windows FINAL installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m tools.assemble_v31_full_windows --final \
            --expected-source-revision "$AP_V31_QA_CHECKOUT_SHA" \
            --stable original30/${{ matrix.baseline }} \
            --preview finalsource/${{ matrix.installer }} \
            --sums original30/SHA256SUMS.txt \
            --receipt finalsource/FINAL_IDENTITY_SOURCE_QA.json --output fullfinal
      - name: Assemble authentic eleven-core Mac FINAL DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m tools.assemble_v31_full_macos --final \
            --arch '${{ matrix.arch }}' --expected-source-revision "$AP_V31_QA_CHECKOUT_SHA" \
            --stable original30/${{ matrix.baseline }} \
            --preview finalsource/${{ matrix.installer }} \
            --checksums original30/SHA256SUMS.txt \
            --receipt finalsource/FINAL_IDENTITY_SOURCE_QA.json --output fullfinal
      - name: Attach unchanged clean OpenCV upstream source receipt to final installer evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s 'fullfinal/${{ matrix.result }}'
          cp finalsource/FINAL_CAMERA_ONLY_OPENCV_SOURCE_QA.json fullfinal/FINAL_CAMERA_ONLY_OPENCV_SOURCE_QA.json
      - name: Fail if any final installer alters frozen identity, count or SHA256
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from tools.v31_final_source import STAGE_STATUS, FULL_STATUS
          original=json.loads(Path('finalsource/FINAL_IDENTITY_SOURCE_QA.json').read_text('utf-8'))
          report=json.loads(Path('fullfinal/${{ matrix.receipt }}').read_text('utf-8'))
          binary=Path('fullfinal/${{ matrix.result }}')
          digest=hashlib.sha256(binary.read_bytes()).hexdigest()
          assert original["status"] == STAGE_STATUS
          assert original["source_revision"] == os.environ["AP_V31_QA_CHECKOUT_SHA"]
          assert original["settings_namespace"] == "anything-plays-31"
          assert report["status"] == FULL_STATUS
          assert report["identity_channel"] == "final_candidate"
          assert report["settings_namespace"] == "anything-plays-31"
          assert report["source_preview_revision"] == original["source_revision"]
          assert report["native_core_count"] == 11
          assert report["console_profiles"] == 18
          assert report["sha256"] == digest
          assert report["installer"] == binary.name
          assert report["public_release_approved"] is False
          assert report["final_release_approved"] is False
          assert not any(item in report for item in ("final_public_release", "license_approved"))
          print("Verified owner-only FINAL 18-console full installer:", binary.name, digest)
          PY
      - name: Preserve four-platform FINAL full installer for technical review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.1.0-FINAL-FULL-18-${{ matrix.target }}-QA-ONLY
          path: |
            fullfinal/${{ matrix.result }}
            fullfinal/${{ matrix.receipt }}
            fullfinal/SDL_RUNTIME_AUDIT.json
            fullfinal/FINAL_CAMERA_ONLY_OPENCV_SOURCE_QA.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  installed-final-four-os:
    # Launch actual full 18-console frozen app on all four hosted operating
    # systems and audit isolated stable/RC1/RC2 preference directories.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.full-final-18-console.result == 'success' }}
    needs: full-final-18-console
    name: Installed 3.1.0 final identity GUI and preference isolation | all four native hosts
    uses: ./.github/workflows/v31-final-installed-desktop.yml
    with:
      qa_run_id: ${{ github.run_id }}
      source_sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      actions: read
