name: Anything Plays 3.0 | Freeze original native candidate inputs

# Manual research tooling: never distribute binaries or approve rights.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful four-platform full offline installer LAB run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  freeze-native-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require an actual passing test-only four-platform lab
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          run_name="$(gh run view "$SOURCE_RUN_ID" --json name --jq '.name')"
          run_status="$(gh run view "$SOURCE_RUN_ID" --json conclusion --jq '.conclusion')"
          if [[ "$run_name" != "Anything Plays 3.0 | Complete offline installer lab" || "$run_status" != success ]]; then
            echo "::error::Expected a successful full offline 3.0 test lab, not a public candidate"
            exit 1
          fi
      - name: Retrieve all four ORIGINAL test-only native ZIP bundles
        shell: bash
        run: |
          set -euo pipefail
          for target in windows-x64 macos-arm64 macos-x64 linux-x64; do
            gh run download "$SOURCE_RUN_ID" \
              --name "AnythingPlays-3.0.0-NATIVE-INPUTS-UNAPPROVED-$target" \
              --dir "input-artifacts/$target"
          done
      - name: Repackage unmodified GitHub artifact inputs for independent verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          root = Path("input-artifacts")
          out = Path("original-artifacts")
          out.mkdir(exist_ok=True)
          for target in ("windows-x64", "macos-arm64", "macos-x64", "linux-x64"):
              folder = root / target
              files = sorted(folder.iterdir())
              assert len(files) == 13 and all(f.is_file() and not f.is_symlink() for f in files), target
              assert sorted(f.suffix for f in files).count(".zip") == 12, target
              with ZipFile(out / (target + ".zip"), "w", compression=ZIP_STORED) as archive:
                  for file in files:
                      archive.write(file, arcname=file.name)
          PY
      - name: Validate all 48 original archives and generate unapproved lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          python tools/create_v30_candidate_lock.py \
            --windows-x64 original-artifacts/windows-x64.zip \
            --macos-arm64 original-artifacts/macos-arm64.zip \
            --macos-x64 original-artifacts/macos-x64.zip \
            --linux-x64 original-artifacts/linux-x64.zip \
            --output candidate-evidence/v3.0.0-core-candidate-lock.json
          (cd candidate-evidence && sha256sum v3.0.0-core-candidate-lock.json > SHA256SUMS.txt)
          python -m json.tool candidate-evidence/v3.0.0-core-candidate-lock.json >/dev/null
      - name: Retain unapproved candidate lock report, never publish binaries
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.0.0-NATIVE-LOCK-UNAPPROVED
          path: candidate-evidence/*
          if-no-files-found: error
          retention-days: 90
