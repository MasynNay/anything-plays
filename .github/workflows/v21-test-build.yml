name: Anything Plays 2.1 unified TEST build

on:
  push:
    branches: [feature/v2.1-unified-test]
  workflow_dispatch:

# Do not lock all alpha runs behind one GitHub concurrency group:
# a cancelled, stuck macOS runner can otherwise leave newer runs pending.
# The cancel-superseded-v21-builds job handles old test runs explicitly.

permissions:
  contents: read
  actions: write

env:
  AP_RELEASE_BUILD: '0'

jobs:
  cancel-superseded-v21-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only earlier 2.1 test workflow runs on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          current = os.environ["GITHUB_RUN_ID"]
          url = f"repos/{repo}/actions/runs?branch=feature/v2.1-unified-test&per_page=100"
          runs = json.loads(subprocess.check_output(["gh", "api", url], text=True))["workflow_runs"]
          for run in runs:
              if (run["name"] == "Anything Plays 2.1 unified TEST build"
                  and str(run["id"]) != current
                  and run["status"] in ("queued", "in_progress", "waiting", "requested")):
                  message = ((run.get("head_commit") or {}).get("message") or "")
                  if message.startswith("native(dolphin)"):
                      print("Preserving long GameCube native experiment", run["id"])
                      continue
                  subprocess.run(
                      ["gh", "api", "-X", "POST",
                       f"repos/{repo}/actions/runs/{run['id']}/cancel"],
                      check=False,
                  )
                  print("Cancelled superseded test run", run["id"])
          PY
  source-and-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test desktop dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb pulseaudio
          python -m pip install -r requirements.txt
      - name: Compile all source
        run: python -m compileall -q app.py anything_plays tests fetch_mgba_core.py verify_bundle.py
      - name: Run full regression tests
        run: |
          pulseaudio --start --exit-idle-time=-1 || true
          # Preserve Python frame stacks if a native extension segfaults.
          python -X faulthandler -m unittest discover -s tests -v
      - name: Report 2.1 release blockers (development builds may proceed)
        run: python tools/check_v21_release.py --report-only
      - name: Review GameCube open-source homebrew fixture checksum (candidate only)
        continue-on-error: true
        run: python tools/gamecube_homebrew_fixture.py --inspect
      - name: Tk startup, view controls and shutdown smoke test
        run: PYTHONPATH=. xvfb-run -a python tests/smoke_gui.py
      - name: 30-second sustained camera and game redraw soak
        timeout-minutes: 3
        run: |
          PYTHONPATH=. xvfb-run -a python tests/soak_gui.py \
            --seconds 30 --max-growth-mb 96 \
            --report test-evidence/soak-gui-30s.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-2.1.0-alpha1-UI-soak-evidence
          path: test-evidence/soak-gui-30s.json
          if-no-files-found: warn
          retention-days: 21

  windows-test-installer:
    env:
      AP_V21_MINIMAL_CORE_BUILD: '1'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build 2.1 Windows installer with the mGBA starter core
        shell: cmd
        run: call build_windows.bat
      - name: Inspect exact mGBA-only starter bundle
        run: python tools/binary_inventory.py windows-x86_64 dist/AnythingPlays test-evidence/windows-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-2.1.0-alpha1-Windows-x64-TEST
          path: |
            release/AnythingPlaysSetup-2.1.0-alpha.1.exe
            test-evidence/windows-x86_64.json
          if-no-files-found: error
          retention-days: 21

  macos-test-installer:
    env:
      AP_V21_MINIMAL_CORE_BUILD: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build 2.1 macOS DMG with the mGBA starter core
        run: bash build_macos_dmg.sh
      - name: Inspect staged test app
        run: python tools/binary_inventory.py macos-${{ matrix.arch }} dist/AnythingPlays21Test.app test-evidence/macos-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-2.1.0-alpha1-macOS-${{ matrix.arch }}-TEST
          path: |
            release/AnythingPlays-2.1.0-alpha.1.dmg
            test-evidence/macos-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 21

  linux-test-installer:
    env:
      AP_V21_MINIMAL_CORE_BUILD: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux build requirements
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends python3-tk python3-venv dpkg-dev libgl1 libegl1 libglib2.0-0 libportaudio2 xvfb
      - name: Build 2.1 Debian package with the mGBA starter core
        run: bash build_linux_deb.sh
      - name: Verify alpha DEB package identity and launch entry
        run: |
          test "$(dpkg-deb -f 'release/anything-plays-test_2.1.0~alpha1_amd64.deb' Package)" = 'anything-plays-test'
          dpkg-deb -c 'release/anything-plays-test_2.1.0~alpha1_amd64.deb' | grep -F '/usr/bin/anything-plays-21-test'
          dpkg-deb -c 'release/anything-plays-test_2.1.0~alpha1_amd64.deb' | grep -F '/usr/share/applications/anything-plays-test.desktop'
      - name: Inspect Linux test installation
        run: python tools/binary_inventory.py linux-x86_64 dist/AnythingPlays test-evidence/linux-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-2.1.0-alpha1-Linux-x64-TEST
          path: |
            release/anything-plays-test_2.1.0~alpha1_amd64.deb
            test-evidence/linux-x86_64.json
          if-no-files-found: error
          retention-days: 21

  gamecube-runtime-diagnostics:
    # Separate fast native test: unlike installer packaging, this fails when
    # a REAL open-source GameCube game crashes or never produces video.
    # A release with eight embedded consoles cannot ignore this red job.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AP_V21_TEST_CORES: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Dolphin native debug dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gdb xvfb libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Prepare exact test cores and Dolphin Sys data
        run: python fetch_mgba_core.py
      - name: Boot licensed GameCube homebrew inside Dolphin and capture native backtrace
        id: dolphin_default
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_homebrew.py \
            --core cores/dolphin_libretro.so --seconds 12 \
            --debugger --report test-evidence/gamecube-homebrew-gdb.json
      - name: Compare cached interpreter against default crash
        id: dolphin_cached
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_homebrew.py \
            --core cores/dolphin_libretro.so --seconds 12 --cpu-core 5 \
            --debugger --report test-evidence/gamecube-homebrew-cached-gdb.json
      - name: Require actual playable GameCube output
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = [
              Path("test-evidence/gamecube-homebrew-gdb.json"),
              Path("test-evidence/gamecube-homebrew-cached-gdb.json"),
          ]
          for candidate in candidates:
              if not candidate.is_file():
                  print("Missing GameCube native diagnostic:", candidate)
                  continue
              evidence = json.loads(candidate.read_text())
              details = evidence.get("details") or {}
              print(candidate.name, "exit=", evidence.get("child_returncode"),
                    "timeout=", evidence.get("timed_out"),
                    "frames=", details.get("video_callback_frames"),
                    "nonblank=", details.get("nonblank_sampled_frames"),
                    "fps=", details.get("frames_per_second_observed"),
                    "pass=", evidence.get("probe_passed"))
          if not any(
              json.loads(candidate.read_text()).get("probe_passed") is True
              for candidate in candidates if candidate.is_file()
          ):
              raise SystemExit("Dolphin GameCube native playback remains unverified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-2.1-GameCube-native-debug-evidence
          path: |
            test-evidence/gamecube-homebrew-gdb.json
            test-evidence/gamecube-homebrew-cached-gdb.json
            test-evidence/gamecube-homebrew-frame.png
          if-no-files-found: warn
          retention-days: 21

  core-pack-cross-platform-tests:
    # Verify the in-app updater's path, hash, rollback and approval gates on
    # native Windows and both Mac architectures. Linux runs these tests in
    # source-and-gui. This job downloads NO runnable emulator binary.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify approved core-pack installation and rollback off-line
        run: |
          python -m unittest discover -s tests -p "test_v21_core*.py" -v
          python -m unittest discover -s tests -p "test_v21_create_core_packs.py" -v

  n64-homebrew-playback:
    # Independent playable-video evidence using Unlicensed/public-domain ROM;
    # never include the fixture or download it in a player installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AP_V21_TEST_CORES: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare bundled N64 test core and headless dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            xvfb libgl1 libegl1 libx11-6 libxi6 libxrandr2 libportaudio2
          python -m pip install -r requirements.txt
          python -c "from fetch_mgba_core import fetch_core; fetch_core('parallel_n64')"
      - name: Boot pinned public-domain N64 homebrew and require nonblank video
        timeout-minutes: 2
        run: |
          mkdir -p test-evidence
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_n64_homebrew.py \
            --core cores/parallel_n64_libretro.so --seconds 20 \
            --report test-evidence/n64-homebrew-playback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-2.1-N64-real-homebrew-evidence
          path: |
            test-evidence/n64-homebrew-playback.json
            test-evidence/n64-homebrew-frame.png
          if-no-files-found: warn
          retention-days: 14

  n64-homebrew-cross-platform:
    # Same pinned public-domain homebrew / in-panel software video path on
    # Windows and both macOS architectures. Still not clean-installed game QA.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            ext: dll
          - os: macos-15
            ext: dylib
          - os: macos-15-intel
            ext: dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      AP_V21_TEST_CORES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies and platform-native bundled N64 core
        run: |
          python -m pip install -r requirements.txt
          python -c "from fetch_mgba_core import fetch_core; fetch_core('parallel_n64')"
      - name: Verify pinned public-domain N64 homebrew video in embedded core
        timeout-minutes: 2
        run: |
          python -X faulthandler tools/probe_n64_homebrew.py --core cores/parallel_n64_libretro.${{ matrix.ext }} --seconds 20 --report test-evidence/n64-homebrew-playback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-2.1-N64-${{ matrix.os }}-real-video-evidence
          path: |
            test-evidence/n64-homebrew-playback.json
            test-evidence/n64-homebrew-frame.png
          if-no-files-found: warn
          retention-days: 14

  gamecube-opengl-experiment:
    # Research-only Linux frontend: hidden EGL core GL context + FBO readback.
    # Tests the already bundled *unmodified* Dolphin Libretro core. Never
    # silently toggles real player settings or publishes experimental cores.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'native(gl)') || contains(github.event.head_commit.message, 'fix(dolphin)') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AP_V21_TEST_CORES: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '4.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated EGL/GL test prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            xvfb libgl1 libegl1 libgl1-mesa-dri libx11-6 libxi6 libxrandr2 libportaudio2
          python -m pip install -r requirements.txt
          mkdir -p test-evidence
      - name: Smoke-test real offscreen OpenGL context and owned framebuffer
        run: |
          PYTHONPATH=. xvfb-run -a python -X faulthandler tools/smoke_gamecube_opengl.py
      - name: Retrieve bundled Dolphin and its Sys files (CI only)
        run: |
          python -c "from fetch_mgba_core import fetch_core; fetch_core('dolphin')"
          python tools/fetch_dolphin_sys.py cores > test-evidence/gc-opengl-sys-source.json
      - name: Probe accelerated Dolphin homebrew with default JIT
        id: accelerated_jit
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PYTHONUNBUFFERED=1 PYTHONPATH=. xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_gl.py \
            --core cores/dolphin_libretro.so --seconds 20 \
            --report test-evidence/gamecube-opengl-jit.json
      - name: Probe accelerated Dolphin with cached interpreter (diagnostic)
        id: accelerated_interpreter
        if: always() && steps.accelerated_jit.outcome != 'cancelled'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PYTHONUNBUFFERED=1 PYTHONPATH=. xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_gl.py \
            --core cores/dolphin_libretro.so --cpu-core 5 --seconds 15 \
            --report test-evidence/gamecube-opengl-cached.json
      - name: Diagnose frame-step synchronization with single-core JIT
        id: accelerated_single_jit
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PYTHONUNBUFFERED=1 PYTHONPATH=. xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_gl.py \
            --core cores/dolphin_libretro.so --single-core --seconds 20 \
            --report test-evidence/gamecube-opengl-single-jit.json
      - name: Diagnose single-core cached interpreter as fallback
        id: accelerated_single_cached
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PYTHONUNBUFFERED=1 PYTHONPATH=. xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_gl.py \
            --core cores/dolphin_libretro.so --single-core --cpu-core 5 --seconds 20 \
            --report test-evidence/gamecube-opengl-single-cached.json
      - name: Require real nonblank playable-speed GameCube frames
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = [
              Path("test-evidence/gamecube-opengl-jit.json"),
              Path("test-evidence/gamecube-opengl-cached.json"),
              Path("test-evidence/gamecube-opengl-single-jit.json"),
              Path("test-evidence/gamecube-opengl-single-cached.json"),
          ]
          for report in reports:
              if not report.is_file():
                  print("Missing experimental evidence:", report)
                  continue
              data = json.loads(report.read_text())
              print(report, "passed=", data.get("passed"),
                    "details=", data.get("details"))
          if not any(
              json.loads(path.read_text()).get("passed") is True
              for path in reports if path.is_file()
          ):
              raise SystemExit("OpenGL GameCube rendering remains unverified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-2.1-GameCube-offscreen-OpenGL-experiment
          path: |
            test-evidence/gamecube-opengl-jit.json
            test-evidence/gamecube-opengl-cached.json
            test-evidence/gamecube-opengl-single-jit.json
            test-evidence/gamecube-opengl-single-cached.json
            test-evidence/gamecube-opengl-frame-*.png
            test-evidence/gamecube-opengl-first-*.png
            test-evidence/gc-opengl-sys-source.json
          if-no-files-found: warn
          retention-days: 14

  gamecube-patched-native-experiment:
    # Compile from GPL source only when a native(dolphin) change is submitted.
    # This is a developer test; it does not add unaudited modified binaries
    # to any public Anything Plays installer.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'native(dolphin)') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AP_DOLPHIN_BUILD_JOBS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Dolphin source-build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git gdb xvfb \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxrandr-dev \
            libudev-dev libusb-1.0-0-dev libcurl4-openssl-dev \
            liblzma-dev zlib1g-dev libportaudio2 ccache
          python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: dolphin-v21-ubuntu24-${{ github.sha }}
          restore-keys: |
            dolphin-v21-ubuntu24-
      - name: Limit and report native compiler cache
        run: |
          ccache -M 1G
          ccache -s
      - name: Build patched Dolphin Libretro from reviewed upstream GPL source
        id: build_dolphin
        timeout-minutes: 70
        run: |
          mkdir -p test-evidence
          # Retain compiler diagnostics even when this experimental build fails.
          set -o pipefail
          bash tools/build_patched_dolphin_core.sh 2>&1 | tee test-evidence/gamecube-native-build.log
      - name: Probe modified Dolphin with pinned GameCube homebrew
        timeout-minutes: 4
        run: |
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_homebrew.py \
            --core "$RUNNER_TEMP/anything-plays-dolphin-native/cores/dolphin_libretro.so" \
            --seconds 20 --debugger \
            --report test-evidence/gamecube-patched-homebrew.json
      - name: Diagnose generated-JIT crash with cached interpreter (not a release pass)
        if: always() && steps.build_dolphin.outcome == 'success'
        timeout-minutes: 4
        run: |
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_homebrew.py \
            --core "$RUNNER_TEMP/anything-plays-dolphin-native/cores/dolphin_libretro.so" \
            --seconds 20 --cpu-core 5 --exercise-controls --debugger \
            --report test-evidence/gamecube-cached-interpreter.json
      - name: Probe patched software renderer with synchronous CPU/GPU and controller stimuli
        if: always() && steps.build_dolphin.outcome == 'success'
        timeout-minutes: 4
        run: |
          PYTHONUNBUFFERED=1 xvfb-run -a python -X faulthandler \
            tools/probe_gamecube_homebrew.py \
            --core "$RUNNER_TEMP/anything-plays-dolphin-native/cores/dolphin_libretro.so" \
            --seconds 20 --cpu-core 5 --single-core --exercise-controls --debugger \
            --report test-evidence/gamecube-singlecore-cached.json
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ~/.cache/ccache
          key: dolphin-v21-ubuntu24-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnythingPlays-2.1-patched-Dolphin-experiment-evidence
          path: |
            test-evidence/gamecube-native-build.log
            test-evidence/gamecube-patched-homebrew.json
            test-evidence/gamecube-cached-interpreter.json
            test-evidence/gamecube-singlecore-cached.json
            test-evidence/gamecube-homebrew-frame.png
            ${{ runner.temp }}/anything-plays-dolphin-native/dolphin-core-sha256.txt
          if-no-files-found: warn
          retention-days: 14

  optional-core-pack-candidates:
    # Independent native-core downloads, NOT shipped inside the small installer.
    # This workflow never marks a candidate as approved or publishes a release.
    # Maintainers must individually audit sources, licenses, installed gameplay,
    # audio, controls, saves and signatures before publishing official assets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      AP_V21_CORE_PACK_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve separate platform-matched native core candidates
        run: python fetch_mgba_core.py
      - name: Create checksum-verified UNAPPROVED optional packages
        run: |
          python tools/create_core_packs.py --release v2.1.0-alpha.2 --output release/core-packs
      - uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-2.1-UNAPPROVED-core-candidates-${{ matrix.target }}
          path: release/core-packs/*.zip
          if-no-files-found: error
          retention-days: 14
