name: 3.3.1 | Stream creator scene library
on:
  pull_request:
    paths:
      - '.github/workflows/v331-stream-scenes-qa.yml'
      - 'anything_plays/ui_stream.py'
      - 'anything_plays/stream_scenes.py'
      - 'anything_plays/ui_stream_scenes.py'
      - 'tests/test_v331_stream_scenes*.py'
permissions:
  contents: read
jobs:
  scenes:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Scene settings | ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: windows-x64, runner: windows-latest}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - name: Verify scene storage and existing Stream Mode contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v331_stream_scenes.py' -v
          python -m unittest discover -s tests -p 'test_v31_stream_mode.py' -v
  real-tk:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Actual Tk creator scene window | Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5"
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: xvfb-run -a python -m unittest discover -s tests -p 'test_v331_stream_scenes_ui.py' -v
