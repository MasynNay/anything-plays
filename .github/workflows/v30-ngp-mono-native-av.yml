name: Anything Plays 3.0 | Authentic original mono K1GE video + PSG audio

# Research only: no ROMs/BIOS/sound samples/native libraries in artifacts.
on:
  pull_request:
    branches: [feature/v3.0-unified-test]
    paths:
      - '.github/workflows/v30-ngp-mono-native-av.yml'
      - 'tools/build_v30_ngp_mono_native_av.py'
      - 'tools/probe_v30_ngp_mono_native_av.py'
      - 'tests/test_v30_ngp_mono_native_av.py'
      - 'tools/build_v30_ngp_original_mono_psg.py'
  push:
    branches: [feature/v3.0-unified-test]
    paths:
      - '.github/workflows/v30-ngp-mono-native-av.yml'
      - 'tools/build_v30_ngp_mono_native_av.py'
      - 'tools/probe_v30_ngp_mono_native_av.py'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ngp-native-mono-original-av-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-native-mono-audio-video-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AP_V30_TEST_CORES: '1'
      AP_RELEASE_BUILD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native NeoPop test dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libportaudio2
          python -m pip install -r requirements.txt
      - name: Verify byte-exact mono K1GE/PSG construction and zero false acceptance
        run: |
          python -m unittest discover -s tests -p 'test_v30_ngp_mono_native_av.py' -v
          python -m unittest discover -s tests -p 'test_v30_ngp_original_mono_psg.py' -v
      - name: Fetch test-only actual NeoPop native core and record exact hash
        run: |
          python -c "from fetch_mgba_core import fetch_core; fetch_core('mednafen_ngp')"
          test -s cores/mednafen_ngp_libretro.so
          sha256sum cores/mednafen_ngp_libretro.so
      - name: Exercise actual native K1GE monochrome video, PSG PCM, and input events
        run: |
          python -m tools.probe_v30_ngp_mono_native_av \
            --core cores/mednafen_ngp_libretro.so \
            --output actual-mono-av-evidence \
            --seconds 12
      - name: Verify real native measured metrics and forbid game/native artifact uploads
        shell: bash
        run: |
          set -euo pipefail
          (cd actual-mono-av-evidence && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('actual-mono-av-evidence')
          j=json.loads((p/'NGP_ORIGINAL_MONO_K1GE_NATIVE_AV_UNAPPROVED.json').read_text('utf-8'))
          assert j['status']=='ORIGINAL-MONO-K1GE-PSG-NATIVE-AV-UNAPPROVED'
          assert j['mono_cartridge_header_value']==0
          assert j['generator_incorporates_upstream_source_verified_psg_enable'] is True
          assert all(j[f] is False for f in (
              'public_distribution_approved',
              'public_release_approved',
              'license_compatibility_reviewed',
              'physical_speaker_or_retail_gameplay_verified',
              'all_four_platforms_verified',
              'cartridge_flash_save_verified',
          ))
          assert {x.name for x in p.iterdir()} == {
              'NGP_ORIGINAL_MONO_K1GE_NATIVE_AV_UNAPPROVED.json', 'SHA256SUMS.txt'}
          m=j['native_metrics']
          assert j['audio_verified_in_native_test'] is bool(m and m['audio_gate_passed'])
          assert j['changing_monochrome_video_verified_in_native_test'] is bool(m and m['video_gate_passed'])
          assert j['native_manual_and_camera_input_query_verified'] is bool(m and m['input_gate_passed'])
          assert j['full_native_audio_video_input_verified'] is bool(
              m and m['passed'] and j['actual_native_exit']==0)
          if j['changing_monochrome_video_verified_in_native_test']:
              assert m['sampled_nonblank_frames']>=3
              assert m['distinct_nonblank_frames']>=2
          if j['audio_verified_in_native_test']:
              assert m['native_nonzero_pcm_values']>100
              assert m['native_audio_peak']>0
          print('ACTUAL native K1GE video frames:',m['sampled_nonblank_frames'] if m else None)
          print('ACTUAL distinct nonblank frames:',m['distinct_nonblank_frames'] if m else None)
          print('ACTUAL native nonzero PCM:',m['native_nonzero_pcm_values'] if m else None)
          print('ACTUAL complete local A/V/input:',j['full_native_audio_video_input_verified'])
          if not j['full_native_audio_video_input_verified']:
              print('Original mono K1GE/A/V research incomplete; keep release gate blocked')
          PY
      - name: Retain ONLY unapproved native metrics and checksum, never a ROM or app
        uses: actions/upload-artifact@v4
        with:
          name: AnythingPlays-3.0.0-ORIGINAL-MONO-K1GE-AV-RESEARCH-UNAPPROVED
          path: |
            actual-mono-av-evidence/NGP_ORIGINAL_MONO_K1GE_NATIVE_AV_UNAPPROVED.json
            actual-mono-av-evidence/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60
